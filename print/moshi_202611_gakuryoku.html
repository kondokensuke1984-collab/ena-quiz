<script>
const EXAM = {"rika": [{"id": "ta1_b02", "subject": "tane1_kihon", "month": "202611", "type": "selfjudge", "qImage": "../images/tane1_b1_mame.jpg", "q": "図はインゲンマメの種子の断面です。図のア〜エの部分の名前をそれぞれ答えなさい。", "answer": "ア：幼芽、イ：胚じく、ウ：幼根、エ：子葉", "explanation": "胚は「幼芽・胚じく・幼根」の3つからできています。幼芽は発芽後に葉や茎に、胚じくは茎に、幼根は根になります。エの子葉は養分をたくわえる部分です。"}, {"id": "ta1_b05", "subject": "tane1_kihon", "month": "202611", "type": "selfjudge", "q": "次の植物の中から、有胚乳種子をすべて選び、記号で答えなさい。\nア インゲンマメ　イ トウモロコシ　ウ アサガオ　エ カキ　オ イネ", "answer": "イ、エ、オ", "explanation": "有胚乳種子は、トウモロコシ・カキ・イネです。\n【ポイント】カキは双子葉類なのに有胚乳種子という例外です（オシロイバナも同じ）。インゲンマメ・アサガオは無胚乳種子です。"}, {"id": "ta1_b12", "subject": "tane1_kihon", "month": "202611", "type": "selfjudge", "q": "多くの植物の種子が発芽するために必要な条件を3つ答えなさい。", "answer": "水、空気（酸素）、適当な温度", "explanation": "発芽の3条件は「水」「空気（酸素）」「適当な温度」です。通常、日光や肥料は必要ありません（種子の中に養分がたくわえられているため）。"}, {"id": "ta1_b16", "subject": "tane1_kihon", "month": "202611", "q": "インゲンマメとトウモロコシの発芽のようすについて述べた文として、正しいものはどれですか。", "options": ["ア：インゲンマメは、発芽すると子葉が1枚だけ地上に出てくる。", "イ：トウモロコシは、発芽すると子葉が2枚地上に出てくる。", "ウ：どちらも、発芽するときは、くきがはじめに土から出てくる。", "エ：どちらも、発芽するときは、根がはじめに土の中へ伸びていく。"], "answer": 3, "explanation": "インゲンマメ・トウモロコシのどちらも、まず根が出てから芽が伸びます。インゲンマメは子葉が2枚、トウモロコシは子葉が1枚（地上には出ない）です。"}, {"id": "ta1_r06", "subject": "tane1_renshu", "month": "202611", "qImage": "../images/tane1_r1_fig3.jpg", "q": "インゲンマメが発芽するときのようすとして、正しいものはどれですか。", "options": ["ア", "イ", "ウ", "エ", "オ"], "answer": 3, "explanation": "インゲンマメは双子葉類なので、子葉は2枚で、根は主根と側根があります。また、インゲンマメの子葉は地上に出ます。"}, {"id": "ta1_k02", "subject": "tane1_kakomon", "month": "202611", "q": "種子の発芽に空気が必要な理由として最もふさわしいものを選びなさい。", "options": ["ア：取りこんだ空気が、水を吸いすぎるのを防ぐから。", "イ：取りこんだ空気が、根をふくらませるから。", "ウ：種子が、空気中の酸素を取りこみ呼吸をするから。", "エ：種子が、空気中の二酸化炭素を取りこみ光合成をするから。"], "answer": 2, "explanation": "発芽したばかりの種子は、光合成を行わず、呼吸だけを行います。呼吸には空気中の酸素が必要です。"}, {"id": "ta2_b02", "subject": "tane2_kihon", "month": "202611", "type": "selfjudge", "q": "ヨウ素液を用いると、何という養分が種子にふくまれていることを確かめられますか。", "answer": "でんぷん", "explanation": "ヨウ素液はでんぷんがあると色が変わる薬品です。"}, {"id": "ta2_b08", "subject": "tane2_kihon", "month": "202611", "q": "インゲンマメの種子は、発芽に必要な養分をどこの部分にたくわえていますか。", "options": ["ア：種皮", "イ：幼芽", "ウ：子葉", "エ：胚乳"], "answer": 2, "explanation": "インゲンマメは無胚乳種子で、養分を子葉にたくわえています。"}, {"id": "ta2_b14", "subject": "tane2_kihon", "month": "202611", "type": "selfjudge", "q": "子葉が2枚の植物を、次のア〜オから2つ選び、記号で答えなさい。\nア イネ　イ ヘチマ　ウ ユリ　エ ホウセンカ　オ ネギ", "answer": "イ、エ", "explanation": "子葉が2枚の植物は、アサガオ・ヘチマ・ホウセンカ・ダイズ・インゲンマメ・ヒマワリ・カキ・アブラナなどです（双子葉類）。"}, {"id": "ta2_r15", "subject": "tane2_renshu", "month": "202611", "qImage": "../images/tane2_r2_fig2.jpg", "q": "図2のア〜エの中で、トウモロコシの発芽の様子として正しいものを1つ選びなさい。", "options": ["ア", "イ", "ウ", "エ"], "answer": 1, "explanation": "トウモロコシは子葉が1枚で、根は同じところから細い根（ひげ根）が出てきます。"}, {"id": "jk1_b02", "subject": "jouken1_kihon", "month": "202611", "q": "日光を当てずに育てたインゲンマメの葉やくきの色は、どうなりますか。", "options": ["ア：うすい黄色になる", "イ：こい緑色になる", "ウ：透明になる", "エ：白色になる"], "answer": 0, "explanation": "日光が当たらないと光合成ができず、葉の緑色（葉緑体）が育ちません。葉やくきは黄色っぽくなり、やがてかれてしまいます。"}, {"id": "jk1_b06", "subject": "jouken1_kihon", "month": "202611", "q": "植物の葉の成長に特に役立つのは、窒素・リン酸・カリウムのうちどれですか。", "options": ["窒素", "リン酸", "カリウム"], "answer": 0, "explanation": "肥料の3要素のうち、窒素は葉の成長に役立ちます（窒素肥料＝「葉肥」）。"}, {"id": "jk1_b15", "subject": "jouken1_kihon", "month": "202611", "q": "日光に向かって曲がる、くきの性質を何と呼びますか。", "options": ["ア：負の光屈性", "イ：正の光屈性", "ウ：光傾性", "エ：正の重力屈性"], "answer": 1, "explanation": "刺激に向かって曲がるときは「正」、刺激から遠ざかるときは「負」をつけます。くきは日光に向かって曲がるので「正の光屈性」です。"}, {"id": "jk1_r03", "subject": "jouken1_renshu", "month": "202611", "qImage": "../images/jouken1_r1_fig.jpg", "q": "ア〜ウの条件でヒマワリを数日間育てました。もっともよく成長するのはどれですか。", "options": ["ア", "イ", "ウ"], "answer": 0, "explanation": "成長には日光と肥料が必要です。両方がそろっているアがもっともよく成長します。"}, {"id": "jk1_k01", "subject": "jouken1_kakomon", "month": "202611", "q": "太郎君は、インゲンマメの種子が発芽する様子を観察しました。太郎君は、発芽に必要な養分が種子の中にたくわえられていることを学びました。\nインゲンマメの種子の中の養分が発芽のために使われていることを確かめるために、インゲンマメの発芽前の種子と発芽後の子葉をそれぞれ切り、ヨウ素液によって青むらさき色に染まるかを調べました。その実験結果として適切なものを選びなさい。", "options": ["ア：発芽前の種子はうすく染まり、発芽後の子葉もうすく染まった。", "イ：発芽前の種子はうすく染まり、発芽後の子葉はこく染まった。", "ウ：発芽前の種子はこく染まり、発芽後の子葉はうすく染まった。", "エ：発芽前の種子はこく染まり、発芽後の子葉もこく染まった。"], "answer": 2, "explanation": "インゲンマメの子葉にはデンプンがふくまれますが、発芽のために使われるので、発芽後の方が発芽前より青むらさき色がうすくなります。"}, {"id": "jk2_b01", "subject": "jouken2_kihon", "month": "202611", "q": "ジャガイモは、いものくぼみから何が出てきて成長しますか。", "options": ["ア：花", "イ：葉と根", "ウ：芽と根", "エ：くきと花"], "answer": 2, "explanation": "ジャガイモのいもは「くき」が変化した部分です。1つのいものくぼみから芽と根が出て成長します。"}, {"id": "jk2_b12", "subject": "jouken2_kihon", "month": "202611", "q": "光合成によって、植物が自分でつくる養分は何ですか。", "options": ["ア：水", "イ：酸素", "ウ：でんぷん", "エ：二酸化炭素"], "answer": 2, "explanation": "光合成でつくられる養分はでんぷんです。"}, {"id": "jk2_b16", "subject": "jouken2_kihon", "month": "202611", "q": "風によって花粉が運ばれる植物を何とよびますか。", "options": ["ア：完全花", "イ：不完全花", "ウ：虫媒花", "エ：風媒花"], "answer": 3, "explanation": "風に運ばれるのが風媒花（イネ・トウモロコシなど）、こん虫に運ばれるのが虫媒花です。完全花は、花びら・がく・おしべ・めしべの4つがそろった花のことです。"}, {"id": "jk2_r08", "subject": "jouken2_renshu", "month": "202611", "qImage": "../images/jouken2_r2_flower.jpg", "q": "花粉ができる部分はどこですか。図1のア〜クの中から1つ選びなさい。", "options": ["ア", "イ", "ウ", "エ", "オ", "カ", "キ", "ク"], "answer": 1, "explanation": "花粉ができるのは、おしべの先にある「やく」（イ）です。"}, {"id": "jk2_r13", "subject": "jouken2_renshu", "month": "202611", "qImage": "../images/jouken2_r2_kogo.jpg", "q": "図2の（う）にあてはまるものは何ですか。最も適切なものを選びなさい。", "options": ["ア：熱", "イ：風", "ウ：光", "エ：葉緑体"], "answer": 2, "explanation": "光合成は「光のエネルギー」を使っておこなわれます。"}], "shakai": [{"id": "nog6_01", "subject": "nougyou6_kihon", "month": "202611", "type": "selfjudge", "q": "和風の食事に代わり、洋風の食事をする機会が増えたことを何といいますか。", "answer": "食の欧米化（洋風化、西洋化）", "explanation": "昔の日本では米が食生活の中心でした。くらしがゆたかになると、肉や油脂類の多い洋風の食事をする機会が増えました。これを食の欧米化（洋風化・西洋化）といいます。そのため米を食べる量は減り、いろいろな農産物を食べるようになりました。"}, {"id": "nog6_04", "subject": "nougyou6_kihon", "month": "202611", "type": "selfjudge", "q": "「食料の重さ×運んだ距離」で求められるフードマイレージは、日本の場合、大きいですか、小さいですか。", "answer": "大きい", "explanation": "日本は食料をたくさん輸入していて、遠くの国から運んでくるものも多いので、フードマイレージはほかの国とくらべても大きくなります。"}, {"id": "nog6_07", "subject": "nougyou6_kihon", "month": "202611", "type": "selfjudge", "q": "一つの国で消費される食料のうち、どのくらいがその国内で生産されているかという割合のことを何といいますか。", "answer": "食料自給率", "explanation": "国内で消費する食料のうち、国内で生産できている割合を食料自給率といいます。"}, {"id": "nog6_11", "subject": "nougyou6_kihon", "month": "202611", "type": "selfjudge", "qImage": "../images/nougyou6_b2_graph.jpg", "q": "次のグラフは、農産物の輸入量の変化を表したものです。日本国内で最も多く輸入されているアの品目名を答えなさい。", "answer": "小麦", "explanation": "グラフで一番上にある（輸入量が最も多い）アは小麦です。小麦はパンやめん類の原料で、国内ではあまり作られていないため、多くを輸入にたよっています。"}, {"id": "nog6_r02", "subject": "nougyou6_renshu", "month": "202611", "qImage": "../images/nougyou6_r1_table.jpg", "q": "次の表は日本の食料自給率です。表中の（a）にあてはまる数字を、次のア〜エから一つ選び、記号で答えなさい。", "options": ["ア：33", "イ：53", "ウ：73", "エ：93"], "answer": 1, "explanation": "肉類の自給率は1960年の91％から下がり続け、2021年には53％になっています。表の「総合」が79→38％と下がっていることや、食の欧米化で肉の輸入が増えたことから考えます。よって答えはイです。"}, {"id": "nog6_r04", "subject": "nougyou6_renshu", "month": "202611", "q": "次のア〜エのうち、食料の輸入がもたらす影響として正しくないものを一つ選び、記号で答えなさい。", "options": ["ア：世界各地からの輸入によって、さまざまな食料を安い値段で確保することができる。", "イ：輸入にたよりすぎると相手国で災害などがあった場合、食生活が不安定になる。", "ウ：食料を輸入して外国産の安い食料が増えることで、国産の食料との競争がはげしくなる。", "エ：輸入により大量の食料を運ぶときに、石油などの燃料が多く使われ、フードマイレージが低くなり、環境への負担を減らすことになる。"], "answer": 3, "explanation": "エは誤りです。輸入で大量の食料を運ぶと石油などの燃料をたくさん使い、フードマイレージは高くなって、環境への負担は増えます。ア・イ・ウは正しい文です。"}, {"id": "nog6_k01", "subject": "nougyou6_kakomon", "month": "202611", "type": "selfjudge", "qImage": "../images/nougyou6_k1_mileage.jpg", "q": "次のグラフは各国のフードマイレージを示したものです。日本のフードマイレージは先進国の中でも非常に大きな値となっています。日本のフードマイレージの値が大きい理由を説明しなさい。\n※フードマイレージ…輸入食料の総重量と輸送距離を掛け合わせたもの", "answer": "（例）日本は食料自給率が低く、様々な国から多くの農畜産物を輸入しているためフードマイレージの値が大きくなっている。", "explanation": "フードマイレージは「輸入食料の重さ×輸送距離」です。日本は食料自給率が低く、多くの食料を（遠くの国も含めて）輸入しているので大きくなります。「自給率が低い」「たくさん輸入している」の2点が書けていれば正解です。"}, {"id": "nog6_k03", "subject": "nougyou6_kakomon", "month": "202611", "q": "日本や世界の食料問題について述べた文として誤っているものを、次のあ〜えから1つ選び、記号で答えなさい。", "options": ["あ：日本では、米は高い関税で保護されているので、野菜よりも自給率が高い。", "い：食料の輸入量が増えると、フードマイレージが小さくなり環境への負荷が強まる。", "う：バイオ燃料が広まると、食料不足や食料価格の上昇が起こることがある。", "え：世界では、農地が砂漠化して食料生産が打撃を受けている地域がある。"], "answer": 1, "explanation": "いが誤りです。輸入量が増えるとフードマイレージは「大きく」なります（小さくはなりません）。\nあ：米の自給率は98％、野菜は79％で正しい。う：とうもろこしなどが燃料に回ると食料が不足して値上がりすることがあり正しい。え：砂漠化は世界の問題で正しい。よって誤りは「い」です。"}, {"id": "rin_01", "subject": "ringyo_kihon", "month": "202611", "type": "selfjudge", "q": "地図記号では「Λ」とあらわされる、細長い葉をもつ樹木の森林を何といいますか。", "answer": "針葉樹林", "explanation": "細長い葉をもつすぎ・まつ・ひのきなどの森林を針葉樹林といいます。成長が早くまっすぐのびるので、木材生産のためにたくさん植林されてきました。"}, {"id": "rin_04", "subject": "ringyo_kihon", "month": "202611", "type": "selfjudge", "q": "森林のはたらきのうち、二酸化炭素を吸収し、生物に必要な酸素をつくることを何といいますか。", "answer": "光合成", "explanation": "植物が光を受けて二酸化炭素と水から養分と酸素をつくるはたらきを光合成といいます。"}, {"id": "rin_07", "subject": "ringyo_kihon", "month": "202611", "type": "selfjudge", "q": "植えた木の一部を伐採して、本数を調整し、残った木を生育させることを何といいますか。", "answer": "間伐", "explanation": "木がこみすぎないように一部を切って、残った木を太く育てる作業が間伐です。間伐された木材も資源として利用が進められています。"}, {"id": "rin_11", "subject": "ringyo_kihon", "month": "202611", "type": "selfjudge", "qImage": "../images/ringyo_b2_map.jpg", "q": "地図のア〜カのうち、天然の三大美林にあてはまるものを三つ選びなさい。", "answer": "ア、イ、エ", "explanation": "天然の三大美林は、秋田のすぎ（秋田県＝ア）、青森のひば（青森県＝イ）、木曽のひのき（長野県＝エ）です。"}, {"id": "rin_r02", "subject": "ringyo_renshu", "month": "202611", "q": "「間伐」はなぜ必要なのですか。次のア〜エから正しいものを1つ選びなさい。", "options": ["ア：日光が森林の中に入るようにし、樹木を健康に育てるため。", "イ：樹木をまっすぐにのばし、材木としての価値を高めるため。", "ウ：雑草を生やさないようにし、樹木に栄養をあたえるため。", "エ：細い木は価値が高いため、収入を増やすことができるから。"], "answer": 0, "explanation": "間伐は、木が増えすぎてこみあった森の木の本数を減らして、日光が森の中に入るようにし、残った木を健康に太く育てる作業です。イ・ウは別の作業（枝うち・下草がり）の説明で、エは誤りです。"}, {"id": "rin_r07", "subject": "ringyo_renshu", "month": "202611", "q": "天然の三大美林にふくまれないものを次から1つ選び、記号で答えなさい。", "options": ["ア：天竜のすぎ", "イ：秋田のすぎ", "ウ：青森のひば", "エ：木曽のひのき"], "answer": 0, "explanation": "天竜のすぎ（静岡県）は人工の三大美林です。天然の三大美林は、秋田のすぎ・青森のひば・木曽のひのきです。"}, {"id": "rin_k03", "subject": "ringyo_kakomon", "month": "202611", "q": "日本の森林や林業の特徴について述べた次の文章ア〜エのうち、正しいものを1つ選び、記号で答えなさい。", "options": ["ア：森林のもつ役割には、木材の供給以外に、洪水を防止することや海の漁場へ運ばれる養分を育てることなどが含まれている。", "イ：日本の森林を天然林と人工林に分けたとき、人工林の樹種は天然林の樹種と比べて圧倒的に広葉樹が多い。", "ウ：近年は国内産の木材の生産費が外国産に比べて安くなったので、外国産よりも国内産の木材の方が多量に使われるようになってきた。", "エ：森林の管理作業には、植林や伐採以外にも下草がりや間伐など多くの労働力が必要になるので、近年は林業に従事する人の数が増加している。"], "answer": 0, "explanation": "アが正しい。森林には、水をたくわえて洪水を防ぐ（緑のダム）、養分を川や海に流して漁場を育てる（魚つき林・保安林）などのはたらきがあります。\nイ：人工林は針葉樹（すぎ・ひのき）が中心。ウ：国内産は外国産より高いので輸入が増えました。エ：林業で働く人は減り続けています。"}, {"id": "sui_03", "subject": "suisan_kihon", "month": "202611", "type": "selfjudge", "q": "領海（12海里）内で行われ、小型船を使って日帰りでアジやタイなどをとる漁業を何といいますか。", "answer": "沿岸漁業", "explanation": "海岸の近くで小型の船を使い、日帰りでとる漁業が沿岸漁業です。赤潮などで魚が少なくなったり、漁獲量が少なくて収入が得にくかったりする問題があります。"}, {"id": "sui_08", "subject": "suisan_kihon", "month": "202611", "type": "selfjudge", "q": "たまごからかえしてふ化させ、いけすの中で育てる漁業を何といいますか。", "answer": "養殖漁業", "explanation": "魚をたまごからかえし、いけすの中で大きくなるまで育ててからとる漁業が養殖漁業です。えさ代やいけす代がかかります。"}, {"id": "sui_11", "subject": "suisan_kihon", "month": "202611", "type": "selfjudge", "qImage": "../images/suisan_b2_map.jpg", "q": "日本の近海には多くのよい漁場があります。図の①と②の海流の名前はそれぞれ何ですか。\n【①は暖流（日本の南から太平洋側を北上）、②は寒流（北から南下）】", "answer": "① 日本海流（黒潮）　② 千島海流（親潮）", "explanation": "暖流の①は日本海流（黒潮）、寒流の②は千島海流（親潮）です。"}, {"id": "sui_r07", "subject": "suisan_renshu", "month": "202611", "type": "selfjudge", "q": "④つくり育てる漁業とあるが、養殖漁業とはどのような漁業ですか。簡単に説明しなさい。", "answer": "（例）ち魚から成魚になるまで、いけすで育て続ける漁業。", "explanation": "養殖漁業は、魚をたまごからかえし、大きくなるまでいけすの中で育ててからとる漁業です。「いけすで（最後まで）育てる」が書けていれば正解です。"}, {"id": "sui_k02", "subject": "suisan_kakomon", "month": "202611", "q": "近年、「持続可能な漁業」をすすめる取り組みが、全国で行われています。この取り組みとしてまちがっているものを、次のア〜エのうちから1つ選び、記号で答えなさい。", "options": ["ア：水産資源の減少を防ぐため、魚を取っても良い時期や量、大きさを制限する。", "イ：豊かな漁場を作るため、植樹など森林を育てる活動を行う。", "ウ：魚などが育つ場所を守るため、干潟や藻場を保全する。", "エ：水産資源を増やすため、海外から輸入した魚を放流する。"], "answer": 3, "explanation": "エがまちがいです。放流するのは、日本の海で育てた（その海にいる種類の）稚魚です。輸入した魚を放流すると、もともといる魚の生態系をくずすおそれがあります。ア（漁獲制限）、イ（豊かな海には豊かな森林が欠かせない）、ウ（干潟・藻場は魚の育つ場所）は正しい取り組みです。"}], "kokugo": [{"id": "wg11_01", "subject": "wago11_kihon", "month": "202611", "type": "choice", "keepOrder": true, "q": "次の各文の【　】の言葉の使い方として、ふさわしいものを選び、記号で答えなさい。\n【ア：人のお金にたかるのは、【あさましい】心の表れだ。／イ：あさましいことに今日だけ天気が悪い。】", "options": ["ア　人のお金にたかるのは、【あさましい】心の表れだ。", "イ　あさましいことに今日だけ天気が悪い。"], "answer": 0, "explanation": "あさましい＝見苦しく情けないさま、みすぼらしいさま。\nア「人のお金にたかるのは情けない心の表れだ」は意味がぴったり。\nイ「天気が悪いのが情けない」では意味が通らない（「あいにく」などを使う）。"}, {"id": "wg11_02", "subject": "wago11_kihon", "month": "202611", "type": "choice", "keepOrder": true, "q": "次の各文の【　】の言葉の使い方として、ふさわしいものを選び、記号で答えなさい。\n【ア：彼の【こころない】言葉に私はとても傷ついた。／イ：財布の中にお金がこれしかないのは【こころない】。】", "options": ["ア　彼の【こころない】言葉に私はとても傷ついた。", "イ　財布の中にお金がこれしかないのは【こころない】。"], "answer": 0, "explanation": "こころない＝他人への思いやりがないさま。\nア「思いやりのない言葉に傷ついた」が正しい使い方。\nイは「お金がこれしかなくて心細い」という意味で使っていて、まちがい。"}, {"id": "wg11_03", "subject": "wago11_kihon", "month": "202611", "type": "choice", "keepOrder": true, "q": "次の各文の【　】の言葉の使い方として、ふさわしいものを選び、記号で答えなさい。\n【ア：彼に恩知らずと【そむか】れた。／イ：あの人は会社の規則に【そむく】行動ばかりする。】", "options": ["ア　彼に恩知らずと【そむか】れた。", "イ　あの人は会社の規則に【そむく】行動ばかりする。"], "answer": 1, "explanation": "そむく＝命令やきまりなどに逆らって従わない、はむかう。\nイ「規則にそむく」が正しい。\nアは「恩知らずとののしられた」と言いたいところで、「そむく」は使えない。"}, {"id": "wg11_04", "subject": "wago11_kihon", "month": "202611", "type": "choice", "keepOrder": true, "q": "次の各文の【　】の言葉の使い方として、ふさわしいものを選び、記号で答えなさい。\n【ア：母は【つたない】英語を一生懸命話していた。／イ：もう会えない彼のことを思い出すと、【つたない】気持ちになる。】", "options": ["ア　母は【つたない】英語を一生懸命話していた。", "イ　もう会えない彼のことを思い出すと、【つたない】気持ちになる。"], "answer": 0, "explanation": "つたない＝能力が劣っている、下手である。\nア「下手な英語を一生懸命話していた」が正しい。\nイ「つたない気持ち」では意味が通らない（「せつない」などが入る）。"}, {"id": "wg11_05", "subject": "wago11_kihon", "month": "202611", "type": "choice", "keepOrder": true, "q": "次の各文の【　】の言葉の使い方として、ふさわしいものを選び、記号で答えなさい。\n【ア：ここに車を【とがめ】てはいけない。／イ：そんなひどいことをするのは、良心が【とがめる】。】", "options": ["ア　ここに車を【とがめ】てはいけない。", "イ　そんなひどいことをするのは、良心が【とがめる】。"], "answer": 1, "explanation": "とがめる＝あやまちなどを非難する、なじる。「良心がとがめる」＝悪いことをしたと気がとがめる。\nイが正しい。\nアは「車をとめて」と言いたいところ。"}, {"id": "wg11_06", "subject": "wago11_kihon", "month": "202611", "type": "choice", "keepOrder": true, "q": "次の各文の【　】の言葉の使い方として、ふさわしいものを選び、記号で答えなさい。\n【ア：妻子を【ないがしろ】にする余裕はなかった。／イ：学生は勉強を【ないがしろ】にしてはいけません。】", "options": ["ア　妻子を【ないがしろ】にする余裕はなかった。", "イ　学生は勉強を【ないがしろ】にしてはいけません。"], "answer": 1, "explanation": "ないがしろ＝あなどって軽く見るさま。\nイ「勉強を軽く見てはいけません」が、意味にぴったりの使い方。\nアは「軽く見る余裕がなかった」となり、前後の意味がうまくつながらない。"}, {"id": "wg11_07", "subject": "wago11_kihon", "month": "202611", "type": "choice", "keepOrder": true, "q": "次の各文の【　】の言葉の使い方として、ふさわしいものを選び、記号で答えなさい。\n【ア：あまり【ひたむき】に考えずに、もっと前向きに考えよう。／イ：王子の【ひたむき】にがんばる姿に感動する。】", "options": ["ア　あまり【ひたむき】に考えずに、もっと前向きに考えよう。", "イ　王子の【ひたむき】にがんばる姿に感動する。"], "answer": 1, "explanation": "ひたむき＝忍耐強く、いちずに打ち込むさま。\nイ「いちずにがんばる姿」が正しい。\nアは、ひたむき（いちず）に考えずに「前向きに考えよう」と言っていて、意味があわない。"}, {"id": "wg11_12", "subject": "wago11_imi", "month": "202611", "type": "choice", "q": "「うのみ」の意味として正しいものを選びなさい。", "options": ["物事をよく理解せずに受け入れること。", "何事もないかのように振る舞うさま。", "あなどって軽く見るさま。", "まぶたを開けたり閉じたりする。光がついたり消えたりを繰り返す。"], "answer": 0, "explanation": "「うのみ」＝物事をよく理解せずに受け入れること。"}, {"id": "wg11_14", "subject": "wago11_imi", "month": "202611", "type": "choice", "q": "「こころない」の意味として正しいものを選びなさい。", "options": ["他人への思いやりがないさま。", "能力が劣っている。下手である。", "遠慮する。（また、幅をきかせる。）", "（煩う）あれこれと思い悩む。心配する。　（患う）病気になる。"], "answer": 0, "explanation": "「こころない」＝他人への思いやりがないさま。"}, {"id": "wg11_16", "subject": "wago11_imi", "month": "202611", "type": "choice", "q": "「そむく」の意味として正しいものを選びなさい。", "options": ["命令などに逆らって従わない。はむかう。", "あなどって軽く見るさま。", "まぶたを開けたり閉じたりする。光がついたり消えたりを繰り返す。", "物事をよく理解せずに受け入れること。"], "answer": 0, "explanation": "「そむく」＝命令などに逆らって従わない。はむかう。"}, {"id": "wg11_18", "subject": "wago11_imi", "month": "202611", "type": "choice", "q": "「とがめる」の意味として正しいものを選びなさい。", "options": ["あやまちなどを非難する。なじる。", "遠慮する。（また、幅をきかせる。）", "（煩う）あれこれと思い悩む。心配する。　（患う）病気になる。", "他人への思いやりがないさま。"], "answer": 0, "explanation": "「とがめる」＝あやまちなどを非難する。なじる。"}, {"id": "wg11_20", "subject": "wago11_imi", "month": "202611", "type": "choice", "q": "「なげく」の意味として正しいものを選びなさい。", "options": ["ひどく悲しむ。", "まぶたを開けたり閉じたりする。光がついたり消えたりを繰り返す。", "物事をよく理解せずに受け入れること。", "命令などに逆らって従わない。はむかう。"], "answer": 0, "explanation": "「なげく」＝ひどく悲しむ。"}, {"id": "wg11_22", "subject": "wago11_imi", "month": "202611", "type": "choice", "q": "「ひたむき」の意味として正しいものを選びなさい。", "options": ["忍耐強く、いちずに打ち込むさま。", "（煩う）あれこれと思い悩む。心配する。　（患う）病気になる。", "他人への思いやりがないさま。", "あやまちなどを非難する。なじる。"], "answer": 0, "explanation": "「ひたむき」＝忍耐強く、いちずに打ち込むさま。"}, {"id": "wg11_24", "subject": "wago11_imi", "month": "202611", "type": "choice", "q": "「もっぱら」の意味として正しいものを選びなさい。", "options": ["ある一つのことに集中するさま。", "物事をよく理解せずに受け入れること。", "命令などに逆らって従わない。はむかう。", "ひどく悲しむ。"], "answer": 0, "explanation": "「もっぱら」＝ある一つのことに集中するさま。"}, {"id": "wg11_31", "subject": "wago11_kakomon", "month": "202611", "type": "selfjudge", "q": "後の意味のことばになるように、□にあてはまるひらがなを補い、全部のひらがなで書きなさい。\nあ□□□□く\n意味：何事につけても人の言動に逆らう人。ひねくれ者。", "answer": "あまのじゃく", "explanation": "「天邪鬼（あまのじゃく）」。人の言うことにわざと逆らう人。"}, {"id": "wg11_32", "subject": "wago11_kakomon", "month": "202611", "type": "selfjudge", "q": "後の意味のことばになるように、□にあてはまるひらがなを補い、全部のひらがなで書きなさい。\nた□□□ん\n意味：まちがいがないことや確かであることの保証。", "answer": "たいこばん", "explanation": "「太鼓判（たいこばん）」。「太鼓判をおす」＝まちがいないと保証する。"}, {"id": "wg11_33", "subject": "wago11_kakomon", "month": "202611", "type": "selfjudge", "q": "後の意味のことばになるように、□にあてはまるひらがなを補い、全部のひらがなで書きなさい。\nぶ□□□□□ら\n意味：ぶあいそうな顔つき。", "answer": "ぶっちょうづら", "explanation": "「仏頂面（ぶっちょうづら）」。ふきげんでぶあいそうな顔つき。"}, {"id": "wg11_35", "subject": "wago11_kakomon", "month": "202611", "type": "selfjudge", "q": "次の各群は、動作や状態を表す言葉です。各群の□に共通するひらがな二字を入れて、言葉を完成させなさい。\nはる□□　ひし□□　なぞ□□", "answer": "めく", "explanation": "「春めく」「ひしめく」「なぞめく」。「〜めく」＝そのような状態になる、そのように見える。"}, {"id": "wg11_36", "subject": "wago11_kakomon", "month": "202611", "type": "selfjudge", "q": "次の各群は、動作や状態を表す言葉です。各群の□に共通するひらがな二字を入れて、言葉を完成させなさい。\nひろ□□　むら□□　ころ□□", "answer": "がる", "explanation": "「広がる」「群がる」「転がる」。「〜がる」＝そのような状態になる。"}, {"id": "wg11_37", "subject": "wago11_kakomon", "month": "202611", "type": "selfjudge", "q": "次の各群は、動作や状態を表す言葉です。各群の□に共通するひらがな二字を入れて、言葉を完成させなさい。\nささ□□　かが□□　つぶ□□", "answer": "やく", "explanation": "「ささやく」「輝く」「つぶやく」。"}], "sansu": [{"id": "tkk11_b04", "subject": "tkk11_kihon", "month": "202611", "type": "input", "q": "1つの内角の大きさが150度の正多角形には、頂点が何個ありますか。", "answer": "12個", "explanation": "1つの外角は 180−150=30（度）\n外角の和は360度なので、頂点の数は 360÷30=12（個）"}, {"id": "tkk11_b06", "subject": "tkk11_kihon", "month": "202611", "type": "input", "qImage": "../images/m11_tk_k1_2_2.jpg", "q": "下の図の角イの大きさは何度ですか。", "answer": "55度", "explanation": "へこんだ角の大きさは、まわりの3つの角の和に等しくなります（ア+イ+ウ=エ）。\nイ+65+20=140 より、イ=140−（65+20）=55（度）"}, {"id": "tkk11_r05", "subject": "tkk11_renshu", "month": "202611", "type": "input", "qImage": "../images/m11_tk_r1_2.jpg", "q": "右の図の六角形は正六角形です。角アの大きさは何度ですか。", "answer": "40度", "explanation": "正六角形の1つの内角は 180×（6−2）÷6=120（度）\n上の三角形の残りの角は 180−（40+120）=20（度）\n六角形の右下の角のとなりの角は 180−120=60（度）\nア+20+60=120（外角の定理）より、ア=120−（20+60）=40（度）"}, {"id": "tkk11_k04", "subject": "tkk11_kakomon", "month": "202611", "type": "input", "qImage": "../images/m11_tk_p_4.jpg", "q": "右の図の正五角形において、対角線を2本引いた。アの角度は□°である。\n（2022 中村学園中）", "answer": "72度", "explanation": "正五角形の1つの内角は108度。\nとなり合う二等辺三角形の底角は（180−108）÷2=36（度）\nアは外角の定理より 36+36=72（度）"}, {"id": "en11a_b18", "subject": "en11a_kihon", "month": "202611", "type": "input", "q": "円周率を3.14として答えなさい。\n半径が2cmの円の円周の長さは何cmですか。", "answer": "12.56cm", "explanation": "円周の長さは 直径×3.14 で求めます。\n直径は 2×2=4（cm）\n4×3.14=12.56（cm）"}, {"id": "en11a_b21", "subject": "en11a_kihon", "month": "202611", "type": "input", "qImage": "../images/m11_e1k1_4_1.jpg", "q": "円周率を3.14として答えなさい。\n半径が5cmで、中心角が180度のおうぎ形の弧の長さは何cmですか。", "answer": "15.7cm", "explanation": "おうぎ形の弧の長さは 直径×3.14×中心角/360 で求めます。\n5×2×3.14×180/360=5×3.14=15.7（cm）"}, {"id": "en11a_r07", "subject": "en11a_renshu", "month": "202611", "type": "input", "q": "円周率を3.14として答えなさい。\n半径が8cmで、中心角が90度のおうぎ形の弧の長さは何cmですか。", "answer": "12.56cm", "explanation": "おうぎ形の弧の長さは 直径×3.14×中心角/360 で求めます。\n8×2×3.14×90/360=16×3.14×1/4=4×3.14=12.56（cm）"}, {"id": "en11a_r13", "subject": "en11a_renshu", "month": "202611", "type": "input", "qImage": "../images/m11_e1r1_4.jpg", "q": "右の図は、正方形と四分円を組み合わせた図形です。円周率を3.14として答えなさい。\nあの角の大きさは何度ですか。", "answer": "60度", "explanation": "図の点線の部分はどちらも四分円の半径なので、同じ長さの6cmです。\nあは正三角形の1つの内角なので、60度です。"}, {"id": "en11a_k01", "subject": "en11a_kakomon", "month": "202611", "type": "input", "qImage": "../images/m11_e1p_1.jpg", "q": "右の図のように、1辺が4cmの正方形の中に半径2cmのおうぎ形を4つかいてある。このとき、色のついた部分の面積を求めなさい。ただし、円周率は3.14とする。\n（2011 光塩女子学院中等科）", "answer": "4.56cm²", "explanation": "色のついた部分は、半径2cmの四分円4つ（円1つ分）から、直角二等辺三角形4つ分を引いたものです。\n四分円4つの面積は 2×2×3.14=12.56（cm²）\n三角形4つは、対角線が4cmの正方形の面積 4×4÷2=8（cm²）と同じです。\n12.56−8=4.56（cm²）"}, {"id": "en11a_k03", "subject": "en11a_kakomon", "month": "202611", "type": "input", "qImage": "../images/m11_e1p_3.jpg", "q": "右の図は、大きさが等しい円を4つならべたものである。色のついた部分の面積を求めなさい。ただし、円周率は3.14とする。\n（2011 日本大学第一中）", "answer": "21.5cm²", "explanation": "円の直径は 20÷2=10（cm）なので、半径は 5cm です。\n4つの円の中心を結ぶと、1辺10cmの正方形になります。\n色のついた部分は、この正方形から、半径5cmで中心角90度のおうぎ形4つ（円1つ分）を引いたものです。\n10×10−5×5×3.14=100−78.5=21.5（cm²）"}, {"id": "en11b_b07", "subject": "en11b_kihon", "month": "202611", "type": "input", "q": "円周率は3.14として答えなさい。\n半径10cm、中心角72度のおうぎ形の面積は何cm²ですか。", "answer": "62.8cm²", "explanation": "10×10×3.14×72/360=100×3.14×1/5=20×3.14=62.8（cm²）"}, {"id": "en11b_b09", "subject": "en11b_kihon", "month": "202611", "type": "input", "qImage": "../images/m11_e2k1_3_2.jpg", "q": "円周率は3.14として、次の図の色のついた部分の面積を求めなさい。（円と正方形を組み合わせた図形です。）", "answer": "28.5cm²", "explanation": "半径5cmの円の面積から、対角線の長さが10cmの正方形の面積を引きます。\n5×5×3.14−10×10×1/2=78.5−50=28.5（cm²）"}, {"id": "en11b_r01", "subject": "en11b_renshu", "month": "202611", "type": "input", "qImage": "../images/m11_e2r1_1_1.jpg", "q": "右の図は、正方形の中に半円を4つかいたものです。色がついた部分の面積は何cm²ですか。円周率は3.14とします。", "answer": "6.28cm²", "explanation": "色のついた部分は、移動させると半径2cmの半円1つ分と同じ面積になります。\n2×2×3.14×1/2=2×3.14=6.28（cm²）"}, {"id": "en11b_r05", "subject": "en11b_renshu", "month": "202611", "type": "input", "qImage": "../images/m11_e2r1_2.jpg", "q": "右の図は、中心角が90度のおうぎ形と長方形を組み合わせた図形です。アとイの面積が等しいとき、□の値はいくつですか。円周率は3.14とします。", "answer": "15.7cm", "explanation": "白い部分をウとすると、ア=イなので、ア+ウ=イ+ウ です。\nおうぎ形の面積＝長方形の面積 となる□を求めます。\nおうぎ形の面積は 20×20×3.14×90/360=100×3.14=314（cm²）\n長方形の面積は 20×□ と表せるので、20×□=314　□=314÷20=15.7（cm）"}, {"id": "en11b_k01", "subject": "en11b_kakomon", "month": "202611", "type": "input", "qImage": "../images/m11_e2p_1.jpg", "q": "下の図は半径4cm、中心角が45度のおうぎ形と二等辺三角形を組み合わせた図形である。AD=BDのとき、色のついた部分の面積は何cm²か。ただし、円周率は3.14とする。\n（2015 慶應中等部）", "answer": "2.28cm²", "explanation": "中心角45度、半径4cmのおうぎ形の面積から、対角線の長さが4cmの正方形の半分の面積を引きます。\n4×4×3.14×45/360−4×4×1/2×1/2=2×3.14−4=6.28−4=2.28（cm²）"}, {"id": "en11b_k04", "subject": "en11b_kakomon", "month": "202611", "type": "input", "qImage": "../images/m11_e2p_4.jpg", "q": "下の図の円の半径は4cmで、円周を12等分する点をとった。色のついた部分の面積は何cm²か。ただし、円周率は3.14とする。\n（2017 女子学院中）", "answer": "41.12cm²", "explanation": "線を引くと、半径4cmの四分円2つと、底辺と高さが4cmの直角二等辺三角形が2つになります。\n半径4cmの四分円2つ：4×4×3.14×1/4×2=25.12（cm²）\n三角形2つ：4×4×1/2×2=16（cm²）\n25.12+16=41.12（cm²）"}, {"q": "次の計算をしなさい。\n47 × 38", "answer": "1786", "explanation": "47×38＝47×40−47×2＝1880−94＝1786", "id": "hibi11_orig_1", "subject": "hibi11_orig", "month": "202611", "type": "input"}, {"q": "次の計算をしなさい。答えが分数になるときは、いちばんかんたんな分数で答えなさい。\n3/4 ＋ 0.6 − 5/6", "answer": "31/60", "explanation": "0.6＝3/5。通分すると 45/60＋36/60−50/60＝31/60", "id": "hibi11_orig_2", "subject": "hibi11_orig", "month": "202611", "type": "input"}, {"q": "次の計算をしなさい。答えが分数になるときは、いちばんかんたんな分数で答えなさい。\n9 ÷ 14 × 35 ÷ 12", "answer": "15/8", "explanation": "9×35/(14×12)＝315/168＝15/8（約分は 21 でわる）", "id": "hibi11_orig_3", "subject": "hibi11_orig", "month": "202611", "type": "input"}, {"q": "次の問いに答えなさい。\n1から100までの整数のうち、4でも6でも割り切れる数は何個ありますか。", "answer": "8個", "explanation": "4と6の最小公倍数は12。100÷12＝8あまり4 なので 8個", "id": "hibi11_orig_4", "subject": "hibi11_orig", "month": "202611", "type": "input"}]};
const CAT_LABEL = {"shakai": "社会", "rika": "理科", "kokugo": "国語", "sansu": "算数"};
const CAT_COLOR = {"shakai": "#1d4ed8", "rika": "#065f46", "kokugo": "#3730a3", "sansu": "#be185d"};
const CAT_ORDER = ["rika", "shakai", "kokugo", "sansu"];

function renderQ(q, n) {
  const d = document.createElement('div');
  d.className = 'qb';
  let html = `<div class="num">問${n}</div><div class="qtext"></div>`;
  if (q.qImage || q.qImage2) {
    html += '<div class="imgs">';
    if (q.qImage) html += `<img src="${q.qImage}">`;
    if (q.qImage2) html += `<img src="${q.qImage2}">`;
    html += '</div>';
  }
  const type = q.type || 'choice';
  if (type === 'choice') {
    html += '<div class="opts">' + q.options.map(o => `<span>${o}</span>`).join('') + '</div>';
    html += '<div class="ans-box">答え（　　　　）</div>';
  } else if (type === 'selfjudge') {
    html += '<div class="line"></div><div class="line"></div>';
  } else {
    html += '<div class="line"></div>';
  }
  d.innerHTML = html;
  d.querySelector('.qtext').textContent = q.q;
  return d;
}

let daimon = 0;
for (const cat of CAT_ORDER) {
  daimon++;
  const page = document.createElement('section');
  page.className = 'page';
  const head = document.createElement('div');
  head.className = 'cat-head';
  head.style.background = CAT_COLOR[cat];
  head.innerHTML = `<h2>大問${daimon}　${CAT_LABEL[cat]}</h2>`;
  page.appendChild(head);
  EXAM[cat].forEach((q, i) => page.appendChild(renderQ(q, i + 1)));
  document.getElementById('cats').appendChild(page);
}
</script>
