<script>
const EXAM = [{"title": "立方体と直方体", "qs": [{"q": "1辺が9cmの立方体があります。この立方体の体積は何cm³ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 190 190\" width=\"190\" height=\"190\"><polygon points=\"124.0,155.8 124.0,65.8 155.8,34.0 155.8,124.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"124.0,65.8 34.0,65.8 65.8,34.0 155.8,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,155.8 124.0,155.8 124.0,65.8 34.0,65.8\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"79.0\" y=\"167.8\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">9cm<\/text><text x=\"16.0\" y=\"110.8\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">9cm<\/text><text x=\"161.9\" y=\"145.9\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">9cm<\/text><\/svg>", "answer": "729cm³", "explanation": "立方体の体積＝1辺×1辺×1辺\n9×9×9＝729（cm³）"}, {"q": "図の直方体の表面積は何cm²ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 216 177\" width=\"216\" height=\"177\"><polygon points=\"164.0,52.4 34.0,52.4 52.4,34.0 182.4,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"164.0,143.4 164.0,52.4 182.4,34.0 182.4,125.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,143.4 164.0,143.4 164.0,52.4 34.0,52.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"99.0\" y=\"155.4\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">10cm<\/text><text x=\"16.0\" y=\"97.9\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">7cm<\/text><text x=\"195.2\" y=\"140.2\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><\/svg>", "answer": "276cm²", "explanation": "向かい合う面は同じ形なので、3種類の面を2つずつ。\n10×7＝70、10×4＝40、7×4＝28\n（70＋40＋28）×2＝276（cm²）"}, {"q": "たて9cm、横12cmの直方体があります。体積が540cm³のとき、高さは何cmですか。", "answer": "5cm", "explanation": "高さ＝体積÷（たて×横）\n540÷（9×12）＝540÷108＝5（cm）"}, {"q": "辺の長さをすべてたすと96cmになる立方体があります。この立方体の体積は何cm³ですか。", "answer": "512cm³", "explanation": "立方体の辺は12本で、長さはすべて同じ。\n1辺は 96÷12＝8（cm）\n体積は 8×8×8＝512（cm³）"}, {"q": "図は、2つの直方体を組み合わせた立体です。この立体の体積は何cm³ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 247 208\" width=\"247\" height=\"208\"><polygon points=\"99.0,122.0 99.0,57.0 122.0,34.0 122.0,99.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"99.0,57.0 34.0,57.0 57.0,34.0 122.0,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,122.0 99.0,122.0 122.0,99.0 213.0,99.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,174.0 190.0,122.0 213.0,99.0 213.0,151.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,174.0 190.0,174.0 190.0,122.0 99.0,122.0 99.0,57.0 34.0,57.0\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"112.0\" y=\"186.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">12cm<\/text><text x=\"66.5\" y=\"47.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">5cm<\/text><text x=\"16.0\" y=\"115.5\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">9cm<\/text><text x=\"174.0\" y=\"148.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><text x=\"223.5\" y=\"168.5\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">5cm<\/text><\/svg>", "answer": "365cm³", "explanation": "前の面を2つの長方形に分ける。\n左：5×9＝45、右：（12－5）×4＝28 → 前の面は 45＋28＝73（cm²）\n奥行きが5cmなので 73×5＝365（cm³）\n（別解）5×9×5＋7×4×5＝225＋140＝365"}, {"q": "図は、2だんの階段の形をした立体です。だんの高さはどちらも3cm、はばはどちらも4cm、奥行きは6cmです。この立体の表面積は何cm²ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 174\" width=\"200\" height=\"174\"><polygon points=\"86.0,61.6 34.0,61.6 61.6,34.0 113.6,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"86.0,100.6 86.0,61.6 113.6,34.0 113.6,73.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"138.0,100.6 86.0,100.6 113.6,73.0 165.6,73.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"138.0,139.6 138.0,100.6 165.6,73.0 165.6,112.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,139.6 138.0,139.6 138.0,100.6 86.0,100.6 86.0,61.6 34.0,61.6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"86.0\" y=\"151.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">8cm<\/text><text x=\"16.0\" y=\"100.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><text x=\"173.8\" y=\"131.8\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><\/svg>", "answer": "240cm²", "explanation": "前と後ろの面：4×6＋4×3＝36（cm²）が2つで72（cm²）\nまわりの面は、横にのばすと たて6cm・横＝前の面のまわりの長さの長方形になる。\n前の面のまわりの長さ＝（8＋6）×2＝28（cm） → 28×6＝168（cm²）\n合わせて 72＋168＝240（cm²）"}, {"q": "図は、たて6cm・横12cm・高さ6cmの直方体から、はば4cm・高さ3cmのトンネルを、前から後ろまでくりぬいた立体です。この立体の体積は何cm³ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 252 174\" width=\"252\" height=\"174\"><polygon points=\"86.0,139.6 86.0,100.6 113.6,73.0 113.6,112.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,61.6 34.0,61.6 61.6,34.0 217.6,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,139.6 190.0,61.6 217.6,34.0 217.6,112.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,139.6 86.0,139.6 86.0,100.6 138.0,100.6 138.0,139.6 190.0,139.6 190.0,61.6 34.0,61.6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"112.0\" y=\"51.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">12cm<\/text><text x=\"16.0\" y=\"100.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><text x=\"112.0\" y=\"151.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><text x=\"71.0\" y=\"120.1\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">3cm<\/text><text x=\"225.8\" y=\"131.8\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><\/svg>", "answer": "360cm³", "explanation": "もとの直方体から、くりぬいた部分をひく。\n12×6×6＝432、4×6×3＝72\n432－72＝360（cm³）"}, {"q": "図は、2つの直方体を組み合わせた立体で、体積は440cm³です。□の長さは何cmですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 209 198\" width=\"209\" height=\"198\"><polygon points=\"67.0,120.1 67.0,65.1 98.1,34.0 98.1,89.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"144.0,120.1 67.0,120.1 98.1,89.0 175.1,89.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"67.0,65.1 34.0,65.1 65.1,34.0 98.1,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"144.0,164.1 144.0,120.1 175.1,89.0 175.1,133.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,164.1 144.0,164.1 144.0,120.1 67.0,120.1 67.0,65.1 34.0,65.1\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"89.0\" y=\"176.1\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">10cm<\/text><text x=\"128.0\" y=\"142.1\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><text x=\"50.5\" y=\"55.1\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">3cm<\/text><text x=\"16.0\" y=\"114.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">□cm<\/text><text x=\"181.6\" y=\"154.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">8cm<\/text><\/svg>", "answer": "9cm", "explanation": "下の直方体：10×8×4＝320（cm³）\n上の直方体の体積は 440－320＝120（cm³）\n上の直方体の高さ＝120÷（3×8）＝5（cm）\n□＝4＋5＝9（cm）"}, {"q": "内のりが、たて25cm・横40cm・深さ30cmの直方体の水そうに、深さ18cmまで水が入っています。入っている水は何Lですか。", "answer": "18L", "explanation": "水の体積＝25×40×18＝18000（cm³）\n1L＝1000cm³ なので 18000cm³＝18L"}, {"q": "1辺が3cmの立方体のつみ木を、横に3こ、たてに2こならべ、それを3だん重ねて、すきまのない直方体を作りました。この直方体の表面積は何cm²ですか。", "answer": "378cm²", "explanation": "できた直方体は 横9cm・たて6cm・高さ9cm。\n9×6＝54、9×9＝81、6×9＝54\n（54＋81＋54）×2＝378（cm²）"}]}, {"title": "割合の表し方", "qs": [{"q": "次の□にあてはまる数を求めなさい。（分数で答えなさい）\n21Lは35Lの□倍", "answer": "3/5（倍）", "explanation": "AはBの A÷B 倍。\n21÷35＝21/35＝3/5"}, {"q": "次の□にあてはまる数を求めなさい。\n45kgの1.4倍は□kg", "answer": "63（kg）", "explanation": "もとにする量×割合＝くらべる量\n45×1.4＝63（kg）"}, {"q": "次の□にあてはまる数を求めなさい。\n□円の0.6倍は48円", "answer": "80（円）", "explanation": "もとにする量＝くらべる量÷割合\n48÷0.6＝80（円）"}, {"q": "次の□にあてはまる数を求めなさい。\n36cmの 5/9 は□cm", "answer": "20（cm）", "explanation": "36×5/9＝20（cm）\n（36を9等分すると4、その5つ分で20）"}, {"q": "次の□にあてはまる数を求めなさい。\n□人の 4/7 は64人", "answer": "112（人）", "explanation": "64÷4/7＝64×7/4＝112（人）\n（4つ分が64人なので1つ分は16人、7つ分で112人）"}, {"q": "ある科学館の入場者は、去年が250人、今年が285人でした。去年の人数をもとにしたときの、今年の人数の割合を小数で求めなさい。", "answer": "1.14", "explanation": "割合＝くらべる量÷もとにする量\n285÷250＝1.14"}, {"q": "姉のリボンの長さは60cmで、これは妹のリボンの長さの1.25倍です。妹のリボンの長さは何cmですか。", "answer": "48cm", "explanation": "もとにする量（妹）＝60÷1.25＝48（cm）"}, {"q": "はるとさんは、はじめの所持金の 2/5 を使って、360円のノートを買いました。はじめの所持金は何円でしたか。", "answer": "900円", "explanation": "はじめの所持金の 2/5 が360円。\n360÷2/5＝360×5/2＝900（円）"}, {"q": "ある本を、1日目に全体の 1/3 を読み、2日目に残りの 2/5 を読んだところ、まだ96ページ残っています。この本は全部で何ページありますか。", "answer": "240ページ", "explanation": "1日目の残りは全体の 1－1/3＝2/3\n2日目の残りは、その 1－2/5＝3/5 なので、全体の 2/3×3/5＝2/5\n全体の 2/5 が96ページ → 96÷2/5＝240（ページ）\n（たしかめ：240×1/3＝80、残り160の2/5＝64、160－64＝96）"}, {"q": "あるクラスの男子の人数は、クラス全体の人数の 5/9 より2人少なく、女子の人数は22人です。このクラスの男子の人数は何人ですか。", "answer": "23人", "explanation": "男子は「全体の5/9－2人」なので、女子は「全体の4/9＋2人」。\n全体の 4/9 が 22－2＝20（人）にあたる。\n全体＝20÷4/9＝45（人）\n男子＝45－22＝23（人）\n（たしかめ：45×5/9－2＝25－2＝23）"}]}];
const COLOR = '#0f766e';

function renderQ(q, n) {
  const d = document.createElement('div');
  d.className = q.svg ? 'qb' : 'qb noimg';
  let html = `<div class="num">問${n}</div><div class="qtext"></div>`;
  if (q.svg) html += `<div class="imgs">${q.svg}</div>`;
  html += '<div class="work">式・考え方</div><div class="ans">答え <span class="box"></span></div>';
  d.innerHTML = html;
  d.querySelector('.qtext').textContent = q.q;
  return d;
}

let n = 0;
EXAM.forEach((sec, si) => {
  const page = document.createElement('section');
  page.className = 'daimon';
  const head = document.createElement('div');
  head.className = 'cat-head';
  head.style.background = COLOR;
  head.innerHTML = `<h2>大問${si + 1}　${sec.title}</h2>`;
  page.appendChild(head);
  const grid = document.createElement('div');
  grid.className = 'grid2';
  sec.qs.forEach(q => grid.appendChild(renderQ(q, ++n)));
  page.appendChild(grid);
  document.getElementById('cats').appendChild(page);
});
</script>
</body>
</html>
