<div class="sheet" id="sheet"></div>
<script>
const EXAM = {"rika": [{"id": "tsk1_01", "subject": "tsuki1_kihon", "month": "202609", "q": "月の直径は、およそ何kmですか。", "options": ["ア：約3500km", "イ：約13000km", "ウ：約38万km", "エ：約140万km"], "answer": 0, "explanation": "月の直径は約3500kmで、地球（約13000km）の約4分の1です。約38万kmは地球から月までのきょり、約140万kmは太陽の直径です。"}, {"id": "tsk1_02", "subject": "tsuki1_kihon", "month": "202609", "q": "月が地球のまわりを1周するのにかかる時間（公転周期）と、月の満ち欠けの周期の組み合わせとして正しいものはどれですか。", "options": ["ア：公転周期 約27.3日 ／ 満ち欠けの周期 約27.3日", "イ：公転周期 約27.3日 ／ 満ち欠けの周期 約29.5日", "ウ：公転周期 約29.5日 ／ 満ち欠けの周期 約27.3日", "エ：公転周期 約29.5日 ／ 満ち欠けの周期 約29.5日"], "answer": 1, "explanation": "月の公転周期は約27.3日ですが、その間に地球も太陽のまわりを進むため、同じ満ち欠けにもどるには少し多い約29.5日かかります。"}, {"id": "tsk1_03", "subject": "tsuki1_kihon", "month": "202609", "q": "月には空気がないため、昼と夜の温度差が非常に大きくなります。月の昼の表面温度と夜の表面温度の組み合わせとして、最も適当なものはどれですか。", "options": ["ア：昼 約110℃ ／ 夜 約-170℃", "イ：昼 約-170℃ ／ 夜 約110℃", "ウ：昼 約30℃ ／ 夜 約-10℃", "エ：昼 約110℃ ／ 夜 約0℃"], "answer": 0, "explanation": "月には空気（大気）がないため熱がにげやすく、昼は約110℃、夜は約-170℃と、温度差が非常に大きくなります。"}, {"id": "tsk1_r01", "subject": "tsuki1_renshu", "month": "202609", "type": "selfjudge", "q": "【文章】月は、地球から約38万kmの位置にあり、直径は約3500km、表面温度は最高で約110℃をこえ、最低で約-170℃になる天体です。月の表面には、岩石や砂が一面に広がっていて（　①　）とよばれる円形のくぼみが多数見られます。\n\n（　①　）に当てはまる言葉を答えなさい。", "answer": "クレーター", "explanation": "いん石のしょうとつでできた円形のくぼみをクレーターといいます。月には空気がないため、けずられずに残っています。"}, {"id": "tsk1_r02", "subject": "tsuki1_renshu", "month": "202609", "type": "selfjudge", "q": "【文章】月を地球から観察すると、毎日少しずつ形が変化して見えます。これを月の（　②　）といいます。\n\n（　②　）に当てはまる言葉を答えなさい。", "answer": "満ち欠け", "explanation": "太陽・月・地球の位置関係が変わることで、光って見える部分の形が変化します。これを月の満ち欠けといいます。"}, {"id": "tsk1_r2_01", "subject": "tsuki1_renshu2", "month": "202609", "qImage": "../images/tsuki1_r2_johgen.jpg", "q": "図のように南の空に見える、右半分が輝いて見える半月を何といいますか。", "options": ["ア：新月", "イ：上弦の月", "ウ：満月", "エ：下弦の月", "オ：三日月"], "answer": 1, "explanation": "右半分が光る半月は上弦の月です。夕方（日没ごろ）に南の空に見え、真夜中に西へしずみます。"}, {"id": "tsk1_r2_02", "subject": "tsuki1_renshu2", "month": "202609", "type": "selfjudge", "qImage": "../images/tsuki1_r2_johgen.jpg", "q": "南の空に右半分が光る上弦の月が見えた日から日がたつにつれて、月は満ちていきますか、それとも欠けていきますか。", "answer": "満ちていく", "explanation": "新月→三日月→上弦→満月の順に満ちていきます。上弦の月のあとは満月に向かうので、だんだん満ちていきます。"}, {"id": "tsk1_r2_04", "subject": "tsuki1_renshu2", "month": "202609", "type": "selfjudge", "q": "月の表面にはたくさんの丸いくぼみがあります。このくぼみはいん石がしょうとつしてできたものと考えられていますが、このくぼみを何といいますか。", "answer": "クレーター", "explanation": "月にはクレーターが多数あります。空気がなく風や雨でけずられないため、大昔のくぼみがそのまま残っています。"}, {"id": "tsk1_k01", "subject": "tsuki1_kakomon", "month": "202609", "q": "月面には模様が見られ、日本では「ウサギが餅つきをしているように見える」などと言われています。このように、月面に模様が見える理由として正しいものを次から1つ選びなさい。", "options": ["1：地球の影が映っているから。", "2：人工衛星の影が映っているから。", "3：表面の岩石の種類が場所によって違うから。", "4：表面に水がある部分とない部分で見え方が違うから。", "5：雲がある部分とない部分で見え方が違うから。"], "answer": 2, "explanation": "黒っぽく見える「海」は玄武岩という黒い岩石、白っぽく見える「陸（高地）」は白っぽい岩石でできています。岩石の種類のちがいで反射する光の量がちがうため、模様に見えます。月には空気も水も雲もないので、4・5はまちがいです。"}, {"id": "tsk1_k03", "subject": "tsuki1_kakomon", "month": "202609", "qImage": "../images/tsuki1_k_ookisa.jpg", "q": "地球の大きさと比べて、月の大きさはどのくらいですか。図の中で、地球に対する月の大きさを正しく表しているものを1〜4から1つ選びなさい。", "options": ["1", "2", "3", "4"], "answer": 1, "explanation": "月の直径は約3500km、地球の直径は約13000kmなので、月は地球の約4分の1です。図の2が地球の円のおよそ4分の1の大きさになっています。3は約半分、4は地球とほぼ同じ大きさです。"}, {"id": "tsk2_01", "subject": "tsuki2_kihon", "month": "202609", "q": "月の1日の動きについて、正しく説明しているものを次の中から選びなさい。", "options": ["ア：東から昇り、南の空を通って、西へしずむ。", "イ：西から昇り、南の空を通って、東へしずむ。", "ウ：東から昇り、北の空を通って、西へしずむ。", "エ：西から昇り、北の空を通って、東へしずむ。"], "answer": 0, "explanation": "月も太陽や星と同じで、東からのぼって南の空を通り、西へしずみます。"}, {"id": "tsk2_02", "subject": "tsuki2_kihon", "month": "202609", "q": "月が1日で(1)のように動いているように見えるのはなぜですか。次の中から選びなさい。", "options": ["ア：月が地球のまわりを公転しているから。", "イ：地球が太陽のまわりを公転しているから。", "ウ：地球が自転しているから。", "エ：月が自転しているから。"], "answer": 2, "explanation": "地球が西から東へ1日1回自転しているため、空の天体は逆に東から西へ動いて見えます（日周運動）。"}, {"id": "tsk2_03", "subject": "tsuki2_kihon", "month": "202609", "q": "夕方（18時ごろ）に南の空で最も高くなる月を何といいますか。", "options": ["ア：三日月", "イ：上弦の月", "ウ：満月", "エ：下弦の月"], "answer": 1, "explanation": "上弦の月は18時ごろに南中（南の空で最も高くなる）します。太陽から約90度東にあるためです。"}, {"id": "tsk2_r01", "subject": "tsuki2_renshu", "month": "202609", "type": "selfjudge", "qImage": "../images/tsuki2_r_zu1.jpg", "q": "ある日の夕方5時ごろ、南西の空に細い月が見えました。図1のような形の月を何といいますか。", "answer": "三日月", "explanation": "新月から約3日後の、右側が細く光る月を三日月といいます。夕方の南西の低い空に見えます。"}, {"id": "tsk2_r02", "subject": "tsuki2_renshu", "month": "202609", "qImage": "../images/tsuki2_r_zu1.jpg", "q": "この月は、このあとどのように動いて、西にしずみますか。最も適当なものを図1のア〜ウから1つ選び、記号で答えなさい。", "options": ["ア", "イ", "ウ"], "answer": 1, "explanation": "月は太陽と同じように、西へかたむきながらななめにしずみます。真下（ア）でも横（ウ）でもなく、ななめ右下のイの向きです。"}, {"id": "tsk2_r11", "subject": "tsuki2_renshu", "month": "202609", "q": "正午に地平線からのぼってくる月を、次のア〜オから1つ選びなさい。", "options": ["ア：新月", "イ：三日月", "ウ：上弦の月", "エ：満月", "オ：下弦の月"], "answer": 2, "explanation": "上弦の月は12時ごろ東からのぼり、18時ごろ南中、0時ごろ西へしずみます。"}, {"id": "tsk2_r12", "subject": "tsuki2_renshu", "month": "202609", "q": "日の入りのころ、地平線から昇ってくる月を、(1)のア〜オから1つ選びなさい。", "options": ["ア：新月", "イ：三日月", "ウ：上弦の月", "エ：満月", "オ：下弦の月"], "answer": 3, "explanation": "満月は太陽と反対側にあるので、太陽がしずむ（日の入り）ころにちょうど反対からのぼってきます。"}, {"id": "tsk2_k01", "subject": "tsuki2_kakomon", "month": "202609", "qImage": "../images/tsuki2_k_graph1.jpg", "q": "グラフ1は、横浜におけるある時期の約1か月間の、日の出・日の入り・月の出の時刻を表したものです（たて軸は時刻、24時間法）。満月が地平線からあがってくる日はいつですか。次のア〜オから1つ選びなさい。", "options": ["ア：7日", "イ：12日", "ウ：17日", "エ：22日", "オ：27日"], "answer": 4, "explanation": "満月は太陽と反対側にあるので、太陽がしずむのと入れかわりにのぼります。つまり「月の出の時刻＝日の入りの時刻」になる日が満月です。グラフでは月の出の線と日の入りの線が交わるのが⑥のあたりで、27日ごろにあたります。"}, {"id": "tsk2_k02", "subject": "tsuki2_kakomon", "month": "202609", "qImage": "../images/tsuki2_k_graph1.jpg", "q": "月が午後9時ごろに南の空に見えるのはいつですか。グラフ1の①〜⑦から1つ選びなさい。", "options": ["①", "②", "③", "④", "⑤", "⑥", "⑦"], "answer": 4, "explanation": "月は、のぼってから南の空に来る（南中する）までに約6時間かかります。午後9時（21時）に南中するには、その6時間前の15時に月の出をむかえていればよいので、月の出が15時の⑤が正解です。"}, {"id": "tsk2_k04", "subject": "tsuki2_kakomon", "month": "202609", "q": "月は地球のまわりをおよそひと月で1周し、満月から次の満月までおよそ29日かかります。また、地球は太陽のまわりをおよそ365日で1周しています。\nある日の午後6時に半月が見えました。月が見える方角は、3日前の午後6時とくらべてどちらにずれていますか。", "options": ["1：東", "2：西"], "answer": 0, "explanation": "月は地球のまわりを西から東へ公転しているので、毎日同じ時刻にくらべると1日に約12度ずつ東へずれていきます。3日前とくらべると約36度、東へずれた位置に見えます。"}], "shakai": [{"id": "nog1_01", "subject": "nougyou1_kihon", "month": "202609", "type": "selfjudge", "q": "米作りに適している環境に関して、（　）に適切な言葉を入れましょう。\n\n「夏に（　①　）が高く（　②　）が多い気候」", "answer": "① 気温　② 雨", "explanation": "稲はもともと暑い地域の植物なので、よく育つには夏の高い気温と、田に張るたくさんの水（雨）が必要です。"}, {"id": "nog1_02", "subject": "nougyou1_kihon", "month": "202609", "type": "selfjudge", "q": "いくつかの稲をかけあわせて、病気や寒さに強い品種を作ることを何といいますか。", "answer": "品種改良", "explanation": "よい性質をもつ稲どうしをかけあわせて、新しい品種を作ることを品種改良といいます。コシヒカリやゆめぴりかなどもこうして生まれました。"}, {"id": "nog1_03", "subject": "nougyou1_kihon", "month": "202609", "type": "selfjudge", "q": "日本の農地の中で、作付面積の割合が最も高い作物は何ですか。", "answer": "稲", "explanation": "日本の耕地のおよそ半分は田で、作付面積でも稲（米）が最も大きな割合をしめています。"}, {"id": "nog1b2_01", "subject": "nougyou1_kihon", "month": "202609", "type": "selfjudge", "qImage": "../images/nougyou1_map.jpg", "q": "米作りがさかんな地域として有名な北海道の「①の盆地」の名前は何ですか。", "answer": "上川盆地", "explanation": "上川盆地は北海道の中央部、旭川市のまわりに広がる盆地です。北海道でも夏は気温が高くなるため、米作りがさかんです。"}, {"id": "nog1_r01", "subject": "nougyou1_renshu", "month": "202609", "type": "selfjudge", "q": "「日本では昔からいろいろな作物を育ててきた。特に日本人の主食でもあった（　Ⅰ　）は、現在でも日本全国で生産が行われており…」\n\n文中の（　Ⅰ　）に入る適切な農作物の名前を答えなさい。", "answer": "米", "explanation": "米は日本人の主食で、北海道から九州・沖縄まで、日本全国で作られています。"}, {"id": "nog1_r02", "subject": "nougyou1_renshu", "month": "202609", "type": "selfjudge", "q": "「…特に（　Ⅰ　）の生産量が多いのは（　Ⅱ　）地方で、全体の生産量のうち約3割を占めている。」\n\n文中の（　Ⅱ　）に入る適切な地方名を答えなさい。", "answer": "東北地方", "explanation": "東北地方は全国の米の約3割を生産する「日本の米どころ」です。庄内平野・秋田平野・仙台平野などで米作りがさかんです。"}, {"id": "nog1_r03", "subject": "nougyou1_renshu", "month": "202609", "qImage": "../images/nougyou1_r_nenkan.jpg", "q": "図は、米の生産に関する1年の流れです。図中の㋐〜㋒に入る作業の正しい組み合わせを、次から1つ選びなさい。", "options": ["ア：㋐稲かり・㋑田植え・㋒田おこし", "イ：㋐稲かり・㋑田おこし・㋒田植え", "ウ：㋐田おこし・㋑田植え・㋒稲かり", "エ：㋐田おこし・㋑稲かり・㋒田植え", "オ：㋐田植え・㋑稲かり・㋒田おこし", "カ：㋐田植え・㋑田おこし・㋒稲かり"], "answer": 2, "explanation": "4月ごろに田を耕す「田おこし」、水を入れてならす「代かき」、5月ごろに「田植え」、夏は水の管理、9〜10月に「稲かり」→脱穀→乾燥・もみすり、の順です。"}, {"id": "nog1_k01", "subject": "nougyou1_kakomon", "month": "202609", "q": "田んぼや田植えに関する説明として正しいものを次から1つ選びなさい。", "options": ["ア：稲をしっかり育てるために、田んぼに水を入れ、土を砕いて平らにならす田おこしが行われる。", "イ：種もみを直接田畑にまく、直まきが米作りの主流となっている。", "ウ：同じ土地で稲作を続けるため、田んぼでは連作障害が生じやすい。", "エ：傾斜が急な山地などでも、棚田という形で田んぼが作られている。"], "answer": 3, "explanation": "山の斜面を階段状にした「棚田」は、傾斜が急な土地でも米作りをするくふうです（エ）。ア：水を入れて土を砕き平らにするのは「代かき」。田おこしは田の土を掘り起こす作業です。イ：日本の米作りは苗を育ててから植える「田植え」が主流です。ウ：田んぼは水が養分を運び、病原菌なども流すので、同じ土地で続けても連作障害が起こりにくいのが特ちょうです。"}, {"id": "nog1_k02", "subject": "nougyou1_kakomon", "month": "202609", "q": "東北地方の稲作について述べられた文章のうち、正しいものを1つ選びなさい。", "options": ["ア：寒冷な東北地方は稲作に不向きであったが、温暖化によって気候が変わったために稲作ができるようになった。", "イ：東北地方に夏に北西から吹く冷たい風は、この地域を涼しくするため、米の収穫量を増やす。", "ウ：東北地方の米どころといえば、北上川の流域にある山形県の庄内平野などが有名である。", "エ：東北地方の稲作農家は、全国の稲作農家と同じように兼業農家が大半を占める。", "オ：東北地方で生産される米は値段が高いため、海外から輸入される価格の安い米よりも日本国内での販売量は少ない。"], "answer": 3, "explanation": "東北地方の稲作農家も、全国と同じく兼業農家が大半です（エ）。ア：寒さに強い品種への改良や技術の進歩で稲作がさかんになりました。イ：夏に北東から吹く冷たく湿った風「やませ」は、冷害を起こして収穫量を減らします。ウ：庄内平野を流れるのは最上川です（北上川は岩手・宮城）。オ：国産米のほうが輸入米よりずっと多く販売されています。"}, {"id": "nog1_k03", "subject": "nougyou1_kakomon", "month": "202609", "type": "selfjudge", "q": "福岡県では耕地面積（79,700ha）よりも作付け延べ面積（91,400ha）のほうが大きくなっており、耕地利用率は100％を超えている（115％）。これは福岡県で（　）作がさかんなためである。空らんにあてはまる言葉を漢字2字で答えなさい。", "answer": "二毛", "explanation": "同じ耕地で1年に2種類の作物をつくる「二毛作」がさかんだと、のべの作付け面積が耕地面積より大きくなり、耕地利用率が100％をこえます。福岡県の筑紫平野では、夏に米、冬に小麦や大麦をつくる二毛作が行われています。"}, {"id": "nog2_01", "subject": "nougyou2_kihon", "month": "202609", "type": "selfjudge", "q": "国内で小麦の生産量が最も多い都道府県はどこですか。", "answer": "北海道", "explanation": "小麦は北海道が全国の約6割を生産しています。すずしく、梅雨がほとんどない気候が小麦作りに向いています。"}, {"id": "nog2_02", "subject": "nougyou2_kihon", "month": "202609", "type": "selfjudge", "q": "日本が大豆を最も多く輸入している国はどこですか。", "answer": "アメリカ（合衆国）", "explanation": "大豆は約4分の3をアメリカから輸入しています。とうふ・しょうゆ・みその原料ですが、国内で作られる量は少なく、ほとんどを輸入にたよっています。"}, {"id": "nog2_03", "subject": "nougyou2_kihon", "month": "202609", "type": "selfjudge", "q": "近年、とうもろこしを原料とした燃料が作られていますが、その燃料を何といいますか。", "answer": "バイオエタノール（バイオマスエタノール）", "explanation": "とうもろこしやさとうきびなどの植物から作る燃料をバイオエタノールといいます。原料の植物が育つときに二酸化炭素を吸収するので、地球温暖化を防ぐ燃料として期待されています。"}, {"id": "nog2b2_01", "subject": "nougyou2_kihon", "month": "202609", "type": "selfjudge", "qImage": "../images/nougyou2_graph.jpg", "q": "日本はさまざまな穀物を輸入にたよっています。グラフは、小麦と大豆の日本の輸入相手国の割合をまとめたものです。\n\nグラフのアにあてはまる国の名前を答えなさい。", "answer": "アメリカ（合衆国）", "explanation": "小麦も大豆も、輸入先の1位はアメリカです。小麦はカナダ・オーストラリア、大豆はブラジル・カナダからも輸入しています。"}, {"id": "nog2_r01", "subject": "nougyou2_renshu", "month": "202609", "q": "大豆は日本の伝統ある食品に使われてきましたが、その例としてあてはまらないものを次の中から1つ選びなさい。", "options": ["ア：納豆", "イ：豆腐", "ウ：こんにゃく", "エ：きな粉"], "answer": 2, "explanation": "こんにゃくの原料は大豆ではなく、こんにゃくいもです（群馬県が特産）。納豆・豆腐・きな粉のほか、しょうゆやみそも大豆から作られます。"}, {"id": "nog2_r02", "subject": "nougyou2_renshu", "month": "202609", "type": "selfjudge", "q": "次の文の空欄（　Ⅰ　）に入るふさわしい国名を答えなさい。\n\n『小麦・大豆・とうもろこしは主に（　Ⅰ　）からの輸入にたよっている。』", "answer": "アメリカ（合衆国）", "explanation": "小麦・大豆・とうもろこしは、どれもアメリカが輸入先の1位です。日本はこれらの穀物の多くを輸入にたよっています。"}, {"id": "nog2_r09", "subject": "nougyou2_renshu", "month": "202609", "qImage": "../images/nougyou2_r_map.jpg", "q": "『この地域ではすずしい気候に適した作物である小麦やじゃがいもの生産がさかんである。また、砂糖の原料となる工芸作物の生産もさかんである。』\n\nこの説明にあてはまる地域を、地図中のア〜キから1つ選びなさい。", "options": ["ア", "イ", "ウ", "エ", "オ", "カ", "キ"], "answer": 0, "explanation": "小麦・じゃがいも、砂糖の原料のてんさいの生産がさかんなのは北海道で、地図のアです。"}, {"id": "nog2_k01", "subject": "nougyou2_kakomon", "month": "202609", "q": "以下のAとBの文章で述べられている「工芸作物」について、組み合わせが正しいものをア～カから1つ選びなさい。\nA：昨年は、日本三大急流の一つである川が、大量の雨水により氾濫を起こし被害をもたらしました。この県では、カルデラ地形で有名な山もあり、豊かな自然が特徴です。県南地方ではある工芸作物の生産がさかんとなっており、県内シェアの96％を占めています。\nB：県内には流域面積が日本一である川が流れています。キャベツの生産が日本一であるほか、ある工芸作物の生産も日本一となっています。県内には、町内人口の約10％がある国の人である町もあります。", "options": ["ア：A―いぐさ　B―茶", "イ：A―こんにゃくいも　B―いぐさ", "ウ：A―いぐさ　B―なたね", "エ：A―茶　B―こんにゃくいも", "オ：A―いぐさ　B―こんにゃくいも", "カ：A―なたね　B―こんにゃくいも"], "answer": 4, "explanation": "Aは熊本県です。日本三大急流の球磨川、カルデラで有名な阿蘇山があり、県南の八代平野ではたたみの原料の「いぐさ」がさかんにつくられています。Bは群馬県です。流域面積日本一の利根川が流れ、嬬恋村のキャベツが有名で、「こんにゃくいも」の生産は全国の大部分をしめています。大泉町はブラジル人など外国の人が多く住む町です。よってオ。"}, {"id": "nog2_k03", "subject": "nougyou2_kakomon", "month": "202609", "qImage": "../images/nougyou2_k_chizu.jpg", "qImage2": "../images/nougyou2_k_shashin.jpg", "q": "資料1（地図）は、ある工芸作物の生産量上位5県（2011年）を示しています。資料1で示されている工芸作物を、下の写真ア〜エから選び、記号で答えなさい。", "options": ["ア", "イ", "ウ", "エ"], "answer": 3, "explanation": "色がぬられているのは静岡・三重・京都・宮崎・鹿児島で、茶の産地です。エは、かまぼこ形にきれいに刈りそろえられた茶畑です（立っている柱は、霜の害を防ぐための防霜ファン）。アはさとうきび、イはいぐさの畑です。"}], "kokugo": [{"id": "msh_01", "subject": "meishi9_kihon", "month": "202609", "q": "次の選択肢の中から「普通名詞」を選び、記号で答えなさい。", "options": ["ア 七枚", "イ あれ", "ウ どなた", "エ 筆箱", "オ 佐藤さん", "カ 静岡県", "キ おれ", "ク 十四番目", "ケ 利根川", "コ ここ"], "answer": 3, "explanation": "普通名詞は、同じ種類のもの全体に使える一般的な名前です。「筆箱」はどの筆箱にも使える名前なので普通名詞（エ）。「佐藤さん」「静岡県」「利根川」はただ一つのものの名前なので固有名詞、「七枚」「十四番目」は数詞、「あれ」「どなた」「おれ」「ここ」は代名詞です。"}, {"id": "msh_02", "subject": "meishi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の選択肢の中から「固有名詞」をすべて選び、記号で答えなさい。\n【選択肢】ア 七枚／イ あれ／ウ どなた／エ 筆箱／オ 佐藤さん／カ 静岡県／キ おれ／ク 十四番目／ケ 利根川／コ ここ", "answer": "オ、カ、ケ", "explanation": "固有名詞は、人名・地名・国名など、ただ一つのものにつけられた名前です。「佐藤さん」（人名）、「静岡県」（地名）、「利根川」（川の名前）が固有名詞です。"}, {"id": "msh_03", "subject": "meishi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の選択肢の中から「数詞」をすべて選び、記号で答えなさい。\n【選択肢】ア 七枚／イ あれ／ウ どなた／エ 筆箱／オ 佐藤さん／カ 静岡県／キ おれ／ク 十四番目／ケ 利根川／コ ここ", "answer": "ア、ク", "explanation": "数詞は、ものの数や量・順番を表す名詞です。「七枚」（数）、「十四番目」（順番）が数詞です。"}, {"id": "msh_04", "subject": "meishi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の選択肢の中から「人称代名詞」をすべて選び、記号で答えなさい。\n【選択肢】ア 七枚／イ あれ／ウ どなた／エ 筆箱／オ 佐藤さん／カ 静岡県／キ おれ／ク 十四番目／ケ 利根川／コ ここ", "answer": "ウ、キ", "explanation": "人称代名詞は、人を指し示す代名詞です。「どなた」（だれかをていねいにたずねる）、「おれ」（自分を指す）が人称代名詞です。"}, {"id": "msh_05", "subject": "meishi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の選択肢の中から「指示代名詞」をすべて選び、記号で答えなさい。\n【選択肢】ア 七枚／イ あれ／ウ どなた／エ 筆箱／オ 佐藤さん／カ 静岡県／キ おれ／ク 十四番目／ケ 利根川／コ ここ", "answer": "イ、コ", "explanation": "指示代名詞は、物・場所・方向などを指し示す代名詞です。「あれ」（物）、「ここ」（場所）が指示代名詞です。"}, {"id": "msh_06", "subject": "meishi9_kihon", "month": "202609", "q": "次の文の①「三日前」の名詞の種類を選び、記号で答えなさい。\n『①三日前、私は学校でブラジルの文化について調べた。そこは日本とのかかわりが深いとわかり、次に他の国についても調べることにした。』", "options": ["ア 普通名詞", "イ 固有名詞", "ウ 数詞", "エ 代名詞", "オ 形式名詞"], "answer": 2, "explanation": "「三日前」は日にち（時間の量）を数で表す言葉なので「数詞」です。"}, {"id": "msh_h01", "subject": "meishi9_hojuu", "month": "202609", "type": "selfjudge", "q": "次の文の中から名詞をすべてぬき出しなさい。\n『赤い大きな花が庭に咲いた。』", "answer": "花、庭", "explanation": "「赤い」は形容詞、「大きな」は連体詞、「咲い（た）」は動詞です。ものの名前を表す「花」「庭」が名詞です。"}, {"id": "msh_h02", "subject": "meishi9_hojuu", "month": "202609", "type": "selfjudge", "q": "次の文の中から名詞をすべてぬき出しなさい。\n『あれは、隣の人の車だ。』", "answer": "あれ、隣、人、車", "explanation": "「あれ」は物を指す代名詞（指示代名詞）で、代名詞も名詞のなかまです。「隣」「人」「車」も名詞です。"}, {"id": "dsh_01", "subject": "doushi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の文の［　］の動詞の言い切りの形を答えなさい。\n『本を［読み］たかった。』", "answer": "読む", "explanation": "「読み（たかった）」は、言い切ると「読む」。動詞の言い切りの形（終止形）は、ウ段の音（む・ぶ・う…）で終わります。"}, {"id": "dsh_02", "subject": "doushi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の文の［　］の動詞の言い切りの形を答えなさい。\n『今日、［遊び］ましょう。』", "answer": "遊ぶ", "explanation": "「遊び（ましょう）」は、言い切ると「遊ぶ」です。"}, {"id": "dsh_03", "subject": "doushi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の文の［　］の動詞の言い切りの形を答えなさい。\n『書道では書写を［習い］ます。』", "answer": "習う", "explanation": "「習い（ます）」は、言い切ると「習う」です。"}, {"id": "dsh_04", "subject": "doushi9_kihon", "month": "202609", "type": "selfjudge", "q": "次の文がほとんど同じ意味になるように、［　］の動詞の形を変えなさい。\n『水を［流す］。』→「水が（　　）。」", "answer": "流れる", "explanation": "「水を流す」は人が水に何かをする言い方（他動詞）、「水が流れる」は水そのものの動きを表す言い方（自動詞）です。「〜を」なら流す、「〜が」なら流れる。"}, {"id": "dsh_h01", "subject": "doushi9_hojuu", "month": "202609", "type": "selfjudge", "q": "次の文の（　）の言葉を、意味が通るように形を直しなさい。\n『急がば（まわる）。』", "answer": "まわれ", "explanation": "ことわざ「急がば回れ」。急ぐときほど、遠回りでも安全な道を行くほうが結局早いという意味。「回れ」は命令の形（命令形）です。"}, {"id": "dsh_h02", "subject": "doushi9_hojuu", "month": "202609", "type": "selfjudge", "q": "次の文の（　）の言葉を、意味が通るように形を直しなさい。\n『三人（寄る）ば文殊の知恵。』", "answer": "寄れ", "explanation": "ことわざ「三人寄れば文殊の知恵」。「ば」に続くときは「寄れ（ば）」の形（仮定形）になります。"}, {"id": "dsh_h03", "subject": "doushi9_hojuu", "month": "202609", "type": "selfjudge", "q": "次の文の（　）の言葉を、意味が通るように形を直しなさい。\n『（飛ぶ）て火にいる夏の虫。』", "answer": "飛ん", "explanation": "ことわざ「飛んで火にいる夏の虫」。「飛ぶ」に「て」がつくと「飛んで」と音が変わります（撥音便）。"}, {"id": "dsh_h04", "subject": "doushi9_hojuu", "month": "202609", "type": "selfjudge", "q": "次の文の（　）の言葉を、意味が通るように形を直しなさい。\n『人のふり（見る）我がふり直せ。』", "answer": "見て", "explanation": "ことわざ「人のふり見て我がふり直せ」。後ろに言葉が続くので「見て」の形にします。"}], "sansu": [{"id": "yks_01", "subject": "yakusu9_kihon", "month": "202609", "type": "input", "q": "72の約数は全部で何個ありますか。", "answer": "12個", "explanation": "72 = 2×2×2×3×3\n約数を組にして書き出すと\n1×72、2×36、3×24、4×18、6×12、8×9\n→ 1、2、3、4、6、8、9、12、18、24、36、72 の12個。\n（かけ算の組で書き出すと、もれや重なりがなくなります）"}, {"id": "yks_02", "subject": "yakusu9_kihon", "month": "202609", "type": "selfjudge", "q": "180を素因数分解しなさい。", "answer": "2×2×3×3×5", "explanation": "小さい素数から順に割っていきます。\n180÷2=90、90÷2=45、45÷3=15、15÷3=5\n→ 180 = 2×2×3×3×5\n（素数を小さい順にかけ算で書けていれば正解）"}, {"id": "yks_03", "subject": "yakusu9_kihon", "month": "202609", "type": "selfjudge", "q": "51を割って3あまる整数をすべて求めなさい。", "answer": "4、6、8、12、16、24、48", "explanation": "あまりの3を引いた 51-3=48 は、割り切れる数です。つまり答えは48の約数。\n48の約数：1、2、3、4、6、8、12、16、24、48\nただし「あまり3」なので、割る数は3より大きくないといけません（あまりは割る数より小さい）。\n→ 1、2、3 をのぞいて 4、6、8、12、16、24、48"}, {"id": "yks_r01", "subject": "yakusu9_renshu", "month": "202609", "type": "input", "q": "150の約数のうち、大きい方から4番目の数は何ですか。", "answer": "30", "explanation": "約数を組にして書き出すと\n1×150、2×75、3×50、5×30、6×25、10×15\n大きい方から 150、75、50、30 … → 4番目は30\n（小さい方から4番目の5と組になる数、と考えても求められます）"}, {"id": "yks_r02", "subject": "yakusu9_renshu", "month": "202609", "type": "selfjudge", "q": "40を割っても、60を割っても割り切れる整数をすべて求めなさい。", "answer": "1、2、4、5、10、20", "explanation": "両方を割り切れる数＝40と60の公約数です。\n最大公約数は20（40=20×2、60=20×3）。\n20の約数：1、2、4、5、10、20"}, {"id": "yks_r03", "subject": "yakusu9_renshu", "month": "202609", "type": "selfjudge", "q": "アメが32個、グミが48個あります。何人かの子どもに同じ数ずつ分けたいと思います。どちらもあまりなく分けられるのは、子どもの人数が何人のときですか。考えられる人数をすべて求めなさい。ただし、子どもの人数は4人より多いものとします。", "answer": "8人、16人", "explanation": "どちらもあまりなく分けられる人数＝32と48の公約数。\n最大公約数は16（32=16×2、48=16×3）。\n16の約数：1、2、4、8、16\n「4人より多い」ので4人は入らず → 8人、16人"}, {"id": "bss_01", "subject": "baisu9_kihon", "month": "202609", "type": "selfjudge", "q": "8の倍数を、小さい方から順に4つ求めなさい。", "answer": "8、16、24、32", "explanation": "倍数は「その数に1、2、3、…をかけた数」です。\n8×1=8、8×2=16、8×3=24、8×4=32\n（0は倍数に入れません）"}, {"id": "bss_02", "subject": "baisu9_kihon", "month": "202609", "type": "input", "q": "3と7の公倍数のうち、小さい方から4番目の数を求めなさい。", "answer": "84", "explanation": "公倍数は「最小公倍数の倍数」です。\n3と7の最小公倍数は 3×7=21（公約数が1だけなので、かけるだけ）。\n21、42、63、84 → 4番目は 21×4=84"}, {"id": "bss_03", "subject": "baisu9_kihon", "month": "202609", "type": "selfjudge", "q": "6と8の公倍数のうち、100以下のものをすべて求めなさい。", "answer": "24、48、72、96", "explanation": "6と8の最小公倍数は24（6×8=48ではないので注意。6=2×3、8=2×2×2 → 2×2×2×3=24）。\n24の倍数で100以下：24、48、72、96\n（100÷24=4あまり4 → 4個）"}, {"id": "bss_r01", "subject": "baisu9_renshu", "month": "202609", "type": "input", "q": "1から50までの整数のなかに、7の倍数は何個ありますか。", "answer": "7個", "explanation": "1からある数までの中の7の倍数の個数は、わり算の商で求められます。\n50÷7=7あまり1 → 7個（7、14、21、28、35、42、49）"}, {"id": "bss_r02", "subject": "baisu9_renshu", "month": "202609", "type": "input", "q": "2けたの整数について、6の倍数は何個ありますか。", "answer": "15個", "explanation": "2けたの整数は10〜99。\n1〜99の中の6の倍数：99÷6=16あまり3 → 16個\n1〜9の中の6の倍数：9÷6=1あまり3 → 1個（6）\n16-1=15個\n（「1〜大きい方」から「1〜小さい方の手前」を引くのがコツ）"}, {"id": "bss_r03", "subject": "baisu9_renshu", "month": "202609", "type": "input", "q": "2けたの整数について、4でも6でも割り切れる数は何個ありますか。", "answer": "8個", "explanation": "4でも6でも割り切れる数＝4と6の公倍数＝最小公倍数12の倍数です（4×6=24ではありません）。\n1〜99：99÷12=8あまり3 → 8個\n1〜9：0個\n8-0=8個（12、24、36、48、60、72、84、96）"}, {"id": "bss_r04", "subject": "baisu9_renshu", "month": "202609", "type": "input", "q": "50以上100以下の整数について、8の倍数は何個ありますか。", "answer": "6個", "explanation": "「50以上」は50をふくむので、1〜100 から 1〜49 を引きます。\n1〜100：100÷8=12あまり4 → 12個\n1〜49：49÷8=6あまり1 → 6個\n12-6=6個（56、64、72、80、88、96）"}, {"id": "sbn_01", "subject": "shobun9_kihon", "month": "202609", "type": "input", "mustReduce": true, "q": "次の小数を分数になおしなさい。ただし、約分できる分数は約分しなさい。\n0.3", "answer": "3/10", "explanation": "0.3 は 0.1 が3こ → 3/10（これ以上約分できない）"}, {"id": "sbn_02", "subject": "shobun9_kihon", "month": "202609", "type": "input", "mustReduce": true, "q": "次の小数を分数になおしなさい。ただし、約分できる分数は約分しなさい。\n1.25", "answer": "1 1/4", "explanation": "1.25 = 1 + 0.25\n0.25 = 25/100 = 1/4（25で約分）\n→ 1と1/4（5/4 でもOK）\n※ 0.25=1/4、0.75=3/4 はおぼえておくと速い"}, {"id": "sbn_03", "subject": "shobun9_kihon", "month": "202609", "type": "input", "mustReduce": true, "q": "次の小数を分数になおしなさい。ただし、約分できる分数は約分しなさい。\n2.07", "answer": "2 7/100", "explanation": "2.07 = 2 + 0.07\n0.07 = 7/100（小数第2位なので分母は100）\n→ 2と7/100（207/100 でもOK）\n※ 7/10 としないように注意"}, {"id": "sbn_04", "subject": "shobun9_kihon", "month": "202609", "type": "input", "mustReduce": true, "q": "次の小数を分数になおしなさい。ただし、約分できる分数は約分しなさい。\n2.5", "answer": "2 1/2", "explanation": "2.5 = 2 + 0.5\n0.5 = 5/10 = 1/2\n→ 2と1/2（5/2 でもOK）"}, {"id": "sbn_r01", "subject": "shobun9_renshu", "month": "202609", "type": "input", "mustReduce": true, "q": "次の小数を分数になおしなさい（約分できる分数は約分すること）。\n0.7", "answer": "7/10", "explanation": "0.7 は 0.1 が7こ → 7/10（これ以上約分できない）"}, {"id": "sbn_r02", "subject": "shobun9_renshu", "month": "202609", "type": "input", "mustReduce": true, "q": "次の小数を分数になおしなさい（約分できる分数は約分すること）。\n6.5", "answer": "6 1/2", "explanation": "6.5 = 6 + 0.5\n0.5 = 5/10 = 1/2 → 6と1/2（13/2 でもOK）"}, {"id": "sbn_r03", "subject": "shobun9_renshu", "month": "202609", "type": "input", "mustReduce": true, "q": "次の小数を分数になおしなさい（約分できる分数は約分すること）。\n0.84", "answer": "21/25", "explanation": "0.84 = 84/100\n84と100は4で割れる → 21/25"}]};
const CAT_LABEL = {"shakai": "社会", "rika": "理科", "kokugo": "国語", "sansu": "算数"};
const CAT_COLOR = {"shakai": "#1d4ed8", "rika": "#065f46", "kokugo": "#3730a3", "sansu": "#be185d"};
const CAT_ORDER = ["rika", "shakai", "kokugo", "sansu"];

const sheet = document.getElementById('sheet');
let daimon = 0;
for (const cat of CAT_ORDER) {
  daimon++;
  const sec = document.createElement('section');
  sec.className = 'region';
  const h = document.createElement('h2');
  h.textContent = `大問${daimon}　${CAT_LABEL[cat]}`;
  h.style.background = CAT_COLOR[cat];
  sec.appendChild(h);
  EXAM[cat].forEach((q, i) => {
    const type = q.type || 'choice';
    let ansText;
    if (type === 'choice') {
      const idx = q.answer;
      ansText = `${idx + 1}番：${q.options[idx]}`;
    } else {
      ansText = q.answer;
    }
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<span class="n"></span> <span class="ans"></span><div class="exp"></div>`;
    d.querySelector('.n').textContent = `問${i + 1}`;
    d.querySelector('.ans').textContent = ansText;
    d.querySelector('.exp').textContent = q.explanation || '';
    sec.appendChild(d);
  });
  sheet.appendChild(sec);
}
</script>
