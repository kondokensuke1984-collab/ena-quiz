<!DOCTYPE html>

<head>

<title>10月 4科演習たいさく 算数模試（オリジナル） 解答・解説</title>
<style>
  @page { size: A4 portrait; margin: 11mm 12mm 10mm; }

  body{
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    color:#111; -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  header{ border-bottom:1.2mm solid #111; padding-bottom:2mm; margin-bottom:4mm; }

</style>

<body>
<header>
  <h1>10月 4科演習たいさく 算数模試（オリジナル）　解答・解説<span class="warn">※おうちの人用</span></h1>
  <div class="info">1問5点・100点満点／目安時間40分。単位がないもの・約分していない分数は、その場で直させてから正解にしてください。</div>
</header>
<div class="sheet" id="sheet"></div>
<script>
const EXAM = [{"title": "立方体と直方体", "qs": [{"q": "1辺が7cmの立方体があります。この立方体の体積は何cm³ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 182 182\" width=\"182\" height=\"182\"><polygon points=\"118.0,147.7 118.0,63.7 147.7,34.0 147.7,118.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"118.0,63.7 34.0,63.7 63.7,34.0 147.7,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,147.7 118.0,147.7 118.0,63.7 34.0,63.7\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"76.0\" y=\"159.7\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">7cm<\/text><text x=\"16.0\" y=\"105.7\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">7cm<\/text><text x=\"154.8\" y=\"138.8\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">7cm<\/text><\/svg>", "answer": "343cm³", "explanation": "立方体の体積＝1辺×1辺×1辺\n7×7×7＝343（cm³）"}, {"q": "図の直方体の表面積は何cm²ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 195 169\" width=\"195\" height=\"169\"><polygon points=\"138.0,57.0 34.0,57.0 57.0,34.0 161.0,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"138.0,135.0 138.0,57.0 161.0,34.0 161.0,112.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,135.0 138.0,135.0 138.0,57.0 34.0,57.0\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"86.0\" y=\"147.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">8cm<\/text><text x=\"16.0\" y=\"96.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><text x=\"171.5\" y=\"129.5\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">5cm<\/text><\/svg>", "answer": "236cm²", "explanation": "向かい合う面は同じ形なので、3種類の面を2つずつ。\n8×6＝48、8×5＝40、6×5＝30\n（48＋40＋30）×2＝236（cm²）"}, {"q": "たて6cm、横10cmの直方体があります。体積が360cm³のとき、高さは何cmですか。", "answer": "6cm", "explanation": "体積＝たて×横×高さ なので、高さ＝体積÷（たて×横）\n360÷（6×10）＝360÷60＝6（cm）"}, {"q": "表面積が150cm²の立方体があります。この立方体の体積は何cm³ですか。", "answer": "125cm³", "explanation": "立方体の6つの面はすべて同じ正方形。\n1つの面は 150÷6＝25（cm²）、25＝5×5 なので1辺は5cm。\n体積は 5×5×5＝125（cm³）"}, {"q": "図は、2つの直方体を組み合わせた立体です。この立体の体積は何cm³ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 226 200\" width=\"226\" height=\"200\"><polygon points=\"86.0,126.6 86.0,61.6 113.6,34.0 113.6,99.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"164.0,126.6 86.0,126.6 113.6,99.0 191.6,99.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"86.0,61.6 34.0,61.6 61.6,34.0 113.6,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"164.0,165.6 164.0,126.6 191.6,99.0 191.6,138.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,165.6 164.0,165.6 164.0,126.6 86.0,126.6 86.0,61.6 34.0,61.6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"99.0\" y=\"177.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">10cm<\/text><text x=\"60.0\" y=\"51.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><text x=\"16.0\" y=\"113.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">8cm<\/text><text x=\"148.0\" y=\"146.1\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">3cm<\/text><text x=\"199.8\" y=\"157.8\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><\/svg>", "answer": "300cm³", "explanation": "前の面を2つの長方形に分ける。\n左：4×8＝32、右：（10－4）×3＝18 → 前の面は 32＋18＝50（cm²）\n奥行きが6cmなので 50×6＝300（cm³）\n（別解）4×8×6＋6×3×6＝192＋108＝300"}, {"q": "図は、3だんの階段の形をした立体です。だんの高さはどれも2cm、はばはどれも3cm、奥行きは5cmです。この立体の表面積は何cm²ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 208 169\" width=\"208\" height=\"169\"><polygon points=\"73.0,57.0 34.0,57.0 57.0,34.0 96.0,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"73.0,83.0 73.0,57.0 96.0,34.0 96.0,60.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"112.0,83.0 73.0,83.0 96.0,60.0 135.0,60.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"112.0,109.0 112.0,83.0 135.0,60.0 135.0,86.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"151.0,109.0 112.0,109.0 135.0,86.0 174.0,86.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"151.0,135.0 151.0,109.0 174.0,86.0 174.0,112.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,135.0 151.0,135.0 151.0,109.0 112.0,109.0 112.0,83.0 73.0,83.0 73.0,57.0 34.0,57.0\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"92.5\" y=\"147.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">9cm<\/text><text x=\"16.0\" y=\"96.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><text x=\"184.5\" y=\"129.5\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">5cm<\/text><\/svg>", "answer": "222cm²", "explanation": "前と後ろの面：3×6＋3×4＋3×2＝36（cm²）が2つで72（cm²）\nまわりの面は、横にのばすと たて5cm・横＝前の面のまわりの長さの長方形になる。\n前の面のまわりの長さ＝（9＋6）×2＝30（cm） → 30×5＝150（cm²）\n合わせて 72＋150＝222（cm²）"}, {"q": "図は、直方体から、はばが4cm・深さが4cmの直方体を、前から後ろまで取りのぞいた立体です。この立体の体積は何cm³ですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 247 182\" width=\"247\" height=\"182\"><polygon points=\"86.0,109.0 86.0,57.0 109.0,34.0 109.0,86.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"86.0,57.0 34.0,57.0 57.0,34.0 109.0,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"138.0,109.0 86.0,109.0 109.0,86.0 161.0,86.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,148.0 190.0,57.0 213.0,34.0 213.0,125.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,57.0 138.0,57.0 161.0,34.0 213.0,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,148.0 190.0,148.0 190.0,57.0 138.0,57.0 138.0,109.0 86.0,109.0 86.0,57.0 34.0,57.0\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"112.0\" y=\"160.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">12cm<\/text><text x=\"16.0\" y=\"102.5\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">7cm<\/text><text x=\"112.0\" y=\"119.0\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><text x=\"223.5\" y=\"142.5\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">5cm<\/text><\/svg>", "answer": "340cm³", "explanation": "もとの直方体から、取りのぞいた直方体をひく。\n12×5×7＝420、4×5×4＝80\n420－80＝340（cm³）"}, {"q": "図は、3つの直方体を組み合わせた立体で、体積は456cm³です。□の長さは何cmですか。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 252 239\" width=\"252\" height=\"239\"><polygon points=\"86.0,152.6 34.0,152.6 61.6,125.0 113.6,125.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,152.6 138.0,152.6 165.6,125.0 217.6,125.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"190.0,204.6 190.0,152.6 217.6,125.0 217.6,177.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"138.0,152.6 138.0,61.6 165.6,34.0 165.6,125.0\" fill=\"#cbd5e1\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"138.0,61.6 86.0,61.6 113.6,34.0 165.6,34.0\" fill=\"#e2e8f0\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><polygon points=\"34.0,204.6 190.0,204.6 190.0,152.6 138.0,152.6 138.0,61.6 86.0,61.6 86.0,152.6 34.0,152.6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><text x=\"112.0\" y=\"216.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">12cm<\/text><text x=\"16.0\" y=\"178.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><text x=\"112.0\" y=\"51.6\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">4cm<\/text><text x=\"68.0\" y=\"107.1\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">□cm<\/text><text x=\"225.8\" y=\"196.8\" font-size=\"12\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Hiragino Sans, sans-serif\" font-weight=\"700\">6cm<\/text><\/svg>", "answer": "11cm", "explanation": "下の直方体：12×6×4＝288（cm³）\n上の直方体の体積は 456－288＝168（cm³）\n上の直方体の高さ＝168÷（4×6）＝7（cm）\n□＝4＋7＝11（cm）"}, {"q": "内のりが、たて20cm・横30cm・深さ25cmの直方体の水そうがあります。この水そうに12Lの水を入れると、水の深さは何cmになりますか。", "answer": "20cm", "explanation": "1L＝1000cm³ なので 12L＝12000cm³\n底面積は 20×30＝600（cm²）\n深さ＝12000÷600＝20（cm）"}, {"q": "1辺が2cmの立方体のつみ木を、横に4こ、たてに3こならべ、それを2だん重ねて、すきまのない直方体を作りました。この直方体の表面積は何cm²ですか。", "answer": "208cm²", "explanation": "できた直方体は 横8cm・たて6cm・高さ4cm。\n8×6＝48、8×4＝32、6×4＝24\n（48＋32＋24）×2＝208（cm²）"}]}, {"title": "割合の表し方", "qs": [{"q": "次の□にあてはまる数を求めなさい。（分数で答えなさい）\n18kgは24kgの□倍", "answer": "3/4（倍）", "explanation": "AはBの A÷B 倍。\n18÷24＝18/24＝3/4"}, {"q": "次の□にあてはまる数を求めなさい。\n35人の1.6倍は□人", "answer": "56（人）", "explanation": "もとにする量×割合＝くらべる量\n35×1.6＝56（人）"}, {"q": "次の□にあてはまる数を求めなさい。\n□mの0.8倍は52m", "answer": "65（m）", "explanation": "もとにする量＝くらべる量÷割合\n52÷0.8＝65（m）"}, {"q": "次の□にあてはまる数を求めなさい。\n28人の 3/7 は□人", "answer": "12（人）", "explanation": "28×3/7＝12（人）\n（28を7等分すると4、その3つ分で12）"}, {"q": "次の□にあてはまる数を求めなさい。\n□円の 5/8 は450円", "answer": "720（円）", "explanation": "450÷5/8＝450×8/5＝720（円）\n（5つ分が450円なので1つ分は90円、8つ分で720円）"}, {"q": "定員が320人のホールに、368人のお客さんが入りました。定員をもとにしたときの、お客さんの人数の割合を小数で求めなさい。", "answer": "1.15", "explanation": "割合＝くらべる量÷もとにする量\n368÷320＝1.15"}, {"q": "弟はシールを42枚持っていて、これは兄が持っているシールの0.7倍です。兄はシールを何枚持っていますか。", "answer": "60枚", "explanation": "もとにする量（兄）＝42÷0.7＝60（枚）"}, {"q": "ゆいさんは、はじめの所持金の 3/8 を使って、600円の本を買いました。はじめの所持金は何円でしたか。", "answer": "1600円", "explanation": "はじめの所持金の 3/8 が600円。\n600÷3/8＝600×8/3＝1600（円）"}, {"q": "そうた君はある本を、全体の 5/9 まで読みました。残りは72ページです。この本は全部で何ページありますか。", "answer": "162ページ", "explanation": "残りは全体の 1－5/9＝4/9\n72÷4/9＝72×9/4＝162（ページ）"}, {"q": "ある学年の男子の人数は、学年全体の人数の 4/7 より3人多く、女子の人数は51人です。この学年の男子の人数は何人ですか。", "answer": "75人", "explanation": "男子は「全体の4/7＋3人」なので、女子は「全体の3/7－3人」。\n全体の 3/7 が 51＋3＝54（人）にあたる。\n全体＝54÷3/7＝126（人）\n男子＝126－51＝75（人）\n（たしかめ：126×4/7＋3＝72＋3＝75）"}]}];
const COLOR = '#0f766e';
const sheet = document.getElementById('sheet');
let n = 0;
EXAM.forEach((sec, si) => {
  const r = document.createElement('section');
  r.className = 'region';
  const h = document.createElement('h2');
  h.textContent = `大問${si + 1}　${sec.title}`;
  h.style.background = COLOR;
  r.appendChild(h);
  sec.qs.forEach(q => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<span class="n"></span>　<span class="ans"></span><div class="exp"></div>';
    d.querySelector('.n').textContent = `問${++n}`;
    d.querySelector('.ans').textContent = q.answer;
    d.querySelector('.exp').textContent = q.explanation || '';
    r.appendChild(d);
  });
  sheet.appendChild(r);
});
</script>
</body>
</html>
