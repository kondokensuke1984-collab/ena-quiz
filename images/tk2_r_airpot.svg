<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" style="background:#f8fafc;font-family:sans-serif">
  <!-- 図2ラベル -->
  <text x="10" y="18" font-size="13" font-weight="bold" fill="#1e293b">図2</text>
  <!-- おす矢印 -->
  <line x1="100" y1="22" x2="100" y2="42" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <text x="107" y="35" font-size="12" fill="#1e293b">おす</text>

  <!-- 外枠（ポット本体） -->
  <rect x="40" y="50" width="120" height="165" rx="12" fill="none" stroke="#374151" stroke-width="3"/>

  <!-- 押しボタン部（上部機構） -->
  <rect x="60" y="45" width="80" height="28" rx="6" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <rect x="75" y="50" width="50" height="16" rx="3" fill="#d1d5db"/>

  <!-- 中のピストン棒（管） -->
  <line x1="100" y1="73" x2="100" y2="115" stroke="#374151" stroke-width="3"/>
  <line x1="88" y1="73" x2="88" y2="130" stroke="#374151" stroke-width="2"/>
  <line x1="112" y1="73" x2="112" y2="130" stroke="#374151" stroke-width="2"/>

  <!-- 横に出るノズル -->
  <path d="M40,110 Q25,110 20,120 Q18,130 20,140" fill="none" stroke="#374151" stroke-width="3"/>

  <!-- 空気室（上部、グレー） -->
  <rect x="42" y="73" width="116" height="55" fill="#f3f4f6" opacity="0.9"/>
  <line x1="42" y1="128" x2="158" y2="128" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 空気ラベル -->
  <text x="145" y="105" font-size="12" fill="#374151">空気</text>
  <line x1="142" y1="102" x2="125" y2="100" stroke="#374151" stroke-width="1"/>

  <!-- 湯（水） -->
  <rect x="42" y="128" width="116" height="85" rx="0" fill="#bfdbfe" opacity="0.6"/>
  <rect x="42" y="128" width="116" height="2" fill="#3b82f6" opacity="0.5"/>

  <!-- 湯ラベル -->
  <text x="145" y="175" font-size="12" fill="#1d4ed8">湯</text>
  <line x1="142" y1="172" x2="120" y2="168" stroke="#374151" stroke-width="1"/>

  <!-- 底の丸み -->
  <rect x="40" y="205" width="120" height="10" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
</svg>
