<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ANRINO 問題アプリ ✨</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: linear-gradient(160deg, #fdf2f8 0%, #ede9fe 55%, #ecfdf5 100%);
  min-height: 100vh;
  color: #3d2b5e;
}

/* ===== 塾選択画面 ===== */
#school-select {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 20px 40px;
  min-height: 100vh;
}
.school-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 100%;
  max-width: 380px;
}
.school-card {
  background: rgba(255,255,255,0.88);
  border: 2px solid rgba(244,114,182,0.25);
  border-radius: 24px;
  padding: 32px 16px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 6px 24px rgba(167,139,250,0.15);
  user-select: none;
}
.school-card:active { transform: scale(0.96); }
.school-card.coming-soon {
  opacity: 0.55;
  cursor: default;
  background: rgba(255,255,255,0.5);
}
.school-card.coming-soon:active { transform: none; }
.school-emoji { font-size: 44px; margin-bottom: 10px; }
.school-label {
  font-size: 22px;
  font-weight: 800;
  color: #3d2b5e;
  margin-bottom: 4px;
}
.school-desc {
  font-size: 12px;
  color: #a78bfa;
  margin-top: 4px;
}

/* ===== 月選択画面 ===== */
#month-select {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 20px 40px;
  min-height: 100vh;
}
.fairy-title {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(135deg, #f472b6, #a78bfa, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
  text-align: center;
}
.fairy-subtitle {
  font-size: 14px;
  color: #a78bfa;
  margin-bottom: 36px;
  text-align: center;
}
.month-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 100%;
  max-width: 380px;
}
.month-card {
  background: rgba(255,255,255,0.88);
  border: 2px solid rgba(244,114,182,0.25);
  border-radius: 24px;
  padding: 28px 16px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 6px 24px rgba(167,139,250,0.15);
  user-select: none;
}
.month-card:active { transform: scale(0.96); }
.month-card.coming-soon {
  opacity: 0.55;
  cursor: default;
  background: rgba(255,255,255,0.5);
}
.month-card.coming-soon:active { transform: none; }
.month-emoji { font-size: 40px; margin-bottom: 8px; }
.month-label {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}
.month-desc {
  font-size: 12px;
  color: #a78bfa;
  margin-top: 4px;
}
.coming-badge {
  display: inline-block;
  background: #e9d5ff;
  color: #7c3aed;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  margin-top: 6px;
}

/* ===== テストカウントダウン ===== */
.test-countdown {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 380px;
  margin-bottom: 20px;
}
.test-card {
  flex: 1;
  background: rgba(255,255,255,0.92);
  border: 2px solid rgba(244,114,182,0.3);
  border-radius: 20px;
  padding: 14px 10px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(167,139,250,0.15);
  position: relative;
}
.test-card-name {
  font-size: 11px;
  font-weight: 700;
  color: #7c3aed;
  margin-bottom: 6px;
  line-height: 1.3;
}
.test-card-days {
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, #f472b6, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.test-card-days-label { font-size: 12px; color: #a78bfa; font-weight: 600; margin-top: 2px; }
.test-card-date { font-size: 11px; color: #9ca3af; margin-top: 4px; }
.test-card-past { font-size: 13px; font-weight: 700; color: #34d399; margin-top: 4px; }
.test-edit-btn {
  position: absolute;
  top: 6px; right: 8px;
  background: none;
  border: none;
  font-size: 14px;
  cursor: pointer;
  opacity: 0.5;
}
.test-edit-btn:active { opacity: 1; }
.test-unset { font-size: 12px; color: #d1d5db; margin: 8px 0; }

/* 日付設定モーダル */
.date-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.date-modal-overlay.open { display: flex; }
.date-modal {
  background: #fff;
  border-radius: 24px;
  padding: 28px 24px;
  width: 300px;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
}
.date-modal-title { font-size: 16px; font-weight: 800; color: #7c3aed; margin-bottom: 16px; }
.date-modal input[type=date] {
  width: 100%;
  padding: 12px;
  border: 2px solid #a78bfa;
  border-radius: 12px;
  font-size: 16px;
  text-align: center;
  outline: none;
  margin-bottom: 16px;
  box-sizing: border-box;
}
.date-modal-save {
  background: linear-gradient(135deg, #f472b6, #a78bfa);
  color: #fff;
  border: none;
  border-radius: 16px;
  padding: 12px 32px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  width: 100%;
  margin-bottom: 8px;
}
.date-modal-cancel {
  background: none;
  border: none;
  color: #9ca3af;
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
}

/* ===== ホーム画面 ===== */
#home {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 36px 20px 40px;
  min-height: 100vh;
}
.home-header {
  display: flex;
  align-items: center;
  width: 100%;
  max-width: 400px;
  margin-bottom: 24px;
  gap: 12px;
}
.back-to-month {
  background: rgba(255,255,255,0.8);
  border: 1.5px solid rgba(167,139,250,0.4);
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 13px;
  color: #7c3aed;
  cursor: pointer;
  font-weight: 600;
  user-select: none;
}
.back-to-month:active { opacity: 0.7; }
.home-title-wrap { flex: 1; }
.home-month-title {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, #f472b6, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.home-month-sub {
  font-size: 12px;
  color: #a78bfa;
}

.subject-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  margin-bottom: 14px;
}
.subject-card {
  background: rgba(255,255,255,0.88);
  border: 1.5px solid rgba(167,139,250,0.2);
  border-radius: 20px;
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(167,139,250,0.12);
  user-select: none;
}
.subject-card:active { transform: scale(0.96); }
.subject-card .icon { font-size: 28px; margin-bottom: 6px; }
.subject-card .label { font-size: 14px; font-weight: 700; color: #3d2b5e; }
.subject-card .count { font-size: 11px; color: #a78bfa; margin-top: 3px; }
.all-card {
  background: linear-gradient(135deg, #f472b6, #a78bfa);
  color: white;
  width: 100%;
  max-width: 400px;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
  border: none;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 6px 20px rgba(244,114,182,0.35);
  user-select: none;
  margin-bottom: 12px;
}
.all-card:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(244,114,182,0.2); }
.review-card {
  background: rgba(255,255,255,0.88);
  border: 2px solid #fbbf24;
  color: #92400e;
  width: 100%;
  max-width: 400px;
  border-radius: 20px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  transition: transform 0.15s;
  user-select: none;
}
.review-card:active { transform: scale(0.97); }

.mastered-card {
  background: linear-gradient(135deg, #fef9c3, #fde68a);
  border: 2px solid #f59e0b;
  color: #78350f;
  width: 100%;
  max-width: 400px;
  border-radius: 20px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  transition: transform 0.15s;
  user-select: none;
  margin-top: 8px;
}
.mastered-card:active { transform: scale(0.97); }
.mastered-card:disabled { opacity: 0.5; cursor: default; }

.super-wrong-card {
  background: linear-gradient(135deg, #fee2e2, #fecaca);
  border: 2px solid #f87171;
  color: #7f1d1d;
  width: 100%;
  max-width: 400px;
  border-radius: 20px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  transition: transform 0.15s;
  user-select: none;
  margin-top: 8px;
}
.super-wrong-card:active { transform: scale(0.97); }
.super-wrong-card:disabled { opacity: 0.5; cursor: default; }

.stats-bar {
  width: 100%;
  max-width: 400px;
  margin-top: 24px;
}
.stats-title { font-size: 13px; font-weight: 700; color: #a78bfa; margin-bottom: 10px; letter-spacing: 0.5px; }
.stats-row {
  background: rgba(255,255,255,0.8);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(167,139,250,0.08);
}
.stats-row-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 13px;
}
.stats-row-name { font-weight: 700; color: #3d2b5e; }
.stats-row-pct { color: #a78bfa; font-weight: 600; }
.stats-row-perfect { display: flex; align-items: center; gap: 6px; }
.ok-stamp {
  width: 52px;
  height: 52px;
  object-fit: contain;
  animation: okPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes okPop {
  0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg);  opacity: 1; }
}
.progress-bg {
  height: 6px;
  background: #e9d5ff;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #f472b6, #a78bfa);
  transition: width 0.4s ease;
}

/* ===== 問題画面 ===== */
#quiz { display: none; min-height: 100vh; }
.quiz-header {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  padding: 14px 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(167,139,250,0.2);
  position: sticky;
  top: 0;
  z-index: 10;
}
.back-btn {
  background: none;
  border: none;
  font-size: 26px;
  cursor: pointer;
  padding: 0 4px;
  color: #a78bfa;
  line-height: 1;
  user-select: none;
}
.quiz-meta { flex: 1; }
.quiz-subject-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 2px;
}
.quiz-progress-text { font-size: 12px; color: #a78bfa; }
.quiz-progress-bar {
  height: 4px;
  background: #e9d5ff;
  position: sticky;
  top: 57px;
  z-index: 10;
}
.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #f472b6, #a78bfa);
  transition: width 0.3s ease;
}
.quiz-body {
  padding: 20px 16px 40px;
  max-width: 600px;
  margin: 0 auto;
}
.question-card {
  background: rgba(255,255,255,0.9);
  border-radius: 20px;
  padding: 22px 20px;
  margin-bottom: 14px;
  box-shadow: 0 4px 16px rgba(167,139,250,0.12);
  font-size: 16px;
  line-height: 1.7;
  font-weight: 600;
  color: #3d2b5e;
  border: 1.5px solid rgba(167,139,250,0.15);
}
.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}
.option-btn {
  background: rgba(255,255,255,0.88);
  border: 2px solid rgba(167,139,250,0.25);
  border-radius: 16px;
  padding: 15px 16px;
  font-size: 15px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  line-height: 1.5;
  width: 100%;
  user-select: none;
  color: #3d2b5e;
}
.option-btn:active:not(:disabled) { background: #f3e8ff; border-color: #a78bfa; }
.option-btn.correct {
  background: linear-gradient(135deg, #d1fae5, #a7f3d0);
  border-color: #34d399;
  color: #065f46;
}
.option-btn.wrong {
  background: linear-gradient(135deg, #fce7f3, #fbcfe8);
  border-color: #f472b6;
  color: #9d174d;
}
.option-btn.show-correct {
  background: linear-gradient(135deg, #d1fae5, #a7f3d0);
  border-color: #34d399;
  color: #065f46;
}
.option-btn:disabled { cursor: default; }

.feedback-card {
  border-radius: 18px;
  padding: 16px 18px;
  margin-bottom: 14px;
  display: none;
}
.feedback-card.correct-fb {
  background: linear-gradient(135deg, #d1fae5, #ecfdf5);
  border: 2px solid #34d399;
  display: block;
}
.feedback-card.wrong-fb {
  background: linear-gradient(135deg, #fce7f3, #fdf2f8);
  border: 2px solid #f472b6;
  display: block;
}
.feedback-icon { font-size: 22px; margin-bottom: 4px; }
.feedback-label { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
.feedback-answer { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #3d2b5e; }
.feedback-explanation {
  font-size: 13px;
  color: #4b3a6e;
  line-height: 1.6;
  background: rgba(255,255,255,0.6);
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 8px;
}
.next-btn {
  background: linear-gradient(135deg, #f472b6, #a78bfa);
  color: white;
  border: none;
  border-radius: 16px;
  padding: 17px;
  font-size: 16px;
  font-weight: 800;
  width: 100%;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  box-shadow: 0 4px 16px rgba(167,139,250,0.35);
  user-select: none;
}
.next-btn:active { opacity: 0.85; transform: scale(0.98); }
.prev-btn {
  background: rgba(255,255,255,0.9);
  color: #a78bfa;
  border: 2px solid #a78bfa;
  border-radius: 16px;
  padding: 17px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.prev-btn:active { opacity: 0.7; }

/* ===== AI解説ボタン ===== */
.ai-btn {
  display: none;
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  background: linear-gradient(135deg, #34d399, #60a5fa);
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(96,165,250,0.3);
  transition: opacity 0.15s, transform 0.1s;
}
.ai-btn:active { opacity: 0.85; transform: scale(0.98); }
.ai-btn:disabled { opacity: 0.6; cursor: default; }

.memo-area {
  display: none;
  background: rgba(255,255,255,0.9);
  border: 2px dashed #a78bfa;
  border-radius: 14px;
  padding: 12px;
  margin-top: 10px;
}
.memo-label {
  font-size: 12px;
  font-weight: 700;
  color: #7c3aed;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.memo-textarea {
  width: 100%;
  min-height: 72px;
  border: 1.5px solid #e9d5ff;
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  box-sizing: border-box;
  color: #3d2b5e;
  background: #faf5ff;
}
.memo-textarea:focus { border-color: #a78bfa; }
.memo-saved {
  font-size: 11px;
  color: #a78bfa;
  margin-top: 4px;
  text-align: right;
  min-height: 16px;
}
.memo-badge {
  background: #f3e8ff;
  border-left: 3px solid #a78bfa;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  color: #5b21b6;
  margin-top: 8px;
  white-space: pre-wrap;
}

/* ===== AI解説モーダル ===== */
.ai-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(61,43,94,0.5);
  z-index: 100;
  justify-content: center;
  align-items: flex-end;
  padding: 16px;
}
.ai-modal-overlay.open { display: flex; }
.ai-modal {
  background: #fff;
  border-radius: 24px 24px 20px 20px;
  padding: 24px 20px 32px;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 -4px 40px rgba(167,139,250,0.25);
}
.ai-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.ai-modal-title {
  font-size: 17px;
  font-weight: 800;
  color: #3d2b5e;
}
.ai-modal-close {
  background: #f3e8ff;
  border: none;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 18px;
  cursor: pointer;
  color: #7c3aed;
  font-weight: 700;
}
.ai-modal-body {
  font-size: 15px;
  line-height: 1.8;
  color: #3d2b5e;
  white-space: pre-wrap;
}
.ai-loading {
  text-align: center;
  font-size: 15px;
  color: #a78bfa;
  padding: 20px 0;
}
.ai-key-setup {
  background: #f0fdf4;
  border: 1.5px solid #86efac;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.ai-key-setup p { font-size: 13px; color: #166534; margin-bottom: 10px; line-height: 1.6; }
.ai-key-input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid #86efac;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 8px;
  box-sizing: border-box;
}
.ai-key-save {
  background: #22c55e;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
}

/* ===== 結果画面 ===== */
#result { display: none; padding: 30px 20px 60px; max-width: 500px; margin: 0 auto; }
.result-title {
  font-size: 24px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 4px;
  background: linear-gradient(135deg, #f472b6, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.result-subtitle { font-size: 14px; color: #a78bfa; text-align: center; margin-bottom: 24px; }
.score-circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(243,232,255,0.8));
  border: 3px solid rgba(244,114,182,0.3);
  margin: 0 auto 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px rgba(167,139,250,0.2);
}
.score-pct { font-size: 38px; font-weight: 900; }
.score-label { font-size: 13px; color: #a78bfa; font-weight: 600; }
.result-chart-wrap {
  background: rgba(255,255,255,0.85);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 16px;

let state = {
  selectedSchool: null,
  selectedMonth: null,
  mode: null,
  currentSubject: null,
  queue: [],
  current: 0,
  correct: 0,
  sessionWrong: [],
  answered: false,
  history: [],
};

function statsKey() { return 'ena_stats_' + state.selectedMonth; }
function memoKey()  { return 'ena_memos_' + state.selectedMonth; }
function wrongKey()       { return 'ena_wrong_'         + state.selectedMonth; }
function correctCountKey(){ return 'ena_correct_count_' + state.selectedMonth; }
function masteredKey()    { return 'ena_mastered_'      + state.selectedMonth; }
function wrongCountKey()  { return 'ena_wrong_count_'   + state.selectedMonth; }
function superWrongKey()  { return 'ena_super_wrong_'   + state.selectedMonth; }

function loadStats()   { try { return JSON.parse(localStorage.getItem(statsKey())  || '{}'); } catch(e) { return {}; } }
function saveStats(s)  { localStorage.setItem(statsKey(),  JSON.stringify(s)); }
function loadMemos()  { try { return JSON.parse(localStorage.getItem(memoKey()) || '{}'); } catch(e) { return {}; } }
function saveMemo(id, text) { const m = loadMemos(); if (text.trim()) m[id] = text; else delete m[id]; localStorage.setItem(memoKey(), JSON.stringify(m)); }
function loadWrongSet(){ try { return new Set(JSON.parse(localStorage.getItem(wrongKey()) || '[]')); } catch(e) { return new Set(); } }
function saveWrongSet(s){ localStorage.setItem(wrongKey(), JSON.stringify([...s])); }
function loadCorrectCounts(){ try { return JSON.parse(localStorage.getItem(correctCountKey()) || '{}'); } catch(e) { return {}; } }
function saveCorrectCounts(c){ localStorage.setItem(correctCountKey(), JSON.stringify(c)); }
function loadMasteredSet(){ try { return new Set(JSON.parse(localStorage.getItem(masteredKey()) || '[]')); } catch(e) { return new Set(); } }
function saveMasteredSet(s){ localStorage.setItem(masteredKey(), JSON.stringify([...s])); }
function loadWrongCounts(){ try { return JSON.parse(localStorage.getItem(wrongCountKey()) || '{}'); } catch(e) { return {}; } }
function saveWrongCounts(c){ localStorage.setItem(wrongCountKey(), JSON.stringify(c)); }
function loadSuperWrongSet(){ try { return new Set(JSON.parse(localStorage.getItem(superWrongKey()) || '[]')); } catch(e) { return new Set(); } }
function saveSuperWrongSet(s){ localStorage.setItem(superWrongKey(), JSON.stringify([...s])); }

function initTendency() {
  const stats = loadStats();
  const wrongSet = loadWrongSet();
  const qs = monthQuestions();

  // 全体集計
  let totalCorrect = 0, totalDone = 0;
  Object.values(stats).forEach(s => { totalCorrect += s.correct; totalDone += s.total; });

  // 苦手バッジ
  document.getElementById('tend-wrong-badge').textContent = wrongSet.size > 0
    ? `⚠️ 苦手問題が ${wrongSet.size}問 あるよ。復習してみよう！`
    : `✅ 苦手問題はゼロ！すごいね！`;

  if (totalDone === 0) {
    document.getElementById('tend-big-pct').textContent = '--';
    document.getElementById('tend-overall-label').textContent = 'まだ問題を解いていないよ！問題を解くと傾向が見えるよ✨';
    document.getElementById('tend-advice').textContent = '';
    document.getElementById('tend-cat-bars').innerHTML = '<div class="tend-no-data">データなし</div>';
    document.getElementById('tend-weak').innerHTML = '<div class="tend-no-data">データなし</div>';
    document.getElementById('tend-strong').innerHTML = '<div class="tend-no-data">データなし</div>';
    return;
  }

  const overallPct = Math.round(totalCorrect / totalDone * 100);
  document.getElementById('tend-big-pct').textContent = overallPct + '%';
  document.getElementById('tend-overall-label').textContent = `${totalDone}問やって ${totalCorrect}問正解！`;

  // 教科別グラフ
  const catBars = document.getElementById('tend-cat-bars');
  catBars.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([catKey, cat]) => {
    const keys = Object.entries(SUBJECTS).filter(([,v]) => v.category === catKey).map(([k]) => k);
    let c = 0, t = 0;
    keys.forEach(k => { const s = stats[k] || {correct:0,total:0}; c += s.correct; t += s.total; });
    if (t === 0) return;
    const pct = Math.round(c / t * 100);
    const color = pct >= 80 ? '#10b981' : pct >= 60 ? '#f59e0b' : '#ef4444';
    const row = document.createElement('div');
    row.className = 'tend-bar-row';
    row.innerHTML = `
      <div class="tend-bar-top">
        <span class="tend-bar-name">${cat.icon} ${cat.label}</span>
        <span class="tend-bar-pct" style="color:${color}">${pct}%</span>
      </div>
      <div class="tend-bar-bg">
        <div class="tend-bar-fill" style="width:0%;background:${color}" data-pct="${pct}"></div>
      </div>`;
    catBars.appendChild(row);
  });
  // バーアニメーション
  requestAnimationFrame(() => {
    catBars.querySelectorAll('.tend-bar-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  });

  // トピック別（データあるもの）
  const topicStats = Object.entries(SUBJECTS).map(([k, sub]) => {
    const s = stats[k] || {correct:0, total:0};
    const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : null;
    return { key:k, label:sub.label, icon:sub.icon, pct, total:s.total };
  }).filter(t => t.total > 0).sort((a, b) => a.pct - b.pct);

  const makeRow = (t, color) => {
    const row = document.createElement('div');
    row.className = 'tend-topic-row';
    row.innerHTML = `<span>${t.icon} ${t.label}</span><span class="tend-topic-pct" style="color:${color}">${t.pct}%</span>`;
    return row;
  };

  // 苦手（正答率低い順）
  const weakEl = document.getElementById('tend-weak');
  weakEl.innerHTML = '';
  const weak = topicStats.slice(0, 3);
  if (weak.length === 0) weakEl.innerHTML = '<div class="tend-no-data">データなし</div>';
  else weak.forEach(t => weakEl.appendChild(makeRow(t, '#ef4444')));

  // 得意（正答率高い順）
  const strongEl = document.getElementById('tend-strong');
  strongEl.innerHTML = '';
  const strong = [...topicStats].reverse().slice(0, 3);
  if (strong.length === 0) strongEl.innerHTML = '<div class="tend-no-data">データなし</div>';
  else strong.forEach(t => strongEl.appendChild(makeRow(t, '#10b981')));

  // アドバイス
  const worst = topicStats[0];
  const advice = document.getElementById('tend-advice');
  if (worst && worst.pct < 60) {
    advice.innerHTML = `💡 <strong>${worst.icon} ${worst.label}</strong>が少し難しそう。<br>「苦手問題を復習」でもう一度チャレンジしてみよう！`;
  } else if (overallPct >= 85) {
    advice.innerHTML = `🏆 <strong>すごい！</strong>全体的にバッチリできてるよ。<br>この調子でどんどん問題を解いていこう！`;
  } else if (overallPct >= 70) {
    advice.innerHTML = `🌟 <strong>いい感じ！</strong>もう少しで満点に近づけるよ。<br>間違えた問題をもう一度やってみよう✨`;
  } else {
    advice.innerHTML = `💪 <strong>毎日少しずつ</strong>やっていけば絶対できるようになるよ！<br>焦らずがんばろう✨`;
  }
}

function initHome() {
  const m = MONTHS[state.selectedMonth];
  document.getElementById('home-month-title').textContent = m.emoji + ' ' + m.fullLabel;
  document.getElementById('home-month-sub').textContent = m.desc;

  const stats = loadStats();
  const wrongSet = loadWrongSet();
  const qs = monthQuestions();

  // カテゴリ→トピック の2階層グリッド
  const grid = document.getElementById('subject-grid');
  grid.innerHTML = '';
  grid.style.display = 'block';

  Object.entries(CATEGORIES).forEach(([catKey, cat]) => {
    const catTopics = Object.entries(SUBJECTS).filter(([, v]) => v.category === catKey);
    const catTotal = qs.filter(q => catTopics.some(([k]) => k === q.subject)).length;
    if (catTotal === 0) return;

    const section = document.createElement('div');
    section.className = 'category-section';

    // ヘッダー（科目名 + 全部ボタン）
    const header = document.createElement('div');
    header.className = 'category-header';
    header.style.color = cat.color;
    header.innerHTML = `
      <span style="color:${cat.color}">${cat.icon} ${cat.label}</span>
      <button class="category-all-btn" onclick="startQuizCategory('${catKey}')">全部やる ▶</button>`;
    section.appendChild(header);

    // トピックボタン群
    const topicGrid = document.createElement('div');
    topicGrid.className = 'category-topics';
    catTopics.forEach(([topicKey, topic]) => {
      const total = qs.filter(q => q.subject === topicKey).length;
      if (total === 0) return;
      const s = stats[topicKey] || { correct:0, total:0 };
      const pctText = s.total > 0 ? Math.round(s.correct/s.total*100) + '%' : `${total}問`;
      const btn = document.createElement('button');
      btn.className = 'topic-btn';
      btn.innerHTML = `
        <div class="topic-icon">${topic.icon}</div>
        <div class="topic-label">${topic.label}</div>
        <div class="topic-count">${pctText}</div>`;
      btn.onclick = () => startQuiz(topicKey);
      topicGrid.appendChild(btn);
    });
    section.appendChild(topicGrid);
    grid.appendChild(section);
  });

  // 苦手問題ボタン
  const reviewBtn = document.getElementById('review-btn');
  reviewBtn.textContent = `⚠️ 苦手問題を復習 (${wrongSet.size}問)`;
  reviewBtn.style.opacity = wrongSet.size > 0 ? '1' : '0.5';

  const mastered = loadMasteredSet();
  const masteredBtn = document.getElementById('mastered-btn');
  masteredBtn.textContent = `⭐ もう完璧 ${mastered.size}問`;
  masteredBtn.disabled = mastered.size === 0;

  const superWrong = loadSuperWrongSet();
  const superWrongBtn = document.getElementById('super-wrong-btn');
  superWrongBtn.textContent = `🔥 超苦手 ${superWrong.size}問`;
  superWrongBtn.disabled = superWrong.size === 0;

  // 正答率グラフ（カテゴリ単位で集計）
  const container = document.getElementById('stats-container');
  container.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([catKey, cat]) => {
    const catTopics = Object.entries(SUBJECTS).filter(([, v]) => v.category === catKey);
    let correct = 0, total = 0;
    catTopics.forEach(([topicKey]) => {
      const s = stats[topicKey] || { correct:0, total:0 };
      correct += s.correct; total += s.total;
    });
    if (total === 0) return;
    const pct = Math.round(correct / total * 100);
    const div = document.createElement('div');
    div.className = 'stats-row';
    const pctHtml = pct === 100
      ? `<span class="stats-row-perfect"><span class="stats-row-pct" style="color:#f472b6;font-weight:800;">100%</span><img class="ok-stamp" src="ok.png" alt="OK"></span>`
      : `<span class="stats-row-pct">${pct}%</span>`;
    div.innerHTML = `
      <div class="stats-row-top">
        <span class="stats-row-name">${cat.icon} ${cat.label}</span>
        ${pctHtml}
      </div>
      <div class="progress-bg">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>`;
    container.appendChild(div);
  });
}

function startQuiz(subject) {
  const qs = monthQuestions();
  const mastered = loadMasteredSet();
  state.mode = subject === 'all' ? 'all' : 'subject';
  state.currentSubject = subject;
  const base = subject === 'all' ? [...qs] : qs.filter(q => q.subject === subject);
  state.queue = shuffle(base.filter(q => !mastered.has(q.id)));
  if (state.queue.length === 0) { alert('この分野の問題はすべて完璧だよ！⭐'); return; }
  state.current = 0;
  state.correct = 0;
  state.sessionWrong = [];
  state.history = [];
  showQuiz();
}

function startQuizCategory(catKey) {
  const qs = monthQuestions();
  const mastered = loadMasteredSet();
  const topicKeys = Object.entries(SUBJECTS).filter(([,v]) => v.category === catKey).map(([k]) => k);
  state.mode = 'subject';
  state.currentSubject = catKey;
  state.queue = shuffle(qs.filter(q => topicKeys.includes(q.subject) && !mastered.has(q.id)));
  if (state.queue.length === 0) { alert('この教科の問題はすべて完璧だよ！⭐'); return; }
  state.current = 0;
  state.correct = 0;
  state.sessionWrong = [];
  state.history = [];
  showQuiz();
}

function startSuperWrongQuiz() {
  const superWrong = loadSuperWrongSet();
  if (superWrong.size === 0) { alert('超苦手な問題はまだないよ！'); return; }
  const qs = monthQuestions();
  state.mode = 'review';
  state.currentSubject = 'super_wrong';
  state.queue = shuffle(qs.filter(q => superWrong.has(q.id)));
  state.current = 0;
  state.correct = 0;
  state.sessionWrong = [];
  state.history = [];
  showQuiz();
}

function startMasteredQuiz() {
  const mastered = loadMasteredSet();
  if (mastered.size === 0) { alert('まだ完璧な問題がないよ。3回正解するともう完璧になるよ！'); return; }
  const qs = monthQuestions();
  state.mode = 'review';
  state.currentSubject = 'mastered';
  state.queue = shuffle(qs.filter(q => mastered.has(q.id)));
  state.current = 0;
  state.correct = 0;
  state.sessionWrong = [];
  state.history = [];
  showQuiz();
}

function startReview() {
  const wrongSet = loadWrongSet();
  if (wrongSet.size === 0) { alert('苦手問題がまだありません。'); return; }
  const qs = monthQuestions();
  state.mode = 'review';
  state.currentSubject = null;
  state.queue = shuffle(qs.filter(q => wrongSet.has(q.id)));
  state.current = 0;
  state.correct = 0;
  state.sessionWrong = [];
  state.history = [];
  showQuiz();
}

function showQuiz() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  const tend = document.getElementById('tendency');
  if (tend) tend.style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = state.queue[state.current];
  const hist = state.history[state.current];
  state.answered = !!hist;

  const sub = SUBJECTS[q.subject];
  const tag = document.getElementById('subject-tag');
  tag.textContent = sub.label;
  tag.className = 'quiz-subject-tag ' + sub.tag;

  document.getElementById('progress-text').textContent = `${state.current + 1} / ${state.queue.length}`;
  document.getElementById('progress-fill').style.width = ((state.current / state.queue.length) * 100) + '%';
  document.getElementById('question-text').textContent = q.q;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    if (hist) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      else if (i === hist.chosen && !hist.isCorrect) btn.classList.add('wrong');
    } else {
      btn.onclick = () => selectAnswer(i);
    }
    list.appendChild(btn);
  });

  const fb  = document.getElementById('feedback-card');
  const exp = document.getElementById('feedback-explanation');
  if (hist) {
    document.getElementById('feedback-icon').textContent = hist.isCorrect ? '✨' : '💦';
    document.getElementById('feedback-label').textContent = hist.isCorrect ? '正解！すごい！' : 'おしい…！';
    document.getElementById('feedback-answer').textContent = '正解：' + q.options[q.answer];
    fb.className = 'feedback-card ' + (hist.isCorrect ? 'correct-fb' : 'wrong-fb');
    if (q.explanation) { exp.textContent = q.explanation; exp.style.display = 'block'; }
    else exp.style.display = 'none';
    document.getElementById('ai-btn').style.display = 'block';
    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'block';
    nextBtn.textContent = state.current === state.queue.length - 1 ? '結果を見る 📊' : '次の問題へ →';
    showMemoArea(q.id);
  } else {
    fb.className = 'feedback-card';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('ai-btn').style.display = 'none';
    document.getElementById('memo-area').style.display = 'none';
    document.getElementById('memo-textarea').value = '';
    document.getElementById('memo-saved').textContent = '';
  }

  document.getElementById('prev-btn').style.display = state.current > 0 ? 'block' : 'none';
}

function showMemoArea(qid) {
  const memos = loadMemos();
  const area = document.getElementById('memo-area');
  const ta = document.getElementById('memo-textarea');
  const saved = document.getElementById('memo-saved');
  area.style.display = 'block';
  ta.value = memos[qid] || '';
  saved.textContent = memos[qid] ? '✅ 保存済み' : '';
  ta.oninput = () => {
    saveMemo(qid, ta.value);
    saved.textContent = ta.value.trim() ? '✅ 保存したよ！' : '';
  };
}

function selectAnswer(chosen) {
  if (state.answered) return;
  state.answered = true;

  const q = state.queue[state.current];
  const isCorrect = chosen === q.answer;
  playSound(isCorrect);
  const btns = document.querySelectorAll('.option-btn');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === chosen && !isCorrect) btn.classList.add('wrong');
  });

  const fb  = document.getElementById('feedback-card');
  const exp = document.getElementById('feedback-explanation');

  document.getElementById('feedback-icon').textContent = isCorrect ? '✨' : '💦';
  document.getElementById('feedback-label').textContent = isCorrect ? '正解！すごい！' : 'おしい…！';
  document.getElementById('feedback-answer').textContent = '正解：' + q.options[q.answer];
  fb.className = 'feedback-card ' + (isCorrect ? 'correct-fb' : 'wrong-fb');

  if (q.explanation) {
    exp.textContent = q.explanation;
    exp.style.display = 'block';
  } else {
    exp.style.display = 'none';
  }

  if (isCorrect) {
    state.correct++;
    const wrongSet = loadWrongSet();
    wrongSet.delete(q.id);
    saveWrongSet(wrongSet);

    const counts = loadCorrectCounts();
    counts[q.id] = (counts[q.id] || 0) + 1;
    saveCorrectCounts(counts);
    if (counts[q.id] >= 3) {
      const mastered = loadMasteredSet();
      mastered.add(q.id);
      saveMasteredSet(mastered);
      document.getElementById('feedback-label').textContent = '⭐ もう完璧！3回正解！';
    }
  } else {
    state.sessionWrong.push(q.id);
    const wrongSet = loadWrongSet();
    wrongSet.add(q.id);
    saveWrongSet(wrongSet);

    const wCounts = loadWrongCounts();
    wCounts[q.id] = (wCounts[q.id] || 0) + 1;
    saveWrongCounts(wCounts);
    if (wCounts[q.id] >= 3) {
      const superWrong = loadSuperWrongSet();
      superWrong.add(q.id);
      saveSuperWrongSet(superWrong);
      document.getElementById('feedback-label').textContent = '🔥 超苦手！3回間違えちゃった…';
    }
  }

  document.getElementById('ai-btn').style.display = 'block';
  showMemoArea(q.id);

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = state.current === state.queue.length - 1 ? '結果を見る 📊' : '次の問題へ →';

  state.history[state.current] = { chosen, isCorrect };
  updateStats(q.subject, isCorrect);
}

function nextQuestion() {
  state.current++;
  if (state.current >= state.queue.length) showResult();
  else { renderQuestion(); window.scrollTo(0, 0); }
}

function prevQuestion() {
  if (state.current <= 0) return;
  state.current--;
  renderQuestion();
  window.scrollTo(0, 0);
}

function updateStats(subject, isCorrect) {
  const stats = loadStats();
  if (!stats[subject]) stats[subject] = { correct:0, total:0 };
  stats[subject].total++;
  if (isCorrect) stats[subject].correct++;
  saveStats(stats);
}

// ============================================================
// 結果画面
// ============================================================
function showResult() {
  document.getElementById('quiz').style.display = 'none';
  const tend = document.getElementById('tendency');
  if (tend) tend.style.display = 'none';
  document.getElementById('result').style.display = 'block';

  const total = state.queue.length;
  const pct   = Math.round(state.correct / total * 100);

  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : pct >= 50 ? '💪' : '📖';
  document.getElementById('result-title').textContent = emoji + ' 結果発表！';
  const mode = state.mode === 'review' ? '苦手問題復習'
             : state.mode === 'all' ? '全問題'
             : (CATEGORIES[state.currentSubject] || SUBJECTS[state.currentSubject])?.label || state.currentSubject;
  document.getElementById('result-subtitle').textContent = mode + '  ' + total + '問中 ' + state.correct + '問正解';

  const pctEl = document.getElementById('score-pct');
  pctEl.textContent = pct + '%';
  pctEl.style.color = pct >= 80 ? '#059669' : pct >= 60 ? '#d97706' : '#e11d48';

  const stats = loadStats();
  const chart = document.getElementById('result-chart');
  chart.innerHTML = '';
  Object.entries(SUBJECTS).forEach(([key, sub]) => {
    const s = stats[key] || { correct:0, total:0 };
    if (s.total === 0) return;
    const p = Math.round(s.correct / s.total * 100);
    const row = document.createElement('div');
    row.className = 'chart-bar-row';
    row.innerHTML = `
      <div class="chart-bar-label">${sub.label}</div>
      <div class="chart-bar-bg"><div class="chart-bar-fill" style="width:${p}%"></div></div>
      <div class="chart-bar-pct">${p}%</div>`;
    chart.appendChild(row);
  });

  const reviewBtn = document.getElementById('retry-wrong-btn');
  reviewBtn.style.display = state.sessionWrong.length > 0 ? 'block' : 'none';
  reviewBtn.textContent = `⚠️ 間違えた ${state.sessionWrong.length}問 を復習`;
}

function retryQuiz() {
  if (state.mode === 'review') startReview();
  else startQuiz(state.mode === 'all' ? 'all' : state.currentSubject);
}

function retryWrong() {
  const wrongIds = new Set(state.sessionWrong);
  state.mode = 'review';
  state.queue = shuffle(monthQuestions().filter(q => wrongIds.has(q.id)));
  state.current = 0;
  state.correct = 0;
  state.sessionWrong = [];
  state.history = [];
  showQuiz();
}

function goHome() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  showHome();
}

let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function playSound(isCorrect) {
  try {
    const ctx = getAudioCtx();
    ctx.resume().then(() => {
      if (isCorrect) {
        [[880, 0, 0.15], [1100, 0.18, 0.15]].forEach(([freq, delay, dur]) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.4, ctx.currentTime + delay);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
          o.start(ctx.currentTime + delay);
          o.stop(ctx.currentTime + delay + dur);
        });
      } else {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(220, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.3);
        g.gain.setValueAtTime(0.25, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        o.start(ctx.currentTime);
        o.stop(ctx.currentTime + 0.3);
      }
    });
  } catch(e) {}
}

// ============================================================
// テストカウントダウン
// ============================================================
const TEST_KEYS = [
  { key: 'gakuryoku', name: '学力判定テスト' },
  { key: '4ka',       name: '4科演習' },
];

function getTestDate(key) { return localStorage.getItem('ena_test_' + key) || ''; }
function setTestDate(key, val) { localStorage.setItem('ena_test_' + key, val); }

function renderCountdown() {
  const wrap = document.getElementById('test-countdown');
  if (state.selectedSchool !== 'ena') { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';

  wrap.innerHTML = TEST_KEYS.map(({ key, name }) => {
    const stored = getTestDate(key);
    let daysHtml = '';
    if (stored) {
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(stored); target.setHours(0,0,0,0);
      const diff = Math.round((target - today) / 86400000);
      if (diff > 0) {
        daysHtml = `<div class="test-card-days">${diff}</div><div class="test-card-days-label">日後</div>`;
      } else if (diff === 0) {
        daysHtml = `<div class="test-card-past">🎯 今日！</div>`;
      } else {
        daysHtml = `<div class="test-card-past">✅ 終了</div>`;
      }
      const d = new Date(stored);
      const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
      daysHtml += `<div class="test-card-date">${dateStr}</div>`;
    } else {
      daysHtml = `<div class="test-unset">日程未設定</div>`;
    }
    return `
      <div class="test-card">
        <button class="test-edit-btn" onclick="openDateModal('${key}','${name}')">✏️</button>
        <div class="test-card-name">${name}</div>
        ${daysHtml}
      </div>`;
  }).join('');
}

let _editingKey = '';
function openDateModal(key, name) {
  _editingKey = key;
  document.getElementById('date-modal-title').textContent = name;
  document.getElementById('date-modal-input').value = getTestDate(key);
  document.getElementById('date-modal-overlay').classList.add('open');
}
function saveTestDate() {
  const val = document.getElementById('date-modal-input').value;
  if (!val) { alert('日付を選んでね！'); return; }
  setTestDate(_editingKey, val);
  closeDateModal();
  renderCountdown();
}
function closeDateModal() {
  document.getElementById('date-modal-overlay').classList.remove('open');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

};
