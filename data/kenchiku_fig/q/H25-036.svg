<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 267" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937"><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2937"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#1f2937" stroke-width="1.2"/></pattern></defs><rect width="480" height="267" fill="#fff"/>
<text x="20" y="28" font-size="13" font-weight="700">光束法：平均照度 E ＝ N × F × U × M ÷ A</text>
<text x="34" y="62" font-size="12">N（ランプ数）</text><text x="200" y="62" font-size="12" font-weight="700">20台 × 2灯 ＝ 40灯</text>
<text x="34" y="84" font-size="12">F（1灯の光束）</text><text x="200" y="84" font-size="12" font-weight="700">3,500 lm</text>
<text x="34" y="106" font-size="12">U（照明率）</text><text x="200" y="106" font-size="12" font-weight="700">0.65</text>
<text x="34" y="128" font-size="12">M（保守率）</text><text x="200" y="128" font-size="12" font-weight="700">0.7</text>
<text x="34" y="150" font-size="12">A（床面積）</text><text x="200" y="150" font-size="12" font-weight="700">100 m²</text>
<text x="34" y="180" font-size="14" font-weight="700" fill="#1d4ed8">E ＝ 40×3,500×0.65×0.7÷100 ＝ 637 lx</text>
<line x1="8" y1="196" x2="472" y2="196" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="215" font-size="12" fill="#374151">・照明率は器具の光が作業面に届く割合、保守率は汚れ・劣化による低下</text>
<rect x="12" y="225" width="456" height="32" rx="6" fill="#fee2e2"/>
<text x="240" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">約 640 lx</text>
</svg>
