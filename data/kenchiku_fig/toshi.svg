<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="556" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">都市計画の理論と住宅地の道路</text>
<text x="20" y="54" font-weight="700">ラドバーン方式（歩車分離）</text>
<rect x="20" y="64" width="210" height="150" fill="#ecfccb" stroke="#65a30d"/>
<path d="M20,190 H230" stroke="#9ca3af" stroke-width="10"/>
<g stroke="#9ca3af" stroke-width="7" fill="none"><path d="M60,190 V110"/><path d="M180,190 V110"/></g>
<g fill="#9ca3af"><circle cx="60" cy="108" r="12"/><circle cx="180" cy="108" r="12"/></g>
<g fill="#fde68a" stroke="#92400e"><rect x="34" y="122" width="14" height="14"/><rect x="72" y="122" width="14" height="14"/><rect x="154" y="122" width="14" height="14"/><rect x="192" y="122" width="14" height="14"/></g>
<path d="M120,74 V160 M30,150 H220" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 3" fill="none"/>
<text x="126" y="88" font-size="11" fill="#15803d">歩行者路（緑地）</text>
<text x="26" y="208" font-size="11" fill="#4b5563">幹線道路</text>
<text x="146" y="208" font-size="11" fill="#4b5563">クルドサック</text>
<text x="250" y="54" font-weight="700">ボンエルフ（歩車共存）</text>
<rect x="250" y="64" width="210" height="150" fill="#f9fafb" stroke="#9ca3af"/>
<path d="M260,140 C300,100 330,180 370,130 S430,110 450,140" stroke="#d1d5db" stroke-width="26" fill="none"/>
<g fill="#16a34a"><circle cx="300" cy="118" r="7"/><circle cx="392" cy="150" r="7"/></g>
<text x="262" y="196" font-size="11" fill="#4b5563">道路を蛇行させ、ハンプや植栽で</text>
<text x="262" y="210" font-size="11" fill="#4b5563">車の速度を抑え、人と車が共存</text>
<line x1="8" y1="228" x2="472" y2="228" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="252"><tspan font-weight="700">ハワード</tspan>：田園都市論（レッチワース）。職住近接の自立した小都市</text>
<text x="20" y="274"><tspan font-weight="700">ペリー</tspan>：近隣住区理論。小学校区を単位に、幹線道路で囲む</text>
<text x="34" y="292" fill="#4b5563">→ 千里ニュータウン（わが国最初の大規模ニュータウン）</text>
<text x="20" y="314" fill="#4b5563">高蔵寺ニュータウン：中心に施設を集めるワンセンター方式</text>
<text x="20" y="336"><tspan font-weight="700">ル・コルビュジエ</tspan>：輝く都市（高層建築と広いオープンスペース）</text>
<text x="20" y="358"><tspan font-weight="700">リンチ</tspan>：都市のイメージ（パス・エッジ・ディストリクト・</text>
<text x="34" y="376">ノード・ランドマーク）</text>
</g>
<line x1="8" y1="392" x2="472" y2="392" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="416" font-weight="700">都市公園の種類（標準面積）</text>
<g font-size="12">
<text x="34" y="440">街区公園</text><text x="200" y="440" font-weight="700">0.25ha</text>
<text x="34" y="462">近隣公園</text><text x="200" y="462" font-weight="700">2ha</text>
<text x="34" y="484">地区公園</text><text x="200" y="484" font-weight="700">4ha</text>
<text x="260" y="440">総合公園</text><text x="380" y="440" font-weight="700">10〜50ha</text>
<text x="260" y="462">運動公園</text><text x="380" y="462" font-weight="700">15〜75ha</text>
<text x="260" y="484">広域公園</text><text x="380" y="484" font-weight="700">50ha以上</text>
</g>
<text x="20" y="510" font-size="11" fill="#4b5563">街区・近隣・地区公園は、徒歩で利用する住区基幹公園</text>
<text x="20" y="530" font-size="11" fill="#4b5563">TOD：公共交通の駅を中心とした開発</text><text x="20" y="546" font-size="11" fill="#4b5563">トランジットモール：歩行者と公共交通だけが通行できる街路</text>
</svg>
