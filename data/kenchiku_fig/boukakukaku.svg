<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="520" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">防火区画の種類（令112条）</text>
<!-- 断面 -->
<rect x="40" y="46" width="230" height="230" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/>
<g stroke="#9ca3af" stroke-width="1"><line x1="40" y1="69" x2="270" y2="69"/><line x1="40" y1="92" x2="270" y2="92"/><line x1="40" y1="138" x2="270" y2="138"/><line x1="40" y1="161" x2="270" y2="161"/><line x1="40" y1="184" x2="270" y2="184"/><line x1="40" y1="207" x2="270" y2="207"/><line x1="40" y1="230" x2="270" y2="230"/><line x1="40" y1="253" x2="270" y2="253"/></g>
<rect x="40" y="46" width="230" height="69" fill="#fee2e2" opacity="0.7"/>
<line x1="40" y1="115" x2="270" y2="115" stroke="#dc2626" stroke-width="3"/>
<g stroke="#dc2626" stroke-width="2"><line x1="120" y1="46" x2="120" y2="115"/><line x1="190" y1="46" x2="190" y2="115"/></g>
<text x="58" y="84" font-size="11" fill="#b91c1c" font-weight="700">11階以上</text>
<rect x="210" y="46" width="30" height="230" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="225" y="296" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">階段</text>
<line x1="130" y1="161" x2="130" y2="276" stroke="#ea580c" stroke-width="3"/>
<text x="62" y="225" font-size="11" fill="#c2410c" font-weight="700">1,500m²</text><text x="62" y="240" font-size="11" fill="#c2410c">以内ごと</text>
<rect x="40" y="253" width="90" height="23" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="85" y="269" text-anchor="middle" font-size="10" fill="#6d28d9">別用途</text>
<g font-size="12">
<rect x="284" y="52" width="12" height="12" fill="#fee2e2" stroke="#dc2626"/><text x="302" y="63" font-weight="700" fill="#b91c1c">高層区画</text>
<text x="302" y="80" font-size="11">11階以上の部分</text>
<rect x="284" y="104" width="12" height="12" fill="#dbeafe" stroke="#2563eb"/><text x="302" y="115" font-weight="700" fill="#2563eb">竪穴区画</text>
<text x="302" y="132" font-size="11">階段・吹抜き・EV昇降路など</text>
<text x="302" y="146" font-size="11">（遮煙性能のある防火設備）</text>
<rect x="284" y="170" width="12" height="12" fill="#ffedd5" stroke="#ea580c"/><text x="302" y="181" font-weight="700" fill="#c2410c">面積区画</text>
<text x="302" y="198" font-size="11">床面積で一定ごとに区画</text>
<rect x="284" y="222" width="12" height="12" fill="#ede9fe" stroke="#7c3aed"/><text x="302" y="233" font-weight="700" fill="#6d28d9">異種用途区画</text>
<text x="302" y="250" font-size="11">特殊建築物の部分とその他を区画</text>
</g>
<line x1="8" y1="312" x2="472" y2="312" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="336" font-size="14" font-weight="700">面積区画の面積（主な数値）</text>
<g font-size="12">
<text x="34" y="358">耐火構造・準耐火構造の建築物</text><text x="450" y="358" text-anchor="end" font-weight="700">1,500m²以内ごと</text>
<text x="34" y="380">法の規定で準耐火とした建築物（1時間準耐火等）</text><text x="450" y="380" text-anchor="end" font-weight="700">1,000m²</text>
<text x="34" y="402">法の規定で準耐火とした建築物（上記以外）</text><text x="450" y="402" text-anchor="end" font-weight="700">500m²</text>
</g>
<text x="20" y="430" font-size="14" font-weight="700">高層区画（11階以上）</text>
<g font-size="12">
<text x="34" y="452">内装が一般の場合（防火設備）</text><text x="450" y="452" text-anchor="end" font-weight="700">100m²以内ごと</text>
<text x="34" y="474">内装を下地とも準不燃（特定防火設備）</text><text x="450" y="474" text-anchor="end" font-weight="700">200m²</text>
<text x="34" y="496">内装を下地とも不燃（特定防火設備）</text><text x="450" y="496" text-anchor="end" font-weight="700">500m²</text>
</g>
<text x="20" y="514" font-size="10" fill="#4b5563">スプリンクラー等の自動式消火設備を設けた部分は、その床面積の1/2を除いて計算</text>
</svg>
