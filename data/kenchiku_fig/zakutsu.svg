<text x="8" y="332" font-size="13" fill="#2563eb" font-weight="700">lk</text>
<text x="240" y="364" text-anchor="middle" font-size="17" font-weight="700">弾性座屈荷重 Pe ＝ π²EI ／ lk²</text>
<text x="240" y="388" text-anchor="middle" font-size="14">lk（座屈長さ）が2倍 → Peは1/4。EIが大きいほどPeは大きい</text>
