<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.5"/></pattern>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f2937"/></marker></defs>
<rect width="480" height="500" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">2項道路（幅員4m未満の道）の後退</text>
<text x="20" y="54" font-weight="700">① 両側に敷地があるとき：中心線から2m</text>
<rect x="20" y="64" width="360" height="42" fill="#fef9c3"/><text x="40" y="90" font-size="12">敷地</text>
<rect x="20" y="106" width="360" height="10" fill="url(#h)"/>
<rect x="20" y="116" width="360" height="60" fill="#d1d5db"/>
<rect x="20" y="176" width="360" height="10" fill="url(#h)"/>
<rect x="20" y="186" width="360" height="30" fill="#fef9c3"/><text x="40" y="206" font-size="12">敷地</text>
<text x="200" y="136" text-anchor="middle" font-size="12">現況の道 幅3m</text>
<line x1="20" y1="146" x2="380" y2="146" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="8 4"/>
<g stroke="#dc2626" stroke-width="2.5"><line x1="20" y1="106" x2="380" y2="106"/><line x1="20" y1="186" x2="380" y2="186"/></g>
<line x1="400" y1="106" x2="400" y2="146" stroke="#1f2937" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<line x1="400" y1="146" x2="400" y2="186" stroke="#1f2937" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="408" y="131" font-weight="700">2m</text><text x="408" y="171" font-weight="700">2m</text>
<text x="438" y="150" font-size="11" fill="#2563eb">中心線</text>
<text x="20" y="250" font-weight="700">② 反対側が川・がけ・線路のとき：川側から4m</text>
<rect x="20" y="260" width="360" height="30" fill="#fef9c3"/><text x="40" y="282" font-size="12">敷地</text>
<rect x="20" y="290" width="360" height="20" fill="url(#h)"/>
<rect x="20" y="310" width="360" height="60" fill="#d1d5db"/>
<text x="200" y="346" text-anchor="middle" font-size="12">現況の道 幅3m</text>
<rect x="20" y="370" width="360" height="34" fill="#bfdbfe"/><text x="200" y="392" text-anchor="middle" font-size="12" fill="#1e40af">川</text>
<line x1="20" y1="290" x2="380" y2="290" stroke="#dc2626" stroke-width="2.5"/>
<line x1="400" y1="290" x2="400" y2="370" stroke="#1f2937" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="408" y="335" font-weight="700">4m</text>
<line x1="8" y1="420" x2="472" y2="420" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="20" y="430" width="16" height="12" fill="url(#h)"/><text x="44" y="441" font-size="12">後退部分＝道路とみなす → 敷地面積に算入しない・建築できない</text>
<line x1="20" y1="458" x2="36" y2="458" stroke="#dc2626" stroke-width="2.5"/><text x="44" y="462" font-size="12">みなし道路境界線（斜線制限・容積率の幅員もこの線で考える）</text>
<text x="20" y="488" font-size="12">道路は幅員4m以上（法42条）。敷地は道路に2m以上接する（法43条）</text>
</svg>
