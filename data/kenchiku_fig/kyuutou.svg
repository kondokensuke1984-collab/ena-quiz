<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="360" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">給湯設備と排水の要点</text>
<rect x="14" y="48" width="452" height="22" fill="#dbeafe"/>
<text x="22" y="64" font-weight="700" font-size="13" fill="#1e3a8a">膨張管と膨張タンク（系統図）</text>
<g transform="translate(0,74)"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="300" y="10" width="80" height="34" fill="#dbeafe" stroke="#1d4ed8"/><text x="340" y="32" font-size="12" text-anchor="middle" fill="#1f2937">膨張タンク</text><rect x="60" y="120" width="90" height="46" fill="#fee2e2" stroke="#dc2626"/><text x="105" y="140" font-size="12" text-anchor="middle" fill="#1f2937">加熱装置</text><text x="105" y="156" font-size="10" text-anchor="middle" fill="#4b5563">（ボイラー等）</text><path d="M150,130 L340,130 L340,44" stroke="#1d4ed8" stroke-width="2.5" fill="none"/><text x="250" y="122" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="700">膨張管</text><path d="M232,150 L268,170 M232,170 L268,150" stroke="#dc2626" stroke-width="2"/><path d="M250,130 L250,160" stroke="#1f2937" stroke-dasharray="3 2"/><text x="280" y="166" font-size="12" text-anchor="start" fill="#dc2626" font-weight="700">止水弁を設けてはならない</text><text x="120" y="40" font-size="11" text-anchor="middle" fill="#1f2937">加熱で膨張した水の</text><text x="120" y="56" font-size="11" text-anchor="middle" fill="#1f2937">逃げ道（安全装置）</text></g>
<text x="22" y="272" font-size="12">・膨張管に弁があると、閉じたときに逃げ場がなくなり加熱装置が破損するおそれ</text>
<text x="22" y="290" font-size="12">・ガス瞬間式給湯機の1号：1L/minの水を25℃上昇させる能力</text>
<text x="22" y="308" font-size="12">・グリース阻集器はそれ自体がトラップの働きをもつので、流入管にトラップを設</text>
<text x="34" y="326" font-size="12">けない（二重トラップの防止）</text>
<text x="22" y="344" font-size="12">・排水槽の通気管は、ほかの通気管とは別に単独で立ち上げ、外気に開放する</text>
</svg>
