<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="480" height="500" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">層間変形角・剛性率・偏心率（令82条の2・82条の6）</text>
<text x="20" y="56" font-weight="700">剛性率（立面）</text>
<g stroke="#1f2937" stroke-width="2.5" fill="none">
<path d="M40,250 L64,190 L70,130 L76,70"/><path d="M160,250 L184,190 L190,130 L196,70"/>
<line x1="64" y1="190" x2="184" y2="190"/><line x1="70" y1="130" x2="190" y2="130"/><line x1="76" y1="70" x2="196" y2="70"/>
</g>
<line x1="20" y1="250" x2="190" y2="250" stroke="#1f2937" stroke-width="3"/>
<text x="204" y="104" font-size="11">変形小</text><text x="200" y="164" font-size="11">変形小</text>
<rect x="36" y="190" width="152" height="60" fill="#fee2e2" opacity="0.6"/>
<text x="62" y="226" font-size="11" fill="#b91c1c" font-weight="700">ピロティ等</text>
<text x="194" y="226" font-size="11" fill="#b91c1c" font-weight="700">変形が集中</text>
<text x="20" y="276" font-size="12">剛性率 Rs ＝ rs ÷ rs の平均 ≧ 0.6</text>
<text x="20" y="294" font-size="11" fill="#4b5563">rs：各階の層間変形角の逆数</text>
<text x="262" y="56" font-weight="700">偏心率（平面）</text>
<rect x="262" y="70" width="190" height="150" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/>
<rect x="262" y="70" width="14" height="150" fill="#9ca3af"/>
<circle cx="357" cy="145" r="7" fill="#2563eb"/><text x="357" y="170" text-anchor="middle" font-size="11" fill="#2563eb">重心</text>
<circle cx="317" cy="145" r="7" fill="#dc2626"/><text x="317" y="132" text-anchor="middle" font-size="11" fill="#dc2626">剛心</text>
<line x1="317" y1="190" x2="357" y2="190" stroke="#dc2626" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="337" y="208" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">e</text>
<text x="280" y="88" font-size="10" fill="#4b5563">壁が片寄る</text>
<text x="262" y="244" font-size="12">偏心率 Re ＝ e ÷ re ≦ 0.15</text>
<text x="262" y="262" font-size="11" fill="#4b5563">re：弾力半径（ねじれにくさ）</text>
<text x="262" y="280" font-size="11" fill="#4b5563">剛心は重心より壁の多い側に寄る</text>
<line x1="8" y1="310" x2="472" y2="310" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="334">・層間変形角（地震時）は 1/200 以内（被害のおそれが少なければ 1/120）</text>
<text x="20" y="358" font-weight="700" font-size="13">耐震計算ルートとの関係</text>
<text x="34" y="380">ルート1-2：C0＝0.3以上で割増し ＋ 偏心率0.15以下</text>
<text x="34" y="400">ルート2：層間変形角・剛性率0.6以上・偏心率0.15以下を確認</text>
<text x="34" y="420">ルート3（保有水平耐力計算）：剛性率・偏心率の確認は不要。</text>
<text x="48" y="438" fill="#4b5563">そのかわり形状係数 Fes で必要保有水平耐力を割増す</text>
<text x="48" y="456" fill="#4b5563">Qun ＝ Ds × Fes × Qud（Fes ＝ Fs × Fe）</text>
<text x="20" y="482">・剛性率が小さいほど Fs、偏心率が大きいほど Fe が大きくなる</text>
</g>
</svg>
