<text x="20" y="420" font-size="12" fill="#4b5563">○建てられる　×建てられない　≦数字：その床面積（m²）以下なら可</text>
<text x="20" y="439" font-size="12">・全地域で可：診療所・保育所・公衆浴場・神社・派出所。</text>
<text x="20" y="458" font-size="12">　幼保連携型認定こども園も工業・工専で建てられる</text>
<text x="20" y="477" font-size="12">・一低の兼用住宅：店舗等50m²以下かつ延べ面積の1/2未満</text>
<text x="20" y="496" font-size="12">・二低〜二中の店舗・事務所は2階以下に限る</text>
<text x="20" y="515" font-size="12">・一住・二住の附属自動車車庫は2階以下などの制限あり</text>
<text x="20" y="534" font-size="12">・ボウリング場・水泳場：一住は3,000m²以下</text>
<text x="20" y="553" font-size="12">・劇場・映画館：近商・商業・準工（準住は客席200m²未満）</text>
<text x="20" y="572" font-size="12">・※田園：農産物直売所・農家レストラン（一般店舗≦150）</text>
<text x="20" y="591" font-size="12">・敷地が地域をまたぐ→敷地の過半の地域の制限による</text>
</svg>
