<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4b5563"/></marker></defs>
<rect width="480" height="500" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">木造の壁配置：四分割法（平12建告1352号）</text>
<text x="20" y="52" font-size="12" fill="#4b5563">X方向（横向き）の壁を調べる場合</text>
<rect x="60" y="70" width="280" height="200" fill="#f9fafb" stroke="#1f2937" stroke-width="2.5"/>
<rect x="60" y="70" width="280" height="50" fill="#dbeafe" opacity="0.8"/>
<rect x="60" y="220" width="280" height="50" fill="#dbeafe" opacity="0.8"/>
<g stroke="#2563eb" stroke-dasharray="6 4" stroke-width="1.5"><line x1="60" y1="120" x2="340" y2="120"/><line x1="60" y1="220" x2="340" y2="220"/></g>
<g stroke="#dc2626" stroke-width="6"><line x1="80" y1="70" x2="150" y2="70"/><line x1="230" y1="70" x2="300" y2="70"/><line x1="100" y1="270" x2="150" y2="270"/></g>
<line x1="180" y1="170" x2="250" y2="170" stroke="#dc2626" stroke-width="6"/>
<text x="200" y="100" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="700">上側の側端部分</text>
<text x="200" y="250" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="700">下側の側端部分</text>
<text x="215" y="162" text-anchor="middle" font-size="11" fill="#6b7280">中央部分の壁は判定に入らない</text>
<line x1="352" y1="70" x2="352" y2="120" stroke="#4b5563" stroke-width="1.2" marker-start="url(#r)" marker-end="url(#r)"/>
<line x1="352" y1="70" x2="352" y2="270" stroke="#4b5563" stroke-width="0" />
<text x="360" y="100" font-size="12">1/4</text>
<line x1="352" y1="220" x2="352" y2="270" stroke="#4b5563" stroke-width="1.2" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="360" y="250" font-size="12">1/4</text>
<line x1="390" y1="70" x2="390" y2="270" stroke="#4b5563" stroke-width="1.2" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="398" y="174" font-size="12">Y方向の長さ</text>
<line x1="70" y1="290" x2="94" y2="290" stroke="#dc2626" stroke-width="6"/><text x="102" y="294" font-size="12">X方向の耐力壁</text>
<line x1="8" y1="310" x2="472" y2="310" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="334">① 側端部分ごとに 壁量充足率 ＝ 存在壁量 ÷ 必要壁量</text>
<text x="48" y="352" fill="#4b5563">存在壁量 ＝ Σ（壁の長さ × 壁倍率）</text>
<text x="48" y="370" fill="#4b5563">必要壁量 ＝ 側端部分の床面積 × 令46条の係数（地震力）</text>
<text x="20" y="396">② 両側とも壁量充足率が1を超える → OK</text>
<text x="20" y="420">③ そうでない場合は 壁率比 ＝ 小さい方 ÷ 大きい方 ≧ 0.5 ならOK</text>
<text x="20" y="446" fill="#4b5563">・Y方向は、左右の端から1/4ずつの部分で同じように調べる</text>
<text x="20" y="466" fill="#4b5563">・2階建ての1階の側端部分は、1階として必要壁量を求める</text>
<text x="20" y="486" fill="#4b5563">・壁が片寄るとねじれて、壁の少ない側が大きく変形する</text>
</g>
</svg>
