<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="520" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">カーテンウォールの層間変位への追従と目地</text>
<g transform="translate(0,42)"><defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker></defs>
<text x="20" y="10" font-size="12" text-anchor="start" fill="#4b5563">地震で上の階が右へずれたとき（点線が元の位置）</text>
<line x1="62" y1="30" x2="212" y2="30" stroke="#334155" stroke-width="5"/><line x1="40" y1="150" x2="190" y2="150" stroke="#334155" stroke-width="5"/>
<rect x="85" y="34" width="60" height="112" fill="none" stroke="#9ca3af" stroke-dasharray="4 3"/>
<rect x="107" y="34" width="60" height="112" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="112" cy="38" r="4" fill="#dc2626"/><circle cx="162" cy="38" r="4" fill="#dc2626"/>
<rect x="84" y="140" width="14" height="6" fill="#16a34a"/><rect x="132" y="140" width="14" height="6" fill="#16a34a"/>
<path d="M92,143 h22" stroke="#16a34a" stroke-width="2" marker-end="url(#ar2)"/>
<text x="125" y="176" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">スウェイ方式</text><text x="125" y="191" font-size="12" text-anchor="middle" fill="#4b5563">パネルは平行移動。下が滑る</text>
<line x1="292" y1="30" x2="442" y2="30" stroke="#334155" stroke-width="5"/><line x1="270" y1="150" x2="420" y2="150" stroke="#334155" stroke-width="5"/>
<rect x="315" y="34" width="60" height="112" fill="none" stroke="#9ca3af" stroke-dasharray="4 3"/>
<g transform="rotate(11 345 90)"><rect x="326.0" y="34" width="60" height="112" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/></g>
<text x="355" y="176" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">ロッキング方式</text><text x="355" y="191" font-size="12" text-anchor="middle" fill="#4b5563">パネルが回転して追従</text></g>
<text x="22" y="272" font-size="12">・赤＝上の階に留めるファスナー、緑＝ルーズホールで滑るファスナー（スウェ</text>
<text x="34" y="290" font-size="12">イ）</text>
<g transform="translate(0,302)"><defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
<text x="20" y="10" font-size="12" text-anchor="start" fill="#4b5563">目地の雨仕舞い（水平断面）</text>
<g transform="translate(0,18)">
<rect x="40" y="30" width="80" height="22" fill="#e7e5e4" stroke="#78716c" stroke-width="1.2"/><rect x="140" y="30" width="80" height="22" fill="#e7e5e4" stroke="#78716c" stroke-width="1.2"/>
<rect x="120" y="36" width="20" height="10" fill="#fef9c3" stroke="#ca8a04" stroke-dasharray="3 2"/>
<rect x="118" y="48" width="24" height="5" fill="#334155"/>
<path d="M130,6 v24" stroke="#2563eb" stroke-width="2" marker-end="url(#ar3)"/>
<text x="140" y="14" font-size="12" text-anchor="start" fill="#2563eb">外</text>
<text x="144" y="70" font-size="12" text-anchor="start" fill="#4b5563">室内</text>
<path d="M132,40 L236,36" stroke="#4b5563" fill="none" stroke-width="0.8"/>
<text x="240" y="40" font-size="12" text-anchor="start" fill="#1f2937">等圧空間：外と同じ気圧で雨を入れない</text>
<path d="M138,51 L236,58" stroke="#4b5563" fill="none" stroke-width="0.8"/>
<text x="240" y="62" font-size="12" text-anchor="start" fill="#1f2937">気密層（室内側でだけ空気を止める）</text>
<text x="130" y="96" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">オープンジョイント</text>
</g></g>
<text x="22" y="450" font-size="12">・クローズドジョイント（フィルドジョイント）は目地をシーリングでふさぐ</text>
<text x="22" y="468" font-size="12">・パネル方式：階ごとの大きなパネル。マリオン方式：方立（マリオン）を通して</text>
<text x="34" y="486" font-size="12">間にガラス等</text>
<text x="22" y="504" font-size="12">・スパンドレル：上下の窓の間の壁（腰壁・下がり壁）</text>
</svg>
