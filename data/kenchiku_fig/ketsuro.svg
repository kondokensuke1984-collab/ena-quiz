<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="14" fill="#1f2937">
<defs><pattern id="ins" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fef3c7"/><path d="M0,5 Q2.5,0 5,5 T10,5" fill="none" stroke="#d97706" stroke-width="1"/></pattern>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6b7280"/></marker></defs>
<rect width="480" height="440" fill="#fff"/>
<rect x="0" y="30" width="150" height="230" fill="#fff7ed"/>
<rect x="150" y="30" width="16" height="230" fill="#e7e5e4" stroke="#78716c"/>
<line x1="169" y1="30" x2="169" y2="260" stroke="#2563eb" stroke-width="5"/>
<rect x="172" y="30" width="78" height="230" fill="url(#ins)" stroke="#d97706"/>
<line x1="253" y1="30" x2="253" y2="260" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="256" y="30" width="30" height="230" fill="#f0f9ff"/>
<rect x="286" y="30" width="16" height="230" fill="#d6d3d1" stroke="#78716c"/>
<rect x="302" y="30" width="178" height="230" fill="#eff6ff"/>
<g stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)">
<path d="M30,90 q15,-8 30,0 t30,0 t30,0 t24,0"/><path d="M30,150 q15,-8 30,0 t30,0 t30,0 t24,0"/><path d="M30,210 q15,-8 30,0 t30,0 t30,0 t24,0"/>
</g>
<g stroke="#dc2626" stroke-width="3"><path d="M174,80 l12,16 M186,80 l-12,16"/><path d="M174,140 l12,16 M186,140 l-12,16"/><path d="M174,200 l12,16 M186,200 l-12,16"/></g>
<g stroke="#6b7280" stroke-width="2" marker-end="url(#g)"><line x1="271" y1="230" x2="271" y2="160"/><line x1="271" y1="130" x2="271" y2="60"/></g>
<g font-size="13"><text x="12" y="52">室内（暖かく湿った空気）</text><text x="20" y="246" fill="#2563eb">水蒸気</text><text x="316" y="52">屋外（寒い）</text></g>
<g font-size="12">
<line x1="169" y1="262" x2="169" y2="282" stroke="#2563eb"/><text x="120" y="296" fill="#2563eb" font-weight="700">防湿層</text>
<text x="190" y="296">断熱材</text>
<line x1="253" y1="262" x2="262" y2="306" stroke="#6b7280"/><text x="236" y="320">透湿防水シート</text>
<line x1="271" y1="262" x2="320" y2="282" stroke="#6b7280"/><text x="322" y="288">通気層（湿気を排出）</text>
<line x1="294" y1="262" x2="340" y2="302" stroke="#6b7280"/><text x="342" y="308">外装材</text>
</g>
<line x1="8" y1="336" x2="472" y2="336" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="360">・防湿層は断熱材の室内側（高温側）に設ける（内部結露の防止）</text>
<text x="20" y="384">・外側ほど湿気を通しやすくし、通気層から外へ逃がす</text>
<text x="20" y="408">・表面結露：壁の表面温度が室内空気の露点温度より低いと起きる</text>
<text x="34" y="430" font-size="13">→ 断熱して表面温度を上げる、熱橋をなくす、換気で湿度を下げる</text>
</svg>
