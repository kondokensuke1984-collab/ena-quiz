<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 692" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="692" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">組物の種類と寺院の様式（日本建築史）</text>
<g transform="translate(0,42)"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<text x="20" y="14" font-size="12" fill="#4b5563">正面から見た形（簡単なものから順に）</text>
