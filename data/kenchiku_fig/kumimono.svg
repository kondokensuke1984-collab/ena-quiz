<text x="298" y="168" font-size="13" font-weight="700" text-anchor="middle">平三斗</text><text x="298" y="183" font-size="12" text-anchor="middle" fill="#4b5563">肘木に斗が3つ</text>
<rect x="405" y="96" width="18" height="44" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<path d="M402.0,86 h24 l-3,10 h-18 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
<rect x="372.0" y="78" width="84" height="8" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<path d="M374.0,69 h16 l-3,9 h-10 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
<path d="M406.0,69 h16 l-3,9 h-10 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
<path d="M438.0,69 h16 l-3,9 h-10 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
<rect x="408" y="78" width="12" height="8" fill="#f59e0b" stroke="#b45309"/>
<rect x="366.0" y="58" width="96" height="11" fill="#d6d3d1" stroke="#57534e" stroke-width="1.2"/>
<text x="414" y="168" font-size="13" font-weight="700" text-anchor="middle">出三斗</text><text x="414" y="183" font-size="12" text-anchor="middle" fill="#4b5563">前にも肘木が出る</text></g>
<g transform="translate(0,238)"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<text x="20" y="14" font-size="12" fill="#4b5563">横から見た形：肘木を壁から外へ何段持ち出すか（左の点線が壁の面）</text>
<line x1="56" y1="57" x2="56" y2="148" stroke="#9ca3af" stroke-dasharray="3 3"/>
<rect x="38" y="104" width="18" height="44" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<path d="M35.0,94 h24 l-3,10 h-18 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
<rect x="38" y="86" width="48" height="8" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<path d="M75.0,77 h14 l-3,9 h-8 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
<circle cx="82" cy="70" r="7" fill="#d6d3d1" stroke="#57534e" stroke-width="1.2"/>
<text x="92" y="63" font-size="12" fill="#57534e">丸桁</text>
<text x="69.0" y="122" font-size="12" text-anchor="middle" fill="#dc2626">一</text>
<path d="M56,128 h26" stroke="#dc2626" fill="none" marker-end="url(#ar)"/>
<text x="69.0" y="172" font-size="13" font-weight="700" text-anchor="middle">出組（一手先）</text><text x="69.0" y="187" font-size="12" text-anchor="middle" fill="#4b5563">外へ1段</text>
<line x1="206" y1="40" x2="206" y2="148" stroke="#9ca3af" stroke-dasharray="3 3"/>
<rect x="188" y="104" width="18" height="44" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<path d="M185.0,94 h24 l-3,10 h-18 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
