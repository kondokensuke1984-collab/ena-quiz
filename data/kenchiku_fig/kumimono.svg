<text x="62" y="168" font-size="13" font-weight="700" text-anchor="middle">舟肘木</text><text x="62" y="183" font-size="12" text-anchor="middle" fill="#4b5563">柱に肘木を直接</text>
<rect x="169" y="96" width="18" height="44" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<path d="M166.0,86 h24 l-3,10 h-18 z" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
