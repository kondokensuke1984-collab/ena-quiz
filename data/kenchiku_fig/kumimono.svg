<text x="178" y="168" font-size="13" font-weight="700" text-anchor="middle">大斗肘木</text><text x="178" y="183" font-size="12" text-anchor="middle" fill="#4b5563">大斗＋肘木</text>
<rect x="289" y="96" width="18" height="44" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
