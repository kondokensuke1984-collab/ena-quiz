<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 506" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="506" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">よく出る施工の用語</text>
<rect x="14" y="46" width="452" height="22" fill="#f3f4f6"/>
<text x="22" y="61" font-size="12" text-anchor="start" fill="#4b5563">用語</text>
<text x="170" y="61" font-size="12" text-anchor="start" fill="#4b5563">意味</text>
<text x="22" y="81" font-size="12" text-anchor="start" fill="#1f2937">スカラップ</text>
<text x="170" y="81" font-size="12" text-anchor="start" fill="#1f2937">溶接線の交差を避けるため母材に設ける扇形の切欠き</text>
<text x="22" y="101" font-size="12" text-anchor="start" fill="#1f2937">エンドタブ</text>
<text x="170" y="101" font-size="12" text-anchor="start" fill="#1f2937">溶接の始端・終端の欠陥を避けるための補助板</text>
<text x="22" y="121" font-size="12" text-anchor="start" fill="#1f2937">ラミネーション</text>
<text x="170" y="121" font-size="12" text-anchor="start" fill="#1f2937">圧延鋼材の内部が層状に分かれる欠陥</text>
<text x="22" y="141" font-size="12" text-anchor="start" fill="#1f2937">ミルシート</text>
<text x="170" y="141" font-size="12" text-anchor="start" fill="#1f2937">鋼材の品質を証明する書類（荷札ではない）</text>
<text x="22" y="161" font-size="12" text-anchor="start" fill="#1f2937">スプライスプレート</text>
<text x="170" y="161" font-size="12" text-anchor="start" fill="#1f2937">継手で母材をつなぐ添え板</text>
<text x="22" y="181" font-size="12" text-anchor="start" fill="#1f2937">ヒービング</text>
<text x="170" y="181" font-size="12" text-anchor="start" fill="#1f2937">軟弱粘土の根切り底が膨れ上がる現象</text>
<text x="22" y="201" font-size="12" text-anchor="start" fill="#1f2937">リバウンド</text>
<text x="170" y="201" font-size="12" text-anchor="start" fill="#1f2937">掘削で荷重が除かれ底面が膨れ上がる現象</text>
<text x="22" y="221" font-size="12" text-anchor="start" fill="#1f2937">腹起し</text>
<text x="170" y="221" font-size="12" text-anchor="start" fill="#1f2937">山留め壁の側圧を切ばりに伝える水平部材</text>
<text x="22" y="241" font-size="12" text-anchor="start" fill="#1f2937">逆打ち工法</text>
<text x="170" y="241" font-size="12" text-anchor="start" fill="#1f2937">地上躯体と地下躯体を並行して下へ施工</text>
<text x="22" y="261" font-size="12" text-anchor="start" fill="#1f2937">リフトアップ</text>
<text x="170" y="261" font-size="12" text-anchor="start" fill="#1f2937">地上で組んだ屋根などを所定の高さまで上げる</text>
<text x="22" y="281" font-size="12" text-anchor="start" fill="#1f2937">曳家</text>
<text x="170" y="281" font-size="12" text-anchor="start" fill="#1f2937">建物を壊さずに移動させる工法</text>
<text x="22" y="301" font-size="12" text-anchor="start" fill="#1f2937">スランプフロー</text>
<text x="170" y="301" font-size="12" text-anchor="start" fill="#1f2937">スランプコーン引上げ後の広がりの直径</text>
<text x="22" y="321" font-size="12" text-anchor="start" fill="#1f2937">エントレインドエア</text>
<text x="170" y="321" font-size="12" text-anchor="start" fill="#1f2937">AE剤で入れる微細な独立した気泡</text>
<text x="22" y="341" font-size="12" text-anchor="start" fill="#1f2937">クリープ</text>
<text x="170" y="341" font-size="12" text-anchor="start" fill="#1f2937">一定の荷重のもとで時間とともに変形が進む現象</text>
<text x="22" y="361" font-size="12" text-anchor="start" fill="#1f2937">チェッキング</text>
<text x="170" y="361" font-size="12" text-anchor="start" fill="#1f2937">シーリングや塗膜の表面の細かいひび割れ</text>
<text x="22" y="381" font-size="12" text-anchor="start" fill="#1f2937">セトリング</text>
<text x="170" y="381" font-size="12" text-anchor="start" fill="#1f2937">丸太組構法で壁の高さが低くなる現象</text>
<text x="22" y="401" font-size="12" text-anchor="start" fill="#1f2937">歩掛り</text>
<text x="170" y="401" font-size="12" text-anchor="start" fill="#1f2937">単位作業に要する労務・材料などの量</text>
<text x="22" y="421" font-size="12" text-anchor="start" fill="#1f2937">タッピングマシン</text>
<text x="170" y="421" font-size="12" text-anchor="start" fill="#1f2937">軽量床衝撃音の測定用（重量はバングマシン）</text>
<text x="22" y="441" font-size="12" text-anchor="start" fill="#1f2937">リバウンドハンマー</text>
<text x="170" y="441" font-size="12" text-anchor="start" fill="#1f2937">コンクリート表面の反発度で強度を推定</text>
<text x="22" y="461" font-size="12" text-anchor="start" fill="#1f2937">クラックスケール</text>
<text x="170" y="461" font-size="12" text-anchor="start" fill="#1f2937">ひび割れの幅を測る道具</text>
<text x="22" y="481" font-size="12" text-anchor="start" fill="#1f2937">LVL／ALC</text>
<text x="170" y="481" font-size="12" text-anchor="start" fill="#1f2937">単板を平行に積層した材／軽量気泡コンクリート</text>
</svg>
