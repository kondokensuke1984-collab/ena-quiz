<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="14" fill="#1f2937">
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs>
<rect width="480" height="420" fill="#fff"/>
<path d="M20,250 A70,70 0 0 1 160,250" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
<line x1="10" y1="250" x2="170" y2="250" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="90" cy="250" r="5" fill="#1f2937"/>
<text x="90" y="226" text-anchor="middle" font-weight="700">Es</text>
<text x="90" y="274" text-anchor="middle" font-size="12">屋外（周りに何もない）</text>
<text x="90" y="292" text-anchor="middle" font-size="12">全天空照度</text>
<text x="90" y="308" text-anchor="middle" font-size="11" fill="#4b5563">（直射日光を除く）</text>
<rect x="210" y="110" width="250" height="160" fill="#fafaf9"/>
<g stroke="#1f2937" stroke-width="4" fill="none"><path d="M210,145 V110 H460 V270 H210 V215"/></g>
<line x1="210" y1="145" x2="210" y2="215" stroke="#38bdf8" stroke-width="4"/>
<line x1="320" y1="230" x2="420" y2="230" stroke="#1f2937" stroke-width="3"/>
<circle cx="380" cy="230" r="5" fill="#1f2937"/>
<text x="380" y="252" text-anchor="middle" font-weight="700">E</text>
<g stroke="#2563eb" stroke-width="2" marker-end="url(#b)"><line x1="212" y1="160" x2="372" y2="226"/><line x1="212" y1="200" x2="372" y2="229"/></g>
<g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" fill="none"><path d="M212,180 L330,112 L378,224"/></g>
<text x="230" y="98" font-size="12" fill="#4b5563">室内の反射（間接）</text>
<text x="268" y="160" font-size="12" fill="#2563eb">窓から直接</text>
<text x="330" y="292" text-anchor="middle" font-size="12">室内のある点の照度</text>
<line x1="8" y1="320" x2="472" y2="320" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="240" y="350" text-anchor="middle" font-size="19" font-weight="700">昼光率 D ＝ E ／ Es × 100（%）</text>
<text x="20" y="378" font-size="13">・空の明るさが変わっても、その点の昼光率はほとんど変わらない</text>
<text x="20" y="400" font-size="13">・直接昼光率 ＋ 間接昼光率。窓から離れるほど小さい</text>
</svg>
