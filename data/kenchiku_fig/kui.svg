<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 524" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2937"/></marker></defs>
<rect width="480" height="524" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">杭の支持力と負の摩擦力</text>
<g transform="translate(0,24)">
<rect x="20" y="60" width="300" height="34" fill="#fef3c7"/><text x="30" y="82" font-size="12">盛土</text>
<rect x="20" y="94" width="300" height="146" fill="#e7e5e4"/><text x="30" y="210" font-size="12">軟弱な粘土層</text><text x="30" y="226" font-size="12">（圧密沈下する）</text>
<rect x="20" y="240" width="300" height="60" fill="#d6d3d1"/><text x="30" y="290" font-size="12">支持層（砂礫など）</text>
<rect x="150" y="40" width="30" height="230" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
<line x1="165" y1="18" x2="165" y2="38" stroke="#1f2937" stroke-width="3" marker-end="url(#k)"/>
<text x="176" y="36" font-size="12">建物の荷重</text>
<g stroke="#dc2626" stroke-width="2" marker-end="url(#r)"><line x1="140" y1="104" x2="140" y2="130"/><line x1="140" y1="144" x2="140" y2="170"/><line x1="190" y1="104" x2="190" y2="130"/><line x1="190" y1="144" x2="190" y2="170"/></g>
<line x1="120" y1="190" x2="210" y2="190" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 3"/>
<g stroke="#2563eb" stroke-width="2" marker-end="url(#b)"><line x1="140" y1="232" x2="140" y2="206"/><line x1="190" y1="232" x2="190" y2="206"/><line x1="140" y1="262" x2="140" y2="244"/><line x1="190" y1="262" x2="190" y2="244"/></g>
<g stroke="#2563eb" stroke-width="3" marker-end="url(#b)"><line x1="158" y1="300" x2="158" y2="276"/><line x1="172" y1="300" x2="172" y2="276"/></g>
<text x="216" y="130" font-size="12" fill="#dc2626" font-weight="700">負の摩擦力（下向き）</text>
<text x="216" y="146" font-size="11" fill="#dc2626">地盤が杭より大きく沈下し</text>
<text x="216" y="160" font-size="11" fill="#dc2626">杭を引き下げる</text>
<text x="216" y="194" font-size="12" font-weight="700">中立点</text>
<text x="216" y="226" font-size="12" fill="#2563eb" font-weight="700">正の摩擦力（上向き）</text>
<text x="216" y="318" font-size="12" fill="#2563eb" font-weight="700">先端支持力</text>
<line x1="210" y1="314" x2="180" y2="292" stroke="#2563eb" stroke-width="1"/>
<line x1="8" y1="336" x2="472" y2="336" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="360">・支持力 ＝ 先端支持力 ＋ 周面摩擦力（支持杭は先端が主）</text>
<text x="20" y="382">・負の摩擦力は杭に余分な下向きの力（軸力）を加える</text>
<text x="34" y="400" fill="#4b5563">最大の軸力は中立点の位置で生じる</text>
<text x="20" y="422">・中立点は、支持杭の方が摩擦杭より深い位置になる</text>
<text x="20" y="444">・対策：杭表面に滑り層（すべり層塗布）を設ける など</text>
<text x="20" y="466">・液状化のおそれがある層の周面摩擦力は、支持力に見込まない</text>
<text x="34" y="484" fill="#4b5563">（または低減する）</text>
</g>
</g>
</svg>
