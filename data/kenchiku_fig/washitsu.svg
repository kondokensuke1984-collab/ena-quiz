<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="440" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">和室の造作（床の間まわり）と真壁・大壁</text>
<g transform="translate(0,42)"><rect x="40" y="30" width="300" height="230" fill="#fefce8" stroke="#a16207"/>
<line x1="40" y1="36" x2="340" y2="36" stroke="#d6d3d1"/>
<line x1="40" y1="42" x2="340" y2="42" stroke="#d6d3d1"/>
<line x1="40" y1="48" x2="340" y2="48" stroke="#d6d3d1"/>
<line x1="40" y1="54" x2="340" y2="54" stroke="#d6d3d1"/>
<line x1="40" y1="60" x2="340" y2="60" stroke="#d6d3d1"/>
<rect x="40" y="60" width="300" height="5" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<rect x="40" y="116" width="300" height="8" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<rect x="180" y="60" width="10" height="200" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<rect x="40" y="100" width="140" height="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<rect x="40" y="230" width="140" height="10" fill="#a16207"/>
