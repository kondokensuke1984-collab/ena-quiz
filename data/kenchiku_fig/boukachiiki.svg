<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="500" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">防火地域・準防火地域内の建築物（令136条の2）</text>
<text x="20" y="56" font-weight="700">防火地域</text>
<g font-size="12">
<rect x="20" y="66" width="440" height="34" fill="#fee2e2" stroke="#dc2626"/>
<text x="30" y="88">階数3以上（地階を含む）または 延べ面積100m²超</text><text x="450" y="88" text-anchor="end" font-weight="700" fill="#b91c1c">耐火建築物等</text>
<rect x="20" y="100" width="440" height="34" fill="#ffedd5" stroke="#ea580c"/>
<text x="30" y="122">上記以外（階数2以下かつ100m²以下）</text><text x="450" y="122" text-anchor="end" font-weight="700" fill="#c2410c">準耐火建築物等</text>
</g>
<text x="20" y="166" font-weight="700">準防火地域（階数は地階を除く）</text>
<g font-size="12" text-anchor="middle">
<text x="160" y="190" fill="#4b5563">延べ500m²以下</text><text x="290" y="190" fill="#4b5563">500超〜1,500m²</text><text x="405" y="190" fill="#4b5563">1,500m²超</text>
<text x="56" y="222" fill="#4b5563">4階以上</text><text x="56" y="256" fill="#4b5563">3階</text><text x="56" y="296" fill="#4b5563">2階以下</text>
</g>
<rect x="100" y="200" width="360" height="34" fill="#fee2e2" stroke="#dc2626"/>
<text x="280" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">耐火建築物等</text>
<rect x="100" y="234" width="250" height="34" fill="#ffedd5" stroke="#ea580c"/>
<text x="225" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">準耐火建築物等</text>
<rect x="350" y="234" width="110" height="80" fill="#fee2e2" stroke="#dc2626"/>
<text x="405" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">耐火建築物等</text>
<rect x="220" y="268" width="130" height="46" fill="#ffedd5" stroke="#ea580c"/>
<text x="285" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">準耐火建築物等</text>
<rect x="100" y="268" width="120" height="46" fill="#fef9c3" stroke="#ca8a04"/>
<text x="160" y="286" text-anchor="middle" font-size="11" fill="#854d0e">木造：外壁・軒裏の</text>
<text x="160" y="302" text-anchor="middle" font-size="11" fill="#854d0e">延焼部分を防火構造</text>
<text x="20" y="336" font-size="11" fill="#4b5563">いずれも、延焼のおそれのある部分の外壁開口部に防火設備が必要</text>
<line x1="8" y1="350" x2="472" y2="350" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="374">・「耐火建築物等」には、同等以上の延焼防止性能をもつ</text>
<text x="34" y="392">延焼防止建築物を含む（令和元年施行の改正）</text>
<text x="20" y="416">・建築物が防火地域と準防火地域にまたがるときは、原則として</text>
<text x="34" y="434">全体に厳しい方（防火地域）の規定を適用（法65条）</text>
<text x="20" y="458">・防火地域・準防火地域内で外壁が耐火構造なら、外壁を</text>
<text x="34" y="476">隣地境界線に接して設けることができる（法63条）</text>
</g>
</svg>
