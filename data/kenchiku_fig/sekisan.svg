<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="520" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">工事費の構成と数量積算の決まり</text>
<g font-size="12" text-anchor="middle">
<rect x="20" y="44" width="440" height="30" fill="#e5e7eb" stroke="#6b7280"/><text x="240" y="64" font-weight="700">工事費 ＝ 工事価格 ＋ 消費税等相当額</text>
<rect x="20" y="78" width="370" height="30" fill="#dbeafe" stroke="#2563eb"/><text x="205" y="98" font-weight="700">工事価格</text>
<rect x="390" y="78" width="70" height="30" fill="#f3f4f6" stroke="#9ca3af"/><text x="425" y="98" font-size="11">消費税等</text>
<rect x="20" y="112" width="290" height="30" fill="#bfdbfe" stroke="#2563eb"/><text x="165" y="132" font-weight="700">工事原価</text>
<rect x="310" y="112" width="80" height="30" fill="#fef3c7" stroke="#ca8a04"/><text x="350" y="132" font-size="11">一般管理費等</text>
<rect x="20" y="146" width="210" height="30" fill="#93c5fd" stroke="#2563eb"/><text x="125" y="166" font-weight="700">純工事費</text>
<rect x="230" y="146" width="80" height="30" fill="#fef3c7" stroke="#ca8a04"/><text x="270" y="166" font-size="11">現場管理費</text>
<rect x="20" y="180" width="140" height="30" fill="#60a5fa" stroke="#2563eb"/><text x="90" y="200" font-weight="700" fill="#fff">直接工事費</text>
<rect x="160" y="180" width="70" height="30" fill="#fef3c7" stroke="#ca8a04"/><text x="195" y="200" font-size="11">共通仮設費</text>
</g>
<g font-size="11" fill="#4b5563">
<text x="20" y="230">・直接工事費：各工事科目の材料・労務・機械など（直接仮設・専用仮設を含む）</text>
<text x="20" y="246">・共通仮設費：複数の工事科目に共通の仮設（現場事務所・仮囲いなど）</text>
<text x="20" y="262">・現場管理費：現場の管理（現場従業員の給料・福利厚生費など）</text>
<text x="20" y="278">・一般管理費等：本支店の経費と利益</text>
</g>
<line x1="8" y1="294" x2="472" y2="294" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="318" font-weight="700">数量積算の主な決まり（建築数量積算基準）</text>
<g font-size="12">
<text x="34" y="342">・設計数量：設計図書から求める正味の数量</text>
<text x="34" y="362">・所要数量：切りむだ等を見込んだ数量（鉄筋は設計数量の4%増し）</text>
<text x="34" y="382">・計画数量：施工計画に基づく数量（根切り・仮設など）</text>
<text x="34" y="406">・コンクリート・型枠の開口部：1か所の内法面積0.5m²以下は</text>
<text x="48" y="424">差し引かない</text>
<text x="34" y="446">・鉄骨の孔・ダクト孔・石材などの欠除：0.1m²以下は差し引かない</text>
<text x="34" y="468">・根切りの余幅（法付け）：作業上のゆとり幅0.5m＋法幅の1/2</text>
<text x="48" y="486" fill="#4b5563">山留めがある場合の余幅は1.0m</text>
<text x="34" y="508">・コンクリートの数量から鉄筋の体積は差し引かない</text>
</g>
</svg>
