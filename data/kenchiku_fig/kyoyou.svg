<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 584" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="584" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">積載荷重と許容応力度（令85条・89〜97条）</text>
<rect x="14" y="48" width="452" height="22" fill="#dbeafe"/>
<text x="22" y="64" font-weight="700" font-size="13" fill="#1e3a8a">積載荷重（N/m²）</text>
<rect x="14" y="78" width="452" height="22" fill="#f3f4f6"/>
<text x="22" y="93" font-size="12" text-anchor="start" fill="#4b5563">室の種類</text>
<text x="230" y="93" font-size="12" text-anchor="end" fill="#4b5563">床</text>
<text x="350" y="93" font-size="12" text-anchor="end" fill="#4b5563">大梁・柱・基礎</text>
<text x="440" y="93" font-size="12" text-anchor="end" fill="#4b5563">地震力</text>
<text x="22" y="113" font-size="12" text-anchor="start" fill="#1f2937">住宅の居室</text>
<text x="230" y="113" font-size="12" text-anchor="end" fill="#1f2937">1,800</text>
<text x="350" y="113" font-size="12" text-anchor="end" fill="#1f2937">1,300</text>
<text x="440" y="113" font-size="12" text-anchor="end" fill="#1f2937">600</text>
<text x="22" y="133" font-size="12" text-anchor="start" fill="#1f2937">事務室</text>
<text x="230" y="133" font-size="12" text-anchor="end" fill="#1f2937">2,900</text>
<text x="350" y="133" font-size="12" text-anchor="end" fill="#1f2937">1,800</text>
<text x="440" y="133" font-size="12" text-anchor="end" fill="#1f2937">800</text>
<text x="22" y="153" font-size="12" text-anchor="start" fill="#1f2937">教室</text>
<text x="230" y="153" font-size="12" text-anchor="end" fill="#1f2937">2,300</text>
<text x="350" y="153" font-size="12" text-anchor="end" fill="#1f2937">2,100</text>
<text x="440" y="153" font-size="12" text-anchor="end" fill="#1f2937">1,100</text>
<text x="22" y="173" font-size="12" text-anchor="start" fill="#1f2937">百貨店・店舗の売場</text>
<text x="230" y="173" font-size="12" text-anchor="end" fill="#1f2937">2,900</text>
<text x="350" y="173" font-size="12" text-anchor="end" fill="#1f2937">2,400</text>
<text x="440" y="173" font-size="12" text-anchor="end" fill="#1f2937">1,300</text>
<text x="22" y="193" font-size="12" text-anchor="start" fill="#1f2937">劇場等（固定席）</text>
<text x="230" y="193" font-size="12" text-anchor="end" fill="#1f2937">2,900</text>
<text x="350" y="193" font-size="12" text-anchor="end" fill="#1f2937">2,600</text>
<text x="440" y="193" font-size="12" text-anchor="end" fill="#1f2937">1,600</text>
<text x="22" y="213" font-size="12" text-anchor="start" fill="#1f2937">劇場等（その他）</text>
<text x="230" y="213" font-size="12" text-anchor="end" fill="#1f2937">3,500</text>
<text x="350" y="213" font-size="12" text-anchor="end" fill="#1f2937">3,200</text>
<text x="440" y="213" font-size="12" text-anchor="end" fill="#1f2937">2,100</text>
<text x="22" y="242" font-size="12">・床用＞骨組用＞地震力用。倉庫業の倉庫は3,900以上</text>
<text x="22" y="260" font-size="12">・教室等に連絡する廊下・階段は「劇場等（その他）」の数値</text>
<text x="22" y="278" font-size="12">・屋上広場・バルコニーは住宅の数値。学校・百貨店は売場の数値</text>
<text x="22" y="296" font-size="12">・柱・基礎は支える床の数で低減（劇場等の客席は除く）：</text>
<text x="22" y="314" font-size="12">　2→0.95、3→0.9、4→0.85、5→0.8、6→0.75 … 9以上→0.6</text>
<rect x="14" y="322" width="452" height="22" fill="#dcfce7"/>
<text x="22" y="338" font-weight="700" font-size="13" fill="#14532d">許容応力度（F＝基準強度、Fc＝設計基準強度）</text>
<rect x="14" y="352" width="452" height="22" fill="#f3f4f6"/>
<text x="22" y="367" font-size="12" text-anchor="start" fill="#4b5563">材料</text>
<text x="210" y="367" font-size="12" text-anchor="start" fill="#4b5563">長期</text>
<text x="350" y="367" font-size="12" text-anchor="start" fill="#4b5563">短期</text>
<text x="22" y="387" font-size="12" text-anchor="start" fill="#1f2937">鋼材の引張・圧縮・曲げ</text>
<text x="210" y="387" font-size="12" text-anchor="start" fill="#1f2937">F/1.5</text>
<text x="350" y="387" font-size="12" text-anchor="start" fill="#1f2937">F</text>
<text x="22" y="407" font-size="12" text-anchor="start" fill="#1f2937">鋼材のせん断</text>
<text x="210" y="407" font-size="12" text-anchor="start" fill="#1f2937">F/(1.5√3)</text>
<text x="350" y="407" font-size="12" text-anchor="start" fill="#1f2937">F/√3</text>
<text x="22" y="427" font-size="12" text-anchor="start" fill="#1f2937">コンクリートの圧縮</text>
<text x="210" y="427" font-size="12" text-anchor="start" fill="#1f2937">Fc/3</text>
<text x="350" y="427" font-size="12" text-anchor="start" fill="#1f2937">2Fc/3</text>
<text x="22" y="447" font-size="12" text-anchor="start" fill="#1f2937">コンクリートの引張・せん断</text>
<text x="210" y="447" font-size="12" text-anchor="start" fill="#1f2937">Fc/30</text>
<text x="350" y="447" font-size="12" text-anchor="start" fill="#1f2937">Fc/15</text>
<text x="22" y="467" font-size="12" text-anchor="start" fill="#1f2937">木材</text>
<text x="210" y="467" font-size="12" text-anchor="start" fill="#1f2937">1.1F/3</text>
<text x="350" y="467" font-size="12" text-anchor="start" fill="#1f2937">2F/3</text>
<text x="22" y="496" font-size="12">・材料強度：鋼材・鉄筋・高力ボルトの引張はF。コンクリートの引張・せん断は</text>
<text x="34" y="514" font-size="12">圧縮の1/10</text>
<text x="22" y="532" font-size="12">・積雪：1cmごとに20N/m²以上、勾配60°超は0、地震時は0.35倍</text>
<text x="22" y="550" font-size="12">・風圧力の速度圧 q＝0.6EV0²。外装材用は局部のピーク風圧で骨組用より大き</text>
<text x="34" y="568" font-size="12">い</text>
</svg>
