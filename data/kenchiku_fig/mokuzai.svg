<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2937"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="480" height="500" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">木材の方向性と含水率</text>
<!-- 丸太の木口 -->
<circle cx="110" cy="130" r="72" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<circle cx="110" cy="130" r="50" fill="#d97706" opacity="0.55"/>
<g fill="none" stroke="#92400e" stroke-width="1"><circle cx="110" cy="130" r="20"/><circle cx="110" cy="130" r="35"/><circle cx="110" cy="130" r="60"/></g>
<text x="110" y="134" text-anchor="middle" font-size="11" font-weight="700">心材</text>
<text x="110" y="216" text-anchor="middle" font-size="11">辺材（外側）</text>
<line x1="110" y1="130" x2="176" y2="96" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
<text x="150" y="74" font-size="11" fill="#dc2626" font-weight="700">半径方向</text>
<path d="M150,190 A70,70 0 0 0 186,148" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#r)"/>
<text x="178" y="196" font-size="11" fill="#2563eb" font-weight="700">接線方向</text>
<text x="20" y="246" font-size="12">乾燥収縮率</text>
<text x="20" y="264" font-size="12" font-weight="700">接線 ： 半径 ： 繊維 ≒ 10 ： 5 ： 0.5</text>
<text x="260" y="54" font-weight="700">含水率と強度・収縮</text>
<line x1="270" y1="200" x2="460" y2="200" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
<line x1="270" y1="200" x2="270" y2="66" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
<path d="M276,74 L390,170 L450,170" fill="none" stroke="#2563eb" stroke-width="3"/>
<g stroke="#9ca3af" stroke-dasharray="4 3"><line x1="320" y1="200" x2="320" y2="110"/><line x1="390" y1="200" x2="390" y2="170"/></g>
<text x="320" y="216" font-size="11" text-anchor="middle">約15%</text><text x="320" y="230" font-size="10" text-anchor="middle" fill="#4b5563">気乾</text>
<text x="390" y="216" font-size="11" text-anchor="middle">約30%</text><text x="390" y="230" font-size="10" text-anchor="middle" fill="#4b5563">繊維飽和点</text>
<text x="456" y="216" font-size="11" text-anchor="end">含水率</text>
<text x="264" y="84" font-size="11" text-anchor="end">強度</text>
<text x="400" y="160" font-size="10" fill="#4b5563">ほぼ一定</text>
<line x1="8" y1="284" x2="472" y2="284" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="308">・繊維飽和点以下では、含水率が小さいほど強度・弾性係数が大きく、</text>
<text x="34" y="326">乾燥により収縮する（繊維飽和点以上では強度も寸法もほぼ一定）</text>
<text x="20" y="350">・強度は繊維方向が最も大きい（繊維に直交する方向は小さい）</text>
<text x="20" y="374">・気乾比重（密度）が大きいほど強度は大きい</text>
<text x="20" y="398">・心材は辺材より腐朽・虫害に強い。辺材は含水率が高く、腐りやすい</text>
<text x="20" y="422">・木表（樹皮側）は、乾燥すると木表側に反る（凹になる）</text>
<text x="20" y="446">・長期に荷重がかかると変形が増える（クリープ）。長期の許容</text>
<text x="34" y="464">応力度は短期より小さい（長期1.1/3、短期2/3 × 基準強度）</text>
</g>
</svg>
