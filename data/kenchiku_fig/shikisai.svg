<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 454" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="454" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">表色系と安全色</text>
<rect x="14" y="48" width="452" height="22" fill="#dbeafe"/>
<text x="22" y="64" font-weight="700" font-size="13" fill="#1e3a8a">xy色度図（XYZ表色系）</text>
<g transform="translate(0,74)"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><path d="M40,160 L260,160 M40,160 L40,10" stroke="#334155" stroke-width="1.2" fill="none"/><text x="262" y="174" font-size="12" text-anchor="end" fill="#1f2937">x</text><text x="30" y="16" font-size="12" text-anchor="middle" fill="#1f2937">y</text><path d="M70,150 L66,120 L72,80 L92,40 L115,22 L140,32 L175,70 L215,115 L240,140 Z" fill="#f0fdf4" stroke="#334155" stroke-width="1.4"/><text x="110" y="18" font-size="11" text-anchor="middle" fill="#15803d">緑</text><text x="232" y="132" font-size="11" text-anchor="middle" fill="#dc2626">赤</text><text x="60" y="158" font-size="11" text-anchor="middle" fill="#1d4ed8">青</text><text x="132" y="112" font-size="10" text-anchor="middle" fill="#4b5563">白色点</text><circle cx="132" cy="100" r="2.5" fill="#4b5563"/><text x="280" y="30" font-size="12" text-anchor="start" fill="#1f2937">・xが大きいほど赤み、yが大きい</text><text x="292" y="46" font-size="12" text-anchor="start" fill="#1f2937">ほど緑み</text><text x="280" y="70" font-size="12" text-anchor="start" fill="#1f2937">・外周の釣鐘形の曲線＝単色光</text><text x="292" y="86" font-size="12" text-anchor="start" fill="#1f2937">（スペクトル軌跡）</text><text x="280" y="110" font-size="12" text-anchor="start" fill="#1f2937">・図上の距離は、知覚される色の</text><text x="292" y="126" font-size="12" text-anchor="start" fill="#1f2937">差（色差）に比例しない</text><text x="280" y="150" font-size="12" text-anchor="start" fill="#1f2937">・マンセル表色系は物体色の表色系</text><text x="292" y="166" font-size="12" text-anchor="start" fill="#1f2937">（光源の色には使えない）</text></g>
<rect x="14" y="258" width="452" height="22" fill="#dcfce7"/>
<text x="22" y="274" font-weight="700" font-size="13" fill="#14532d">安全色（JIS Z 9103）</text>
<g transform="translate(0,284)"><rect x="24" y="4" width="26" height="16" fill="#dc2626"/><text x="60" y="17" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">赤</text><text x="110" y="17" font-size="12" text-anchor="start" fill="#1f2937">防火・禁止・停止・高度の危険</text><rect x="24" y="26" width="26" height="16" fill="#f97316"/><text x="60" y="39" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">黄赤</text><text x="110" y="39" font-size="12" text-anchor="start" fill="#1f2937">危険</text><rect x="24" y="48" width="26" height="16" fill="#facc15"/><text x="60" y="61" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">黄</text><text x="110" y="61" font-size="12" text-anchor="start" fill="#1f2937">注意警告</text><rect x="24" y="70" width="26" height="16" fill="#16a34a"/><text x="60" y="83" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">緑</text><text x="110" y="83" font-size="12" text-anchor="start" fill="#1f2937">安全状態・進行</text><rect x="24" y="92" width="26" height="16" fill="#2563eb"/><text x="60" y="105" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">青</text><text x="110" y="105" font-size="12" text-anchor="start" fill="#1f2937">指示・誘導</text><rect x="24" y="114" width="26" height="16" fill="#a21caf"/><text x="60" y="127" font-size="12" text-anchor="start" fill="#1f2937" font-weight="700">赤紫</text><text x="110" y="127" font-size="12" text-anchor="start" fill="#1f2937">放射能</text></g>
<text x="22" y="438" font-size="12" fill="#4b5563">・「注意警告」は黄。赤を注意警告とするのは誤り</text>
</svg>
