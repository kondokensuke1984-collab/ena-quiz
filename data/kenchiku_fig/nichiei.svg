<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="560" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">日影規制（平面）</text>
<rect x="60" y="150" width="360" height="280" rx="100" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="110" y="200" width="260" height="180" rx="50" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="8 5"/>
<ellipse cx="240" cy="218" rx="108" ry="64" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" stroke-width="2"/>
<ellipse cx="240" cy="236" rx="62" ry="32" fill="#ea580c" fill-opacity=".2" stroke="#ea580c" stroke-width="2"/>
<rect x="160" y="250" width="160" height="80" fill="none" stroke="#1f2937" stroke-width="3"/>
<rect x="200" y="268" width="80" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
<text x="240" y="298" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">建築物</text>
<text x="240" y="346" text-anchor="middle" font-size="12">敷地境界線</text>
<g font-size="12"><text x="372" y="196" fill="#ea580c">5mライン</text><text x="404" y="146" fill="#2563eb">10mライン</text></g>
<text x="194" y="244" font-size="12" fill="#ea580c" font-weight="700">5時間</text>
<text x="160" y="186" font-size="12" fill="#2563eb" font-weight="700">3時間</text>
<text x="420" y="60" font-size="14" font-weight="700">↑北</text>
<text x="20" y="70" font-size="12" fill="#4b5563">例：5m〜10mは5時間未満、10m超は3時間未満</text>
<text x="20" y="88" font-size="12" fill="#4b5563">→ 5時間の日影線は5mラインの内側、3時間の線は10mラインの内側に</text>
<line x1="8" y1="446" x2="472" y2="446" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="470">・冬至日の8時〜16時（北海道は9時〜15時）の日影時間で規制</text>
<text x="20" y="492">・測定面の高さ：一低・二低・田園 1.5m、一中高など 4m又は6.5m</text>
<text x="20" y="514">・対象：一低・二低・田園は軒高7m超又は地上3階以上、</text>
<text x="62" y="534">その他の地域は高さ10m超</text>
<text x="20" y="554" font-size="12" fill="#4b5563">・商業・工業・工業専用地域は対象区域にできない</text>
</svg>
