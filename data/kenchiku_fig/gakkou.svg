<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="540" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">学校の運営方式と劇場の舞台形式</text>
<g font-size="12">
<rect x="20" y="42" width="440" height="52" fill="#eff6ff" stroke="#93c5fd"/>
<text x="30" y="62" font-weight="700" fill="#1d4ed8">総合教室型（A型）</text>
<text x="30" y="82">ほとんどの学習を自分の教室で行う。小学校低学年に適する</text>
<rect x="20" y="98" width="440" height="52" fill="#eff6ff" stroke="#93c5fd"/>
<text x="30" y="118" font-weight="700" fill="#1d4ed8">特別教室型（U＋V型）</text>
<text x="30" y="138">普通教科は自分の教室、理科・音楽などは特別教室へ移動</text>
<rect x="20" y="154" width="440" height="70" fill="#eff6ff" stroke="#93c5fd"/>
<text x="30" y="174" font-weight="700" fill="#1d4ed8">教科教室型（V型）</text>
<text x="30" y="194">全教科を専用の教室で行い、生徒が移動する。中学・高校向き</text>
<text x="30" y="212" fill="#4b5563">ホームベース（生活の拠点）とロッカーが必要。小学校には不向き</text>
<rect x="20" y="228" width="440" height="52" fill="#eff6ff" stroke="#93c5fd"/>
<text x="30" y="248" font-weight="700" fill="#1d4ed8">系列教科教室型</text>
<text x="30" y="268">教科を系列（文系・理系など）にまとめて教室を共用する</text>
<rect x="20" y="284" width="440" height="52" fill="#eff6ff" stroke="#93c5fd"/>
<text x="30" y="304" font-weight="700" fill="#1d4ed8">プラトゥーン型（P型）</text>
<text x="30" y="324">2群に分け、普通教室と特別教室を交代で使う。時間割が難しい</text>
</g>
<line x1="8" y1="352" x2="472" y2="352" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="376" font-weight="700">劇場の舞台形式（客席から見た配置）</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="392" width="100" height="26" fill="#fde68a" stroke="#92400e"/><rect x="40" y="418" width="100" height="6" fill="#dc2626"/>
<g fill="#cbd5e1"><rect x="40" y="432" width="100" height="40"/></g>
<text x="90" y="410">舞台</text><text x="90" y="456">客席</text><text x="90" y="490" font-weight="700">プロセニアム</text><text x="90" y="504" fill="#4b5563">額縁で舞台と客席を分ける</text>
<rect x="200" y="400" width="70" height="40" fill="#fde68a" stroke="#92400e"/>
<g fill="#cbd5e1"><rect x="180" y="400" width="18" height="60"/><rect x="272" y="400" width="18" height="60"/><rect x="200" y="442" width="70" height="20"/></g>
<text x="235" y="424">舞台</text><text x="235" y="490" font-weight="700">オープン（スラスト）</text><text x="235" y="504" fill="#4b5563">客席が三方から囲む</text>
<g fill="#cbd5e1"><rect x="340" y="392" width="100" height="80"/></g>
<rect x="364" y="414" width="52" height="36" fill="#fde68a" stroke="#92400e"/>
<text x="390" y="436">舞台</text><text x="390" y="490" font-weight="700">アリーナ</text><text x="390" y="504" fill="#4b5563">四方から囲む</text>
</g>
<text x="20" y="530" font-size="12">・上手＝客席から見て右、下手＝左。歌舞伎の本花道は下手側</text>
</svg>
