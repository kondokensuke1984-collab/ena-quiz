<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 406" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="406" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">建築物と周辺環境・スポーツ施設の方位</text>
<rect x="14" y="48" width="452" height="22" fill="#dbeafe"/>
<text x="22" y="64" font-weight="700" font-size="13" fill="#1e3a8a">屋外競技場の向き（平面・上が北）</text>
<g transform="translate(0,74)"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="60" y="20" width="60" height="110" fill="#dcfce7" stroke="#15803d"/><path d="M60,75 L120,75" stroke="#15803d"/><circle cx="90" cy="75" r="10" fill="none" stroke="#15803d"/><rect x="80" y="14" width="20" height="6" fill="#fff" stroke="#15803d"/><rect x="80" y="130" width="20" height="6" fill="#fff" stroke="#15803d"/><text x="90" y="154" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">サッカー場</text><text x="90" y="170" font-size="12" text-anchor="middle" fill="#15803d">長軸を南北に</text><path d="M170,75 L128,75" stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#ah)"/><text x="178" y="70" font-size="11" text-anchor="start" fill="#1f2937">朝夕の低い太陽が</text><text x="178" y="86" font-size="11" text-anchor="start" fill="#1f2937">正面から入らない</text><g transform="rotate(67.5 290 130)"><path d="M290,130 L330,90 L290,50 L250,90 Z" fill="#fde68a" stroke="#b45309"/><path d="M290,130 L290,50" stroke="#dc2626" stroke-dasharray="4 3"/></g><text x="282" y="146" font-size="11" text-anchor="middle" fill="#1f2937">本塁</text><text x="378" y="104" font-size="11" text-anchor="middle" fill="#1f2937">二塁</text><text x="330" y="166" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">野球場：本塁→二塁を東北東に</text><text x="448" y="30" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">N</text><path d="M448,70 L448,36" stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#ah)"/></g>
<rect x="14" y="256" width="452" height="22" fill="#dcfce7"/>
<text x="22" y="272" font-weight="700" font-size="13" fill="#14532d">周辺環境</text>
<text x="22" y="300" font-size="12">・冬至日に4時間以上日影になる範囲は、高さを上げてもあまり広がらず、建物の</text>
<text x="34" y="318" font-size="12">東西方向の幅に大きく影響される</text>
<text x="22" y="336" font-size="12">・外部空間の幅員Dと建物の高さHの比D/Hは、開放感・閉塞感の指標</text>
<text x="22" y="354" font-size="12">・屋根・屋上の高日射反射率塗料はヒートアイランドの抑制に効く。多雪地の市街</text>
<text x="34" y="372" font-size="12">地では無落雪屋根も</text>
<text x="22" y="390" font-size="12">・ビル風対策：出隅を曲面にする、常緑の高木を外周に植える</text>
</svg>
