<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 462" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="14" fill="#1f2937">
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="480" height="462" fill="#fff"/>
<rect x="120" y="80" width="180" height="220" fill="#fff7ed"/>
<g stroke="#1f2937" stroke-width="4" fill="none">
<path d="M120,80 H300 V100 M300,120 V300 H120 V280 M120,260 V80"/>
</g>
<line x1="40" y1="270" x2="134" y2="270" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
<line x1="290" y1="110" x2="362" y2="110" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
<line x1="110" y1="190" x2="310" y2="190" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
<text x="182" y="182" font-size="13" fill="#4b5563">中性帯</text>
<g stroke="#1f2937" stroke-width="1.5"><line x1="230" y1="110" x2="250" y2="110"/><line x1="230" y1="270" x2="250" y2="270"/><line x1="240" y1="110" x2="240" y2="270"/></g>
<text x="246" y="236" font-style="italic">h</text>
<text x="140" y="140">室内 ti（暖）</text>
<text x="20" y="60">屋外 to（寒）</text>
<text x="34" y="296" font-size="12" fill="#2563eb">下から流入</text>
<text x="306" y="96" font-size="12" fill="#dc2626">上から流出</text>
<line x1="410" y1="80" x2="410" y2="300" stroke="#1f2937" stroke-width="1.5"/>
<line x1="380" y1="285" x2="440" y2="95" stroke="#2563eb" stroke-width="3"/>
<text x="378" y="74" font-size="12">室内外の圧力差</text>
<text x="420" y="140" font-size="12" fill="#dc2626">＋</text>
<text x="388" y="250" font-size="12" fill="#2563eb">−</text>
<line x1="8" y1="324" x2="472" y2="324" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="350" font-weight="700">温度差換気量 Q ∝ αA √(h・Δt)</text>
<text x="20" y="374" font-size="13">（h：上下の開口の高さの差、Δt：室内外の温度差）</text>
<text x="20" y="398" font-size="13">・冬、室内が暖かいとき：中性帯より下は流入、上は流出</text>
<text x="20" y="420" font-size="13">・中性帯は、開口の大きいほうに近づく</text>
<text x="20" y="446" font-size="13">・風力換気量 Q ∝ αA・v√ΔC（v：風速、ΔC：風圧係数の差）</text>
</svg>
