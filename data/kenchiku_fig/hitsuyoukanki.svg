<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 456" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="456" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">必要換気量と換気方式</text>
<g transform="translate(0,42)">
<rect x="20" y="0" width="440" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
<text x="240" y="26" font-size="16" font-weight="700" text-anchor="middle">Q ＝ M ÷（Ci − Co）</text>
<text x="240" y="50" font-size="12" text-anchor="middle" fill="#374151">Q 換気量 m³/h、M 発生量 m³/h、Ci 許容濃度、Co 外気濃度</text>
</g>
<text x="22" y="136" font-size="12">・CO₂ 1,000ppm以下（外気400ppm）、1人0.030m³/h → 0.030÷0.0006＝</text>
<text x="34" y="154" font-size="12">50m³/(h・人)</text>
<text x="22" y="172" font-size="12">・逆に濃度を求めるとき：Ci＝Co＋M÷Q（例：400ppm＋500ppm＝900ppm）</text>
<text x="22" y="190" font-size="12">・設計では1人当たり30m³/h程度、地下駐車場は床1m²当たり14m³/h程度</text>
<rect x="14" y="198" width="452" height="22" fill="#dbeafe"/>
<text x="22" y="214" font-weight="700" font-size="13" fill="#1e3a8a">換気方式</text>
<rect x="14" y="228" width="452" height="22" fill="#f3f4f6"/>
<text x="22" y="243" font-size="12" text-anchor="start" fill="#4b5563">方式</text>
<text x="120" y="243" font-size="12" text-anchor="start" fill="#4b5563">給気／排気</text>
<text x="270" y="243" font-size="12" text-anchor="start" fill="#4b5563">使う室</text>
<text x="22" y="263" font-size="12" text-anchor="start" fill="#1f2937">第1種</text>
<text x="120" y="263" font-size="12" text-anchor="start" fill="#1f2937">機械／機械</text>
<text x="270" y="263" font-size="12" text-anchor="start" fill="#1f2937">燃焼機器室・クリーンルーム</text>
<text x="22" y="283" font-size="12" text-anchor="start" fill="#1f2937">第2種</text>
<text x="120" y="283" font-size="12" text-anchor="start" fill="#1f2937">機械／自然（正圧）</text>
<text x="270" y="283" font-size="12" text-anchor="start" fill="#1f2937">汚染を入れたくない室</text>
<text x="22" y="303" font-size="12" text-anchor="start" fill="#1f2937">第3種</text>
<text x="120" y="303" font-size="12" text-anchor="start" fill="#1f2937">自然／機械（負圧）</text>
<text x="270" y="303" font-size="12" text-anchor="start" fill="#1f2937">便所・厨房・駐車場</text>
<text x="22" y="332" font-size="12">・厨房は排気を給気より多くして負圧に。燃焼機器のある室に第3種は不適当</text>
<text x="22" y="350" font-size="12">・ボイラー室の給気量＝燃焼用空気＋発熱を除く換気量</text>
<text x="22" y="368" font-size="12">・クリーンルームは正圧。清浄度クラスは数値が小さいほどきれい</text>
<text x="22" y="386" font-size="12">・RI施設は空気を循環させない（オールフレッシュ）</text>
<text x="22" y="404" font-size="12">・置換換気：床付近から低速で給気し上部から排気。汚染が高温・軽量のとき有効</text>
<text x="22" y="422" font-size="12">・自然給気口は冷気が足元に流れないよう高い位置に。外気冷房時は全熱交換器を</text>
<text x="34" y="440" font-size="12">バイパス</text>
</svg>
