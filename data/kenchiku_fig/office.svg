<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<rect width="480" height="500" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">事務所ビルのコア形式</text>
<g font-size="11" text-anchor="middle">
<rect x="20" y="46" width="100" height="70" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/><rect x="50" y="66" width="40" height="30" fill="#9ca3af"/>
<text x="70" y="134" font-weight="700" font-size="12">センターコア</text>
<rect x="135" y="46" width="100" height="70" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/><rect x="135" y="46" width="28" height="70" fill="#9ca3af"/>
<text x="185" y="134" font-weight="700" font-size="12">片コア（偏心）</text>
<rect x="250" y="46" width="100" height="70" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/><rect x="250" y="46" width="22" height="70" fill="#9ca3af"/><rect x="328" y="46" width="22" height="70" fill="#9ca3af"/>
<text x="300" y="134" font-weight="700" font-size="12">ダブルコア</text>
<rect x="380" y="46" width="80" height="70" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/><rect x="380" y="122" width="80" height="0"/>
<rect x="398" y="20" width="44" height="22" fill="#9ca3af"/><line x1="420" y1="42" x2="420" y2="46" stroke="#1f2937" stroke-width="3"/>
<text x="420" y="134" font-weight="700" font-size="12">分離コア</text>
</g>
<g font-size="11">
<text x="20" y="154">高層向き。構造的に</text><text x="20" y="168">バランスがよい</text>
<text x="135" y="154">中小規模向き。</text><text x="135" y="168">剛性が偏りねじれる</text>
<text x="250" y="154">2方向避難が明快。</text><text x="250" y="168">中規模・大空間</text>
<text x="370" y="154">自由な事務空間。</text><text x="370" y="168">接続部が耐震上弱い</text>
</g>
<line x1="8" y1="184" x2="472" y2="184" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="208" font-weight="700" font-size="13">計画の要点</text>
<text x="34" y="230">・コアは東西面に置くと、西日などの熱負荷を減らせる</text>
<text x="34" y="252">・レンタブル比（貸室面積÷床面積）：基準階で75〜85%程度</text>
<text x="34" y="274">・エレベーターの対面配置は8台程度まで。低層用・高層用の</text>
<text x="48" y="292">異なるバンクを対面させない</text>
<text x="34" y="314">・ゾーニング：高層ビルは階をいくつかのゾーンに分け、</text>
<text x="48" y="332">ゾーンごとにエレベーターを受け持たせる（コンベンショナル）</text>
<text x="34" y="354">・ダブルデッキ：上下2層のかごで2つの階に同時に停止する方式</text>
<text x="34" y="376">・非常用エレベーターの乗降ロビーは1基につき10m²以上</text>
<text x="34" y="398">・フリーアクセスフロア：床下に配線スペースをとる二重床</text>
<text x="34" y="420">・大きな基準階では、EPS・PSを分散配置する</text>
<text x="34" y="442">・重荷重ゾーン（書庫など）は、一般事務室より大きい積載荷重</text>
<text x="48" y="460">（事務室の床用 2,900N/m²）を超える値で設計する</text>
<text x="34" y="482">・OA機器の画面への映り込みを防ぐため、鉛直面照度を抑える</text>
</g>
</svg>
