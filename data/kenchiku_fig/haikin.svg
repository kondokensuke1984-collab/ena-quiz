<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="480" height="520" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">RC造の柱・梁の配筋（令77条・78条）</text>
<rect x="40" y="44" width="300" height="50" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<text x="290" y="74" font-size="12" text-anchor="middle">梁</text>
<rect x="90" y="94" width="80" height="210" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
<rect x="40" y="304" width="300" height="20" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<g stroke="#1f2937" stroke-width="3"><line x1="102" y1="44" x2="102" y2="324"/><line x1="158" y1="44" x2="158" y2="324"/></g>
<g stroke="#ea580c" stroke-width="2.5">
<line x1="96" y1="104" x2="164" y2="104"/><line x1="96" y1="116" x2="164" y2="116"/><line x1="96" y1="128" x2="164" y2="128"/><line x1="96" y1="140" x2="164" y2="140"/><line x1="96" y1="152" x2="164" y2="152"/>
<line x1="96" y1="176" x2="164" y2="176"/><line x1="96" y1="200" x2="164" y2="200"/><line x1="96" y1="224" x2="164" y2="224"/>
<line x1="96" y1="246" x2="164" y2="246"/><line x1="96" y1="258" x2="164" y2="258"/><line x1="96" y1="270" x2="164" y2="270"/><line x1="96" y1="282" x2="164" y2="282"/><line x1="96" y1="294" x2="164" y2="294"/>
</g>
<g stroke="#ea580c" stroke-width="2.5"><line x1="200" y1="52" x2="200" y2="86"/><line x1="226" y1="52" x2="226" y2="86"/><line x1="252" y1="52" x2="252" y2="86"/></g>
<g stroke="#1f2937" stroke-width="2.5"><line x1="40" y1="54" x2="340" y2="54"/><line x1="40" y1="84" x2="340" y2="84"/></g>
<line x1="80" y1="94" x2="80" y2="160" stroke="#dc2626" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<line x1="186" y1="176" x2="186" y2="200" stroke="#dc2626" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="200" y="186" fill="#dc2626" font-size="12" font-weight="700">帯筋の間隔 15cm以下</text>
<text x="200" y="202" fill="#dc2626" font-size="11">かつ 最も細い主筋の径の15倍以下</text>
<text x="200" y="128" fill="#dc2626" font-size="12" font-weight="700">梁・壁から柱の小径の2倍以内</text>
<text x="200" y="144" fill="#dc2626" font-size="12" font-weight="700">の範囲は 10cm以下</text>
<line x1="196" y1="140" x2="168" y2="140" stroke="#dc2626" stroke-width="1"/>
<text x="350" y="62" font-size="12" fill="#ea580c" font-weight="700">あばら筋</text>
<text x="350" y="78" font-size="11" fill="#ea580c">間隔は梁せいの3/4以下</text>
<text x="350" y="94" font-size="11" fill="#4b5563">（臥梁は30cm以下）</text>
<text x="200" y="256" font-size="12" fill="#ea580c" font-weight="700">帯筋（フープ）</text>
<text x="200" y="272" font-size="11" fill="#ea580c">せん断補強・主筋の座屈防止</text>
<text x="40" y="344" font-size="12" font-weight="700">主筋</text>
<line x1="70" y1="340" x2="102" y2="316" stroke="#1f2937" stroke-width="1"/>
<line x1="8" y1="362" x2="472" y2="362" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="386" font-size="14" font-weight="700">柱（令77条）</text>
<g font-size="12">
<text x="34" y="408">・主筋は4本以上、帯筋と緊結する</text>
<text x="34" y="428">・帯筋の径は6mm以上、帯筋比は0.2%以上</text>
<text x="34" y="448">・柱の小径は主要な支点間距離の1/15以上</text>
<text x="34" y="468">・主筋の断面積の和はコンクリート断面積の0.8%以上</text>
</g>
<text x="20" y="494" font-size="14" font-weight="700">梁（令78条）</text>
<text x="120" y="494" font-size="12">複筋梁とし、あばら筋は梁せいの3/4以下の間隔</text>
</svg>
