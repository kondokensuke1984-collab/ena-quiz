<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2937"/></marker></defs>
<rect width="480" height="520" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">耐震補強の考え方（強度と靱性）</text>
<line x1="50" y1="220" x2="300" y2="220" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
<line x1="50" y1="220" x2="50" y2="50" stroke="#1f2937" stroke-width="1.5" marker-end="url(#k)"/>
<text x="296" y="238" font-size="11" text-anchor="end">変形（靱性）</text>
<text x="56" y="56" font-size="11">強度（耐力）</text>
<path d="M50,220 L80,150 L110,150" fill="none" stroke="#6b7280" stroke-width="3"/><text x="84" y="172" font-size="11" fill="#4b5563">補強前</text>
<path d="M50,220 L72,80 L120,80" fill="none" stroke="#dc2626" stroke-width="3"/><text x="124" y="84" font-size="11" fill="#b91c1c" font-weight="700">強度型</text>
<path d="M50,220 L80,150 L270,150" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 4"/><text x="230" y="142" font-size="11" fill="#1d4ed8" font-weight="700">靱性型</text>
<text x="316" y="70" font-size="12" font-weight="700" fill="#b91c1c">強度型の補強</text>
<g font-size="11"><text x="316" y="88">・耐震壁の増設・増し打ち</text><text x="316" y="104">・鉄骨ブレースの増設</text><text x="316" y="120">・バットレス（外付け架構）</text></g>
<text x="316" y="150" font-size="12" font-weight="700" fill="#1d4ed8">靱性型の補強</text>
<g font-size="11"><text x="316" y="168">・柱の鋼板巻き・炭素繊維巻き</text><text x="316" y="184">（せん断破壊を防ぐ）</text><text x="316" y="200">・耐震スリットで短柱化を解消</text></g>
<line x1="8" y1="252" x2="472" y2="252" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="276" font-weight="700">耐震スリット（腰壁・垂れ壁付きの柱）</text>
<rect x="40" y="290" width="40" height="120" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<rect x="80" y="290" width="90" height="34" fill="#f3f4f6" stroke="#9ca3af"/><rect x="80" y="376" width="90" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<rect x="40" y="324" width="40" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="88" y="354" font-size="10" fill="#b91c1c">短柱：せん断破壊</text>
<rect x="250" y="290" width="40" height="120" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<rect x="296" y="290" width="90" height="34" fill="#f3f4f6" stroke="#9ca3af"/><rect x="296" y="376" width="90" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<g stroke="#2563eb" stroke-width="4"><line x1="293" y1="290" x2="293" y2="324"/><line x1="293" y1="376" x2="293" y2="410"/></g>
<text x="300" y="354" font-size="10" fill="#1d4ed8">スリットで柱と壁を切り離す</text>
<text x="196" y="354" font-size="16" text-anchor="middle">→</text>
<line x1="8" y1="426" x2="472" y2="426" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="450">・耐震診断の指標：構造耐震指標 Is（強度×靱性×形状×経年）</text>
<text x="20" y="472">・免震レトロフィット：既存の建物の下部や中間に免震層を設ける</text>
<text x="20" y="494">・炭素繊維シートは柱の主筋方向ではなく、帯筋と同じ周方向に巻く</text>
<text x="20" y="514" font-size="11" fill="#4b5563">（せん断補強として効く。重ね長さ200mm以上、ラップ位置は分散）</text>
</g>
</svg>
