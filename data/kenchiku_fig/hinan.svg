<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs>
<rect width="480" height="520" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">直通階段までの歩行距離（令120条・121条）</text>
<rect x="30" y="44" width="420" height="170" fill="#f9fafb" stroke="#1f2937" stroke-width="2.5"/>
<rect x="30" y="130" width="420" height="34" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="240" y="152" text-anchor="middle" font-size="12" fill="#6b7280">廊下</text>
<line x1="210" y1="44" x2="210" y2="130" stroke="#1f2937" stroke-width="2"/>
<text x="120" y="70" text-anchor="middle" font-weight="700">居室</text>
<g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="30" y="164" width="70" height="50"/><rect x="380" y="164" width="70" height="50"/></g>
<g stroke="#2563eb" stroke-width="1"><path d="M40,170v38M50,170v38M60,170v38M70,170v38M80,170v38M90,170v38M390,170v38M400,170v38M410,170v38M420,170v38M430,170v38M440,170v38"/></g>
<text x="65" y="232" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">直通階段A</text>
<text x="415" y="232" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">直通階段B</text>
<circle cx="60" cy="90" r="6" fill="#dc2626"/>
<text x="72" y="95" font-size="12" fill="#dc2626">居室の最も遠い位置</text>
<path d="M60,96 V112 H180 V147" fill="none" stroke="#dc2626" stroke-width="5" opacity="0.35"/>
<path d="M60,96 V112 H180 V147" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M180,147 H75 V160" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
<path d="M180,147 H415 V160" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
<text x="222" y="106" font-size="12" fill="#dc2626" font-weight="700">重複区間</text>
<text x="222" y="122" font-size="11" fill="#dc2626">どちらへ逃げても通る部分</text>
<line x1="8" y1="252" x2="472" y2="252" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12" fill="#4b5563"><text x="20" y="274">居室の種類</text><text x="360" y="268" text-anchor="middle">準耐火構造</text><text x="360" y="282" text-anchor="middle">・不燃材料</text><text x="438" y="274" text-anchor="middle">その他</text></g>
<g font-size="12">
<text x="20" y="306">無窓居室、物販店舗・飲食店などの居室</text><text x="360" y="306" text-anchor="middle" font-weight="700">30m</text><text x="438" y="306" text-anchor="middle" font-weight="700">30m</text>
<text x="20" y="330">病院・ホテル・共同住宅などの居室</text><text x="360" y="330" text-anchor="middle" font-weight="700">50m</text><text x="438" y="330" text-anchor="middle" font-weight="700">30m</text>
<text x="20" y="354">それ以外（事務所など）の居室</text><text x="360" y="354" text-anchor="middle" font-weight="700">50m</text><text x="438" y="354" text-anchor="middle" font-weight="700">40m</text>
</g>
<text x="20" y="374" font-size="11" fill="#4b5563">物販店舗等＝法別表第1（い）欄(4)項、病院等＝(2)項の用途</text>
<line x1="8" y1="388" x2="472" y2="388" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="412">・準耐火・不燃の建物で、居室と通路の内装を準不燃</text>
<text x="34" y="432">→ 表の数値＋10m（15階以上の居室を除く）</text>
<text x="20" y="456">・15階以上の居室 → 表の数値−10m（内装準不燃なら表のまま）</text>
<text x="20" y="480">・2以上の直通階段が必要な階では、重複区間の長さは</text>
<text x="34" y="500">歩行距離の数値の1/2以下（令121条3項）</text>
</svg>
