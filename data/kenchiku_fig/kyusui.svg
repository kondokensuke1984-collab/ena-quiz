<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>
<rect width="480" height="520" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="700">給水方式と汚染防止</text>
<g font-size="11" text-anchor="middle" font-weight="700">
<text x="70" y="52">水道直結直圧</text><text x="190" y="52">水道直結増圧</text><text x="310" y="52">高置水槽</text><text x="420" y="52">ポンプ直送</text>
</g>
<line x1="20" y1="200" x2="460" y2="200" stroke="#2563eb" stroke-width="3"/>
<text x="24" y="216" font-size="10" fill="#2563eb">水道本管</text>
<g fill="#f3f4f6" stroke="#6b7280"><rect x="50" y="130" width="40" height="70"/><rect x="170" y="70" width="40" height="130"/><rect x="290" y="70" width="40" height="130"/><rect x="400" y="70" width="40" height="130"/></g>
<rect x="216" y="180" width="18" height="14" fill="#fde68a" stroke="#92400e"/><text x="225" y="176" font-size="9" text-anchor="middle">増圧</text>
<rect x="296" y="56" width="28" height="14" fill="#bfdbfe" stroke="#1d4ed8"/><text x="346" y="66" font-size="9">高置水槽</text>
<rect x="338" y="176" width="22" height="18" fill="#bfdbfe" stroke="#1d4ed8"/><text x="349" y="172" font-size="9" text-anchor="middle">受水槽</text>
<rect x="446" y="176" width="22" height="18" fill="#bfdbfe" stroke="#1d4ed8"/><text x="457" y="172" font-size="9" text-anchor="middle">受水槽</text>
<g stroke="#2563eb" stroke-width="2" fill="none"><path d="M70,200 V140"/><path d="M190,200 H225 V194 M225,180 V90 H190"/><path d="M310,200 H349 V194 M349,176 V62 H324 M310,62 V80"/><path d="M420,200 H457 V194 M457,176 V90 H420"/></g>
<g font-size="10" fill="#4b5563" text-anchor="middle"><text x="70" y="232">小規模</text><text x="190" y="232">中規模（受水槽なし）</text><text x="310" y="232">重力で給水</text><text x="420" y="232">圧力・流量を制御</text></g>
<line x1="8" y1="248" x2="472" y2="248" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="20" y="272" font-weight="700">吐水口空間（逆流の防止）</text>
<rect x="40" y="320" width="120" height="50" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/>
<line x1="40" y1="306" x2="160" y2="306" stroke="#1f2937" stroke-width="2" stroke-dasharray="4 3"/>
<text x="166" y="310" font-size="10">あふれ縁</text>
<path d="M60,286 H100 V290" fill="none" stroke="#1f2937" stroke-width="5"/>
<line x1="112" y1="292" x2="112" y2="306" stroke="#dc2626" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#b)"/>
<text x="210" y="290" font-size="12" fill="#dc2626" font-weight="700">吐水口空間</text>
<text x="210" y="308" font-size="11">吐水口の下端から、あふれ縁までの</text>
<text x="210" y="324" font-size="11">垂直距離。水槽・器具の水が給水管に</text>
<text x="210" y="340" font-size="11">逆流（逆サイホン）しないように確保</text>
<line x1="8" y1="384" x2="472" y2="384" stroke="#e5e7eb" stroke-width="1.5"/>
<g font-size="12">
<text x="20" y="408">・クロスコネクション（上水と他の配管の直結）は、逆止め弁を</text>
<text x="34" y="426">設けても禁止</text>
<text x="20" y="450">・受水槽は六面点検できるようにし、上部に他の配管を通さない</text>
<text x="20" y="474">・給水圧が高すぎるとウォーターハンマー・騒音の原因。高層では</text>
<text x="34" y="492">給水系統を上下に分ける（ゾーニング）か減圧弁を使う</text>
<text x="20" y="514">・水道直結増圧方式は、受水槽が不要で衛生的・省スペース</text>
</g>
</svg>
