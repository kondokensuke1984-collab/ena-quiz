<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4科演習 成績グラフ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    background: linear-gradient(135deg, #0c1a0f, #14532d, #0f2318);
    min-height: 100vh; color: #f0fdf4; padding: 16px;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px;
    cursor: pointer; text-decoration: none; margin-bottom: 16px;
  }
  .header { text-align: center; padding: 12px 0 20px; }
  .header h1 { font-size: 20px; font-weight: bold; }
  .header p { font-size: 13px; color: #86efac; margin-top: 4px; }
  .card {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 16px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 15px; font-weight: bold; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .chart-wrap { position: relative; height: 220px; }

  /* グラフの表示切替 */
  .mode-toggle { display: flex; gap: 4px; }
  .mode-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #86efac; border-radius: 10px; font-size: 11px; font-weight: bold;
    padding: 5px 10px; cursor: pointer;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, #15803d, #16a34a);
    border-color: rgba(74,222,128,0.5); color: #fff;
  }
  .chart-note { font-size: 10px; color: #4b7c5f; margin-top: 8px; text-align: center; line-height: 1.5; }

  /* 成績入力ボタン */
  .edit-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #15803d, #16a34a);
    border: none; border-radius: 16px; color: #fff;
    font-size: 15px; font-weight: bold; padding: 14px;
    cursor: pointer; width: 100%; margin-bottom: 16px;
  }
  .edit-btn:active { opacity: 0.85; }

  /* ケンケンアドバイス（Geminiに聞く） */
  .advice-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #4285f4, #34a853);
    border: none; border-radius: 16px; color: #fff;
    font-size: 15px; font-weight: bold; padding: 14px;
    cursor: pointer; width: 100%; margin-bottom: 16px;
  }
  .advice-btn:active { opacity: 0.85; }
  .advice-modal { max-width: 420px; }
  .advice-text {
    width: 100%; height: 140px; font-size: 11px; line-height: 1.5;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; color: #bbf7d0; padding: 8px; resize: none;
    font-family: inherit; -webkit-user-select: text; user-select: text;
  }
  .advice-gemini-btn {
    background: linear-gradient(135deg, #4285f4, #34a853); border: none;
    border-radius: 24px; color: #fff; font-size: 15px; font-weight: bold;
    padding: 12px 20px; cursor: pointer; width: 100%; margin-top: 10px;
  }
  .advice-sub-btns { display: flex; gap: 8px; margin-top: 10px; }
  .advice-sub-btns button {
    flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; color: #86efac; font-size: 13px; padding: 9px; cursor: pointer;
  }
  .advice-copied { font-size: 12px; color: #4ade80; text-align: center; min-height: 16px; margin-top: 6px; }

  /* 最新サマリー */
  .latest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-box .lbl { font-size: 11px; color: #86efac; margin-bottom: 4px; }
  .stat-box .val { font-size: 26px; font-weight: bold; }
  .rank-str { font-size: 11px; color: #86efac; margin-top: 2px; }
  .diff-up   { color: #4ade80; font-size: 11px; }
  .diff-down { color: #f87171; font-size: 11px; }
  .diff-same { color: #86efac; font-size: 11px; }

  /* テスト行（アコーディオン） */
  .test-list { display: flex; flex-direction: column; gap: 8px; }
  .test-row {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; overflow: hidden;
  }
  .test-row-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; cursor: pointer; user-select: none;
  }
  .test-row-left { display: flex; align-items: center; gap: 10px; }
  .test-date { font-size: 14px; font-weight: bold; }
  .test-filled-badge {
    font-size: 10px; color: #4ade80; background: rgba(74,222,128,0.15);
    border-radius: 8px; padding: 2px 7px;
  }
  .accordion-arrow { font-size: 12px; color: #86efac; transition: transform 0.2s; }
  .test-row.open .accordion-arrow { transform: rotate(180deg); }
  .test-row-body { display: none; padding: 0 12px 12px; }
  .test-row.open .test-row-body { display: block; }
  .test-row-actions { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .del-btn {
    background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3);
    color: #f87171; border-radius: 8px; font-size: 12px; padding: 3px 10px; cursor: pointer;
  }
  .test-row-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .field-group { display: flex; flex-direction: column; gap: 3px; }
  .field-group label { font-size: 10px; color: #86efac; }
  .field-group input {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #fff; font-size: 15px; padding: 6px 8px;
    text-align: center; width: 100%; -webkit-appearance: none;
  }
  .field-group input:focus { outline: none; border-color: #4ade80; background: rgba(74,222,128,0.1); }
  .field-group input.filled { border-color: rgba(255,255,255,0.3); }
  .field-group-label { font-size: 11px; color: #86efac; font-weight: bold; margin: 10px 0 6px; }

  /* ボタン */
  .add-test-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(74,222,128,0.1); border: 1px dashed rgba(74,222,128,0.4);
    color: #86efac; border-radius: 12px; font-size: 14px; padding: 12px;
    cursor: pointer; width: 100%; margin-top: 4px;
  }
  .save-btn {
    background: linear-gradient(135deg, #15803d, #16a34a); border: none;
    border-radius: 20px; color: #fff; font-size: 13px; font-weight: bold;
    padding: 10px 18px; cursor: pointer; width: 100%; margin-top: 14px;
  }
  .save-btn:disabled { opacity: 0.5; }
  .saved-toast { display: none; text-align: center; color: #4ade80; font-size: 13px; margin-top: 8px; }

  /* モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #0f2318; border: 1px solid rgba(74,222,128,0.3);
    border-radius: 20px; padding: 24px; width: 90%; max-width: 340px;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; text-align: center; }
  .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .modal-field label { font-size: 12px; color: #86efac; }
  .modal-field input {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px; color: #fff; font-size: 16px; padding: 10px 12px; width: 100%;
  }
  .modal-field input:focus { outline: none; border-color: #4ade80; }
  .modal-hint { font-size: 11px; color: #4b7c5f; margin-bottom: 16px; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button { flex: 1; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; padding: 10px; cursor: pointer; }
  .modal-cancel { background: rgba(255,255,255,0.1); color: #86efac; }
  .modal-ok { background: linear-gradient(135deg, #15803d, #16a34a); color: #fff; }

  /* テーブル */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: rgba(74,222,128,0.15); padding: 6px 3px; text-align: center; color: #bbf7d0; font-weight: bold; }
  td { padding: 7px 3px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
  tr:last-child td { border-bottom: none; }
  .no-data { color: #2d5a3d; }
  .c-sansu  { color: #60a5fa; }
  .c-kokugo { color: #f472b6; }
  .c-rika   { color: #4ade80; }
  .c-shakai { color: #fbbf24; }
  .c-total  { color: #a78bfa; }
  .c-hensa  { color: #c084fc; }
  .hensa-lbl { font-size: 10px; color: #d8b4fe; margin-top: 1px; }
</style>
</head>
<body>

<!-- 追加・編集モーダル -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 id="modalTitle">＋ テスト回を追加</h2>
    <div class="modal-field">
      <label>表示用ラベル（実施日）</label>
      <input type="text" id="newLabel" placeholder="例：2026/06/24">
    </div>
    <div class="modal-field">
      <label>グラフ用の短い表示</label>
      <input type="text" id="newDate" placeholder="例：6/24">
    </div>
    <p class="modal-hint">※ グラフの横軸に表示される短い日付です</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-ok" id="modalOkBtn" onclick="confirmAdd()">追加する</button>
    </div>
  </div>
</div>

<!-- ケンケンアドバイス モーダル -->
<div class="modal-overlay" id="adviceModal">
  <div class="modal advice-modal">
    <h2>🤖 ケンケンアドバイス</h2>
    <div id="adviceBody"></div>
  </div>
</div>

<!-- ========== メイン画面 ========== -->
<div id="view-main">
  <a href="/" class="back-btn">← アプリに戻る</a>
  <div class="header">
    <h1>📝 4科演習</h1>
    <p>ena 成績グラフ</p>
  </div>

  <button class="edit-btn" onclick="showEdit()">✏️ 成績を入力する</button>
  <button class="advice-btn" onclick="openAdviceModal()">🤖 ケンケンアドバイス</button>

  <!-- 最新サマリー -->
  <div class="card" id="latestCard">
    <div class="card-title" id="latestTitle">⭐ 最新の結果</div>
    <div class="latest-grid" id="latestGrid"></div>
  </div>

  <!-- 合計得点推移 -->
  <div class="card">
    <div class="card-title">📈 4科目合計 得点の推移</div>
    <div class="chart-wrap"><canvas id="totalChart"></canvas></div>
  </div>

  <!-- 各科目得点推移 -->
  <div class="card">
    <div class="card-title">📚 各科目 得点の推移</div>
    <div class="chart-wrap" style="height:260px;"><canvas id="subjectChart"></canvas></div>
  </div>

  <!-- 偏差値推移 -->
  <div class="card">
    <div class="card-title">
      <span>🎯 偏差値の推移</span>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeBtnAll"  onclick="setHensaMode('all')">ぜんぶ</button>
        <button class="mode-btn" id="modeBtnSougou" onclick="setHensaMode('sougou')">4科目</button>
        <button class="mode-btn" id="modeBtnKamoku" onclick="setHensaMode('kamoku')">科目別</button>
      </div>
    </div>
    <div class="chart-wrap" style="height:300px;"><canvas id="hensaChart"></canvas></div>
    <div class="chart-note">※ 太い線が4科目、細い線が各科目です<br>凡例をタップすると、その線だけ消したり出したりできます</div>
  </div>

  <!-- 順位の推移 -->
  <div class="card">
    <div class="card-title">
      <span>🏅 順位の推移</span>
      <div class="mode-toggle" id="rankToggle">
        <button class="mode-btn active" id="modeBtnJuni" onclick="setRankMode('juni')">順位</button>
        <button class="mode-btn" id="modeBtnPct" onclick="setRankMode('pct')">上位%</button>
      </div>
    </div>
    <div class="chart-wrap" style="height:260px;"><canvas id="rankChart"></canvas></div>
    <div id="rankDiff" style="margin-top:10px;"></div>
    <div class="chart-note" id="rankNote"></div>
  </div>

  <!-- テスト一覧 -->
  <div class="card">
    <div class="card-title">📋 テスト一覧</div>
    <div style="overflow-x:auto;"><table id="resultTable"></table></div>
  </div>
</div>

<!-- ========== 入力画面 ========== -->
<div id="view-edit" style="display:none;">
  <a href="#" class="back-btn" onclick="showMain();return false;">← 戻る</a>
  <div class="header" style="padding:8px 0 16px;">
    <h1>✏️ 成績を入力する</h1>
  </div>

  <div class="card">
    <div class="test-list" id="inputList"></div>
    <button class="add-test-btn" onclick="openModal()">＋ 新しいテスト回を追加</button>
    <button class="save-btn" id="saveBtn" onclick="saveAll()">💾 保存してグラフを更新</button>
    <div id="syncStatus" style="font-size:12px;color:#86efac;text-align:center;margin-top:8px;"></div>
    <div class="saved-toast" id="toast">✅ 保存完了！全員に反映されました</div>
  </div>
</div>

<script>
const FIELD_GROUPS = [
  {
    label: '🏆 合計得点・順位',
    fields: [
      { key: 'tokuten4', label: '4科目得点（自動）', step: '1', min: 0, max: 500, calc: true },
      { key: 'juni4',    label: '4科目順位（位）', step: '1', min: 1, max: 9999 },
      { key: 'ninzu4',   label: '4科目受験者数',  step: '1', min: 1, max: 9999 },
    ]
  },
  {
    label: '📝 各科目の得点',
    fields: [
      { key: 'sansu_ten',  label: '算数得点', step: '1', min: 0, max: 200 },
      { key: 'kokugo_ten', label: '国語得点', step: '1', min: 0, max: 200 },
      { key: 'rika_ten',   label: '理科得点', step: '1', min: 0, max: 200 },
      { key: 'shakai_ten', label: '社会得点', step: '1', min: 0, max: 200 },
    ]
  },
  {
    label: '🎯 偏差値',
    fields: [
      { key: 'hensa4',       label: '4科目偏差値', step: '0.1', min: 20, max: 80 },
      { key: 'sansu_hensa',  label: '算数偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'kokugo_hensa', label: '国語偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'rika_hensa',   label: '理科偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'shakai_hensa', label: '社会偏差値',  step: '0.1', min: 20, max: 80 },
    ]
  }
];
const FIELDS = FIELD_GROUPS.flatMap(g => g.fields);
const EMPTY_ROW = () => Object.fromEntries(FIELDS.map(f => [f.key, null]));

let data = {}, currentSha = null, tests = [];
let totalChart, subjectChart, hensaChart, rankChart;
let selectedIdx = -1;
let hensaMode = 'all';   // 'all' / 'sougou'(4科目のみ) / 'kamoku'(科目別のみ)
let rankMode  = 'juni';  // 'juni' = 順位 / 'pct' = 上位%

function setHensaMode(mode) {
  hensaMode = mode;
  ['all','sougou','kamoku'].forEach(m => {
    const id = { all: 'modeBtnAll', sougou: 'modeBtnSougou', kamoku: 'modeBtnKamoku' }[m];
    document.getElementById(id).classList.toggle('active', m === mode);
  });
  renderCharts();
}
function setRankMode(mode) {
  rankMode = mode;
  document.getElementById('modeBtnJuni').classList.toggle('active', mode === 'juni');
  document.getElementById('modeBtnPct').classList.toggle('active', mode === 'pct');
  renderRankChart();
}

// ---- 画面切り替え ----
function showMain() {
  document.getElementById('view-main').style.display = '';
  document.getElementById('view-edit').style.display = 'none';
  window.scrollTo(0, 0);
}
function showEdit() {
  document.getElementById('view-main').style.display = 'none';
  document.getElementById('view-edit').style.display = '';
  renderInputs();
  window.scrollTo(0, 0);
}

// ---- モーダル ----
let editingDate = null;

function openModal() {
  editingDate = null;
  document.getElementById('newLabel').value = '';
  document.getElementById('newDate').value = '';
  document.getElementById('modalTitle').textContent = '＋ テスト回を追加';
  document.getElementById('modalOkBtn').textContent = '追加する';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('newLabel').focus(), 100);
}
function editTest(date) {
  const t = tests.find(t => t.date === date);
  if (!t) return;
  editingDate = date;
  document.getElementById('newLabel').value = t.label;
  document.getElementById('newDate').value = t.date;
  document.getElementById('modalTitle').textContent = '✏️ テスト回を編集';
  document.getElementById('modalOkBtn').textContent = '保存する';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('newLabel').focus(), 100);
}
function closeModal() {
  document.getElementById('addModal').classList.remove('open');
  editingDate = null;
}
function confirmAdd() {
  const label = document.getElementById('newLabel').value.trim();
  const date  = document.getElementById('newDate').value.trim();
  if (!label || !date) { alert('両方入力してください'); return; }

  if (editingDate) {
    // 編集モード
    if (date !== editingDate && tests.find(t => t.date === date)) {
      alert('その日付はすでに存在します'); return;
    }
    const idx = tests.findIndex(t => t.date === editingDate);
    tests[idx] = { date, label };
    if (date !== editingDate) {
      data[date] = data[editingDate];
      delete data[editingDate];
    }
  } else {
    // 追加モード
    if (tests.find(t => t.date === date)) { alert('その日付はすでに存在します'); return; }
    tests.push({ date, label });
    data[date] = EMPTY_ROW();
  }
  closeModal();
  renderInputs();
}

// ---- 削除 ----
function deleteTest(date) {
  if (!confirm(`「${date}」の回を削除しますか？`)) return;
  tests = tests.filter(t => t.date !== date);
  delete data[date];
  renderInputs();
  renderAll();
}

function toggleAccordion(date) {
  document.getElementById(`row_${date}`).classList.toggle('open');
}

// ---- Cloud ----
function setStatus(msg, isError) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.style.color = isError ? '#f87171' : '#86efac';
}

async function loadFromCloud() {
  setStatus('⏳ データを読み込み中...');
  try {
    const r = await fetch('/api/yonka');
    if (!r.ok) throw new Error(r.status);
    const { data: d, sha } = await r.json();
    data = d; currentSha = sha;
    tests = Array.isArray(d._tests) ? d._tests : [];
    setStatus('✅ 読み込み完了');
  } catch(e) {
    setStatus('⚠️ 読み込み失敗', true);
    tests = []; data = { _tests: [] };
  }
  renderAll();
}

async function saveAll() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '⏳ 保存中...';
  const inputList = document.getElementById('inputList');
  tests.forEach((t, idx) => {
    const rows = inputList.querySelectorAll('.test-row');
    const row = rows[idx];
    const rowData = {};
    FIELDS.forEach(f => {
      const el = row ? row.querySelector(`input[data-key="${f.key}"]`) : null;
      if (!el) return;
      const v = parseFloat(el.value);
      rowData[f.key] = isNaN(v) ? null : v;
    });
    data[t.date] = rowData;
  });
  data._tests = tests;
  try {
    const r = await fetch('/api/yonka', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data, sha: currentSha }),
    });
    if (!r.ok) throw new Error(await r.text());
    const res = await r.json();
    currentSha = res.sha;
    setStatus('✅ 保存完了・全員に反映されました');
    renderAll();
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; showMain(); }, 1500);
  } catch(e) {
    setStatus('❌ 保存失敗: ' + e.message, true);
  }
  btn.disabled = false; btn.textContent = '💾 保存してグラフを更新';
}

// ---- 自動合計計算 ----
function autoCalcTotal(date) {
  const keys = ['sansu_ten', 'kokugo_ten', 'rika_ten', 'shakai_ten'];
  const vals = keys.map(k => parseFloat(document.getElementById(`inp_${date}_${k}`)?.value));
  const allFilled = vals.every(v => !isNaN(v));
  const el = document.getElementById(`inp_${date}_tokuten4`);
  if (!el) return;
  if (allFilled) {
    const sum = vals.reduce((a, b) => a + b, 0);
    el.value = sum;
    el.classList.add('filled');
  } else {
    el.value = '';
    el.classList.remove('filled');
  }
}

// ---- 入力フォーム ----
const SUBJECT_KEYS = ['sansu_ten', 'kokugo_ten', 'rika_ten', 'shakai_ten'];

function renderInputs() {
  const list = document.getElementById('inputList');
  list.innerHTML = '';
  tests.forEach((t, idx) => {
    const d = data[t.date] || {};
    const isLatest = idx === tests.length - 1;
    const filledCount = FIELDS.filter(f => d[f.key] != null).length;
    const badge = filledCount > 0 ? `<span class="test-filled-badge">✓ ${filledCount}項目入力済</span>` : '';
    const div = document.createElement('div');
    div.className = 'test-row' + (isLatest ? ' open' : '');
    div.id = `row_${t.date}`;

    // フィールドHTML（data-key属性でID不要に）
    const fieldsHtml = FIELD_GROUPS.map(g => {
      const rowsHtml = g.fields.map(f => {
        const isCalc = !!f.calc;
        const val = d[f.key] != null ? d[f.key] : '';
        const filled = val !== '' ? 'filled' : '';
        const readonly = isCalc ? 'readonly style="opacity:0.6;background:rgba(74,222,128,0.08);cursor:default;"' : '';
        const placeholder = isCalc ? '自動計算' : '—';
        return `<div class="field-group">
          <label>${f.label}</label>
          <input type="number" step="${f.step}" min="${f.min}" max="${f.max}"
            data-key="${f.key}" value="${val}" placeholder="${placeholder}"
            class="${filled}" ${readonly}>
        </div>`;
      }).join('');
      return `<div class="field-group-label">${g.label}</div>
              <div class="test-row-fields">${rowsHtml}</div>`;
    }).join('');

    div.innerHTML = `
      <div class="test-row-header" onclick="toggleAccordion('${t.date}')">
        <div class="test-row-left">
          <span class="test-date">📅 ${t.label}</span>${badge}
        </div>
        <span class="accordion-arrow">▼</span>
      </div>
      <div class="test-row-body">
        <div class="test-row-actions">
          <button class="del-btn" style="margin-right:6px;" onclick="editTest('${t.date}')">✏️ 編集</button>
          <button class="del-btn" onclick="deleteTest('${t.date}')">削除</button>
        </div>
        ${fieldsHtml}
      </div>
    `;
    list.appendChild(div);

    // data-key属性でinputを取得してイベントを付ける
    const getInp = key => div.querySelector(`input[data-key="${key}"]`);
    const totalEl = getInp('tokuten4');
    const subjectEls = SUBJECT_KEYS.map(k => getInp(k));

    // 合計を再計算する共通関数
    function recalcTotal() {
      const vals = subjectEls.map(e => e ? parseFloat(e.value) : NaN);
      if (vals.every(v => !isNaN(v))) {
        totalEl.value = vals.reduce((a, b) => a + b, 0);
        totalEl.classList.add('filled');
      } else {
        totalEl.value = '';
        totalEl.classList.remove('filled');
      }
    }

    subjectEls.forEach(el => {
      if (!el) return;
      el.addEventListener('input', () => {
        el.classList.toggle('filled', el.value !== '');
        recalcTotal();
      });
    });

    // 読み込み済みデータがあれば即計算
    recalcTotal();

    // 順位・受験者数のfilledトグル
    FIELDS.filter(f => !f.calc && !SUBJECT_KEYS.includes(f.key)).forEach(f => {
      const el = getInp(f.key);
      if (el) el.addEventListener('input', () => el.classList.toggle('filled', el.value !== ''));
    });
  });
}

// 最新回の順位を前回と比べて表示
function renderRankDiff() {
  const el = document.getElementById('rankDiff');
  let curIdx = -1;
  tests.forEach((t, i) => { if ((data[t.date] || {}).juni4 != null) curIdx = i; });
  if (curIdx < 0) { el.innerHTML = ''; return; }

  const cur = data[tests[curIdx].date];
  let prev = null;
  for (let i = curIdx - 1; i >= 0; i--) {
    const d = data[tests[i].date];
    if (d && d.juni4 != null) { prev = d; break; }
  }

  let diffHtml = '';
  if (prev) {
    const v = prev.juni4 - cur.juni4;   // 順位は数字が減ると good
    if (v > 0)      diffHtml = `<div class="diff-up">↑ ${v}人ぬいた</div>`;
    else if (v < 0) diffHtml = `<div class="diff-down">↓ ${Math.abs(v)}人ぬかれた</div>`;
    else            diffHtml = `<div class="diff-same">→ 前回と同じ</div>`;
  }
  const pct = cur.ninzu4 ? +(cur.juni4 / cur.ninzu4 * 100).toFixed(1) : null;

  el.innerHTML = `
    <div class="stat-box">
      <div class="lbl">${tests[curIdx].label} の4科目順位</div>
      <div class="val" style="color:#a78bfa;">${cur.juni4}<span style="font-size:13px;">位</span></div>
      ${cur.ninzu4 != null ? `<div class="rank-str">/ ${cur.ninzu4}人中　上位 ${pct}%</div>` : ''}
      ${diffHtml}
    </div>`;
}

// 値が無い項目は書かない（—を並べてもAIには意味がないため）
function advicePart(d, m) {
  const h     = m.h     ? d[m.h]     : null;
  const ten   = m.ten   ? d[m.ten]   : null;
  const juni  = m.juni  ? d[m.juni]  : null;
  const ninzu = m.ninzu ? d[m.ninzu] : null;
  if (h == null && ten == null && juni == null) return null;

  const detail = [];
  if (ten != null) detail.push(ten + '点');
  if (juni != null) {
    detail.push(ninzu ? `${juni}位/${ninzu}人・上位${(juni / ninzu * 100).toFixed(1)}%` : `${juni}位`);
  }
  return m.label + (h != null ? `偏差値${h}` : '')
       + (detail.length ? `（${detail.join('・')}）` : '');
}

function adviceRowText(date) {
  const d = data[date] || {};
  const totals = ADVICE_META.totals.map(m => advicePart(d, m)).filter(Boolean);
  const subs   = ADVICE_META.subjects.map(m => advicePart(d, m)).filter(Boolean);
  if (!totals.length && !subs.length) return null;
  return [totals.join(' / '), subs.join(' ')].filter(s => s).join('  ／  ');
}

}

function renderAll() { renderLatest(); renderTable(); renderCharts(); }

loadFromCloud();
