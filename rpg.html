<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  :root{ --ink:#1e1b4b; --card:#ffffff; --line:#c7d2fe; }
  *{ -webkit-tap-highlight-color: transparent; }
  body{
    font-family:'M PLUS Rounded 1c',sans-serif; color:var(--ink); margin:0;
    background:linear-gradient(160deg,#1e1b4b 0%,#312e81 45%,#4c1d95 100%);
    min-height:100vh;
  }
  #app{ max-width:480px; margin:0 auto; padding:0 12px 40px; }
  .scr{ display:none; }
  .scr.on{ display:block; animation:fade .18s ease-out; }
  /* 🌲 まよいの森 */
  .fz-view{ display:grid; grid-template-columns:repeat(9,1fr); gap:2px; margin-top:10px; padding:4px; background:#052e16; border-radius:16px; }
  .fz-cell{ aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:clamp(14px,5.2vw,26px); overflow:hidden; }
  .fz-cell svg{ width:92%; height:92%; }
  .fz-pad{ display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(3,52px); gap:4px; }
  .fz-pad button{ border:0; border-radius:14px; background:rgba(255,255,255,.9); font-size:20px; font-weight:800; color:#14532d; box-shadow:0 3px 0 rgba(0,0,0,.25); touch-action:manipulation; }
  .fz-pad button:active{ transform:translateY(2px); box-shadow:none; }
  .fz-mapwrap{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  /* にげる：まちがえて おさないよう 上のすみに 小さく（押すと たしかめ＝askFlee） */
  .flee-btn{ font-size:11px; font-weight:800; color:#64748b; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:999px; padding:3px 10px; cursor:pointer; white-space:nowrap; }
  /* 計算メモ：暗い背景のモーダルをやめて、問題といっしょに見える「下シート／右パネル」に */
  .rpgmemo-wrap{ position:fixed; left:0; right:0; bottom:0; height:50vh; padding:0 8px 8px; display:flex; z-index:55; pointer-events:none; }
  .rpgmemo-wrap.big{ height:65vh; }
  .rpgmemo-panel{ pointer-events:auto; flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; padding:10px 12px 12px; box-shadow:0 -6px 24px rgba(0,0,0,.35); }
  .rpgmemo-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .rpgmemo-header > div{ display:flex; align-items:center; gap:4px; }
  .rpgmemo-header button:not(.btn-main){ background:none; border:0; font-size:20px; padding:4px 8px; cursor:pointer; }
  .rpgmemo-cwrap{ flex:1; min-height:0; position:relative; }
  #rpgmemo-canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:#fff; border:2px solid var(--line); border-radius:12px; cursor:crosshair; box-sizing:border-box; }
  body.memo-open #app{ padding-bottom:calc(50vh + 16px); }
  body.memo-open.memo-big #app{ padding-bottom:calc(65vh + 16px); }
  @media (min-width:900px) and (orientation:landscape){
    .rpgmemo-wrap, .rpgmemo-wrap.big{ left:auto; right:12px; top:12px; bottom:12px; height:auto; width:calc(100vw - 540px); min-width:360px; padding:0; }
    .rpgmemo-panel{ box-shadow:0 8px 24px rgba(0,0,0,.28); }
    #rpgmemo-size{ display:none; }
    body.memo-open #app, body.memo-open.memo-big #app{ margin-left:12px; margin-right:auto; padding-bottom:40px; }
  }
  .fz-mini{ display:grid; gap:1px; width:min(78vw,320px); margin:10px auto 6px; background:#0f172a; padding:2px; border-radius:8px; }
  .fz-mini i{ aspect-ratio:1; display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .panel{ background:var(--card); border-radius:18px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.28); }
  .btn{
    display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line);
    border-radius:14px; padding:13px 15px; font-weight:700; margin-bottom:9px; cursor:pointer;
    transition:transform .08s, border-color .12s;
  }
  .btn:active{ transform:scale(.985); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn.ok{ background:#bbf7d0; border-color:#22c55e; }
  .btn.ng{ background:#fecaca; border-color:#ef4444; }
  .btn-main{
    display:block; width:100%; text-align:center; border:none; border-radius:14px; padding:15px;
    font-weight:800; font-size:17px; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#8b5cf6,#6366f1); box-shadow:0 6px 16px rgba(99,102,241,.45);
  }
  .btn-main:active{ transform:scale(.985); }
  .hpbar{ height:13px; border-radius:99px; background:#e5e7eb; overflow:hidden; }
  .hpbar > i{ display:block; height:100%; border-radius:99px; transition:width .45s cubic-bezier(.2,.8,.2,1); }
  .qimg{ display:block; max-width:100%; max-height:300px; margin:10px auto; border-radius:10px; }
  .shake{ animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:none} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
  .pop{ animation:pop .45s; }
  @keyframes pop{ 0%{transform:scale(1)} 35%{transform:scale(1.12) rotate(-3deg)} 100%{transform:scale(1)} }
  .dmg{
    position:absolute; left:50%; top:26%; transform:translateX(-50%);
    font-size:32px; font-weight:800; color:#fde047; text-shadow:0 2px 0 #b45309,0 0 12px rgba(0,0,0,.5);
    animation:dmg .9s forwards; pointer-events:none;
  }
  @keyframes dmg{ 0%{opacity:0; transform:translate(-50%,10px) scale(.7)} 25%{opacity:1; transform:translate(-50%,-12px) scale(1.15)} 100%{opacity:0; transform:translate(-50%,-54px) scale(1)} }
  #levelup{
    display:none; position:fixed; inset:0; z-index:60; background:rgba(30,27,75,.88);
    align-items:center; justify-content:center; padding:20px;
  }
  #levelup.on{ display:flex; }
  .gem{ font-size:12px; font-weight:800; padding:2px 9px; border-radius:99px; background:#ede9fe; color:#5b21b6; }
  .lock{ filter:grayscale(1); opacity:.5; }
  textarea{ font-family:inherit; }

<script>
// ════════════════════════════════════════════════════════════
//  ANRINO クエスト — 月ごとのミニRPG（毎月6日に新しい月へ切りかえ）
//  問題データ : data/questions_<月>.json（index.html から機械抽出。月の一覧は data/quest_months.json）
//  キャラ描画 : js/chars.js の render*SVG（silhouette 対応）
// ════════════════════════════════════════════════════════════

// ── かげのモンスターの顔を「悪者」にする ──────────────────────
// chars.js の petEyes / petWrapSVG を実行時に差し替える。render*SVG は
// 名前で呼ぶので、window 側を入れかえれば18体すべてに効く。
// （renderLunaSVG だけ petEyes を使っていないので、主人公の顔は変わらない）
(function () {
  const origEyes = window.petEyes;
  const origWrap = window.petWrapSVG;
  let face = null;                       // 直前に描いた「かげの目」の位置
  const n = (v) => (+v).toFixed(1);

  window.petEyes = function (c, sil, lx, rx, y, r, ring) {
    if (!sil) { face = null; return origEyes(c, sil, lx, rx, y, r, ring); }
    face = { lx: lx, rx: rx, y: y, r: r, lid: c.skin };
    const glow = (cx) =>
      `<ellipse cx="${cx}" cy="${y}" rx="${n(r * 2.2)}" ry="${n(r * 2.4)}" fill="#ef4444" opacity="0.16"/>`;
    const eye = (cx) =>
      `<ellipse cx="${cx}" cy="${y}" rx="${r}" ry="${n(r * 1.25)}" fill="#e11d48"/>` +
      `<ellipse cx="${cx}" cy="${n(y - r * 0.28)}" rx="${n(r * 0.40)}" ry="${n(r * 0.48)}" fill="#ffe4e6" opacity="0.85"/>`;
    return glow(lx) + glow(rx) + eye(lx) + eye(rx);
  };

  // 本体を描いたあと、いちばん上に「つり目」と「まゆ」を重ねる
  window.petWrapSVG = function (L, size, bg, deco, body) {
    let extra = '';
    if (face) { extra = villainFace(face); face = null; }
    return origWrap(L, size, bg, deco, body + extra);
  };

  function villainFace(f) {
    const r = f.r, y = f.y;
    // 目の内がわ上を本体と同じ色でけずって、つり目にする
    const cut = (cx, d) =>
      `<path d="M${n(cx - d * r * 1.35)} ${n(y - r * 1.7)} L${n(cx + d * r * 1.45)} ${n(y - r * 1.7)} ` +
      `L${n(cx + d * r * 1.45)} ${n(y + r * 0.25)} Z" fill="${f.lid}"/>`;
    // つり上がったまゆ
    const brow = (cx, d) =>
      `<path d="M${n(cx - d * r * 1.5)} ${n(y - r * 2.5)} L${n(cx + d * r * 1.6)} ${n(y - r * 1.25)}" ` +
      `stroke="#3b0764" stroke-width="${n(r * 0.7)}" stroke-linecap="round" fill="none"/>`;
    return cut(f.lx, 1) + cut(f.rx, -1) + brow(f.lx, 1) + brow(f.rx, -1);
  }
})();

const SAVE_KEY = 'anrino_rpg_v1';

// 17単元 ↔ 17体。ルナ（主人公）とカブたろう（ボス）は除いてある。
const MONSTER_POOL = ['tanuki','parrot','owl','neko','penguin','sheep','frog','snail','duck',
                      'squirrel','turtle','fox','dolphin','elephant','hedgehog','panda','hamster'];
const CHAR_NAME = {
  tanuki:'タヌキ', parrot:'インコ', owl:'フクロウ', neko:'ネコ', penguin:'ペンギン',
  sheep:'ヒツジ', frog:'カエル', snail:'カタツムリ', duck:'アヒル', squirrel:'リス',
  turtle:'カメ', fox:'キツネ', dolphin:'イルカ', elephant:'ゾウ', hedgehog:'ハリネズミ',
  panda:'パンダ', hamster:'ハムスター', kabu:'カブたろう', luna:'ルナ'
};
const BOSS_KEY = 'kabu';

const MAX_Q_PER_BATTLE = 8;   // 1体あたり最大8問
const DMG_HIT = 10, DMG_CRIT = 15, DMG_TAKE = 10, HP_BASE = 30, HP_PER_LV = 5;
const EXP_HIT = 10, EXP_WIN = 50;

// ── 🪙 アンリノメダル（クイズアプリ・島と共通の台帳 ena_anrino_medals） ──────────
//   ・はじめて正解した問題は1枚（クイズと同じ「led.first」を使うので、クイズで正解ずみの問題はもらえない＝二重取りなし）
//   ・かげモンスターを はじめて たおすと ボーナス（ステージ3枚・ボス10枚）
//   台帳の形はクイズ側（index.html の medalFirstCorrect / medalAward）と同じ。数を減らす処理は書かない。
const MEDAL_KEY = 'ena_anrino_medals';
let MEDAL_MONTH = '202609';   // クエストの月。boot() の pickQuestMonth() が決める（森・タイムトライアルも この月）

// ── クエストの月：その月の6日から新しい月にする（manifest にある月だけ。問題の数は見ない）──
//   localhost だけ ?month=202610 で月を、?today=2026-10-06 で日付を差しかえて確かめられる
const QUEST_SWITCH_DAY = 6;
const QUEST_IS_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
function pickQuestMonth(months) {
  const qp = new URLSearchParams(location.search);
  if (QUEST_IS_LOCAL && months.includes(qp.get('month'))) return qp.get('month');
  let d = new Date();
  if (QUEST_IS_LOCAL && /^\d{4}-\d{1,2}-\d{1,2}$/.test(qp.get('today') || '')) {
    const [y, m, dd] = qp.get('today').split('-').map(Number); d = new Date(y, m - 1, dd);
  }
  if (d.getDate() < QUEST_SWITCH_DAY) d = new Date(d.getFullYear(), d.getMonth() - 1, 1);
  const target = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0');
  const ok = months.filter(m => m <= target).sort();
  return ok.length ? ok[ok.length - 1] : '202609';
}
function questMonthLabel(m) { return SCHOOL_QUEST ? SCHOOL_QUEST.label : Number(String(m).slice(4, 6)) + '月'; }
// 島の しゅじんこうで きまった がっこう（ena_school_v1。りの＝栄光・ゆうせい＝2年生）。ena・きまっていない ときは null
function questSchool() {
  try { const s = (JSON.parse(localStorage.getItem('ena_school_v1') || 'null') || {}).school; return s === 'eikoh' || s === 'g2' ? s : null; } catch (e) { return null; }
}
let SCHOOL_QUEST = null;   // 栄光・2年生の子の クエスト { label, months }（data/quest_schools.json）。null＝ena の月
// つきのぬしは月ごと（前は bossDown:true だけ＝9月ぶん）
function bossDownNow() {
  return !!((save.bossMonths || {})[MEDAL_MONTH] || (save.bossDown && MEDAL_MONTH === '202609'));
}
const MEDAL_STAGE_CLEAR = 3, MEDAL_BOSS_CLEAR = 10;
// 🪙 クリアずみの ステージを ぜんもん せいかいで たおすと 🪙1（過去問は2）。1ステージ1日1回、1日の上限あり
const MEDAL_REPLAY = 1, MEDAL_REPLAY_DAY_CAP = 5;
// 🪙×2：過去問演習（単元の「_kakomon」）の問題・ステージは メダルが 2ばい
const KAKOMON_X = 2;
function isKakomon(subj) {
  return /_kakomon$/.test(subj || '') || ((typeof SUBJECTS === 'object' && SUBJECTS[subj]) || {}).label === '過去問演習';
}
function medalX(subj) { return isKakomon(subj) ? KAKOMON_X : 1; }
function loadMedalLedger() {
  try {
    const d = JSON.parse(localStorage.getItem(MEDAL_KEY) || '{}');
    return (d && typeof d.units === 'object' && d.units) ? d : { units: {} };
  } catch (e) { return { units: {} }; }
}
function saveMedalLedger(led) { try { localStorage.setItem(MEDAL_KEY, JSON.stringify(led)); } catch (e) {} }
function medalTotal() {
  const u = loadMedalLedger().units;
  return Object.keys(u).reduce((a, k) => a + (Number(u[k]) > 0 ? Math.floor(u[k]) : 0), 0);
}
function medalFirstCorrect(q) {
  if (!q || !q.id) return 0;
  const led = loadMedalLedger();
  led.first = (led.first && typeof led.first === 'object') ? led.first : {};
  if (led.first[q.id]) return 0;
  led.first[q.id] = 1;
  const key = (q.month || MEDAL_MONTH) + '|first:' + (q.subject || '');
  const n = medalX(q.subject);
  led.units[key] = (led.units[key] || 0) + n;
  saveMedalLedger(led);
  return n;
}
function medalQuestClear(stageKey, count) {
  const led = loadMedalLedger();
  const key = MEDAL_MONTH + '|quest:' + stageKey;
  if (led.units[key]) return 0;
  led.units[key] = count;
  saveMedalLedger(led);
  return count;
}
function replayPrefix() { return MEDAL_MONTH + '|replay:' + todayKey() + '|'; }
function replayTodayTotal(led) {
  const u = (led || loadMedalLedger()).units, pre = replayPrefix();
  return Object.keys(u).reduce((a, k) => a + (k.indexOf(pre) === 0 ? (Number(u[k]) || 0) : 0), 0);
}
// 'ok'＝まだ もらえる／'got'＝きょう この ステージは もらった／'cap'＝きょうの上限
function replayState(stageKey) {
  const led = loadMedalLedger();
  if (led.units[replayPrefix() + stageKey]) return 'got';
  return replayTodayTotal(led) >= MEDAL_REPLAY_DAY_CAP ? 'cap' : 'ok';
}
function medalReplay(stageKey, n) {
  const led = loadMedalLedger();
  const key = replayPrefix() + stageKey;
  if (led.units[key]) return 0;
  const give = Math.min(n, MEDAL_REPLAY_DAY_CAP - replayTodayTotal(led));
  if (!(give > 0)) return 0;
  led.units[key] = give;
  saveMedalLedger(led);
  return give;
}

// ── ⏱️ タイムトライアル（1日1回ずつ）──────────────────────────────
//   q30 ＝ えらんだステージを 1問30秒で。rush ＝ その月の問題ぜんぶから ランダムに 3分。
//   時間内に正解すると どの問題でも 🪙2（はじめての正解の1枚＋のこりを tt の枠へ）
const TT_Q_SEC = 30, TT_RUSH_SEC = 180;
let ttPick = false;      // 30秒トライアルの ステージを えらんでいるところ
let ttTimer = null;
function todayKey() { return new Date().toLocaleDateString('ja-JP'); }
function medalTT(n) {
  if (!(n > 0)) return;
  const led = loadMedalLedger();
  const key = MEDAL_MONTH + '|tt:' + todayKey();
  led.units[key] = (led.units[key] || 0) + n;
  saveMedalLedger(led);
}
function ttUsed(kind) { return save.tt && save.tt[kind] === todayKey(); }
function ttStart() {
  ttStop();
  ttTimer = setInterval(ttTick, 200);
  ttRender();
}
function ttStop() { if (ttTimer) { clearInterval(ttTimer); ttTimer = null; } }
function ttRemain() {
  if (!bt || !bt.tt) return 0;
  if (bt.tt === 'rush') return Math.max(0, (bt.endsAt - Date.now()) / 1000);
  const used = bt.qElapsed != null ? bt.qElapsed : (Date.now() - bt.qStart);
  return Math.max(0, TT_Q_SEC - used / 1000);
}
function ttRender() {
  const el = document.getElementById('tt-bar');
  if (!el) return;
  if (!bt || !bt.tt) { el.innerHTML = ''; return; }
  const total = bt.tt === 'rush' ? TT_RUSH_SEC : TT_Q_SEC;
  const r = ttRemain();
  const red = r <= 10;
  const sec = Math.ceil(r);
  const label = bt.tt === 'rush'
    ? '⏱️ のこり ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') + '　せいかい ' + bt.correct + 'もん'
    : '⏱️ のこり ' + Math.ceil(r) + 'びょう';
  el.innerHTML =
    '<div style="display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:' + (red ? '#dc2626' : '#b45309') + ';">' +
      '<span>' + label + '</span><span>じかん内 せいかい 🪙×2</span></div>' +
    '<div class="hpbar" style="height:8px; margin:4px 0 10px;"><i style="width:' + pct(r, total) + '%; background:' +
      (red ? 'linear-gradient(90deg,#ef4444,#f87171)' : 'linear-gradient(90deg,#f59e0b,#fbbf24)') + '; transition:width .2s linear;"></i></div>';
}
function ttTick() {
  if (!bt || !bt.tt || !document.getElementById('scr-battle').classList.contains('on')) { ttStop(); return; }
  if (bt.tt === 'rush' && Date.now() >= bt.endsAt) { endRush(); return; }
  if (bt.tt === 'q30' && !bt.answered && bt.qElapsed == null && Date.now() - bt.qStart > TT_Q_SEC * 1000) { ttTimeUp(); return; }
  ttRender();
}
function ttTimeUp() {
  if (bt.answered) return;
  bt.answered = true;
  bt.qElapsed = TT_Q_SEC * 1000;
  const q = bt.queue[bt.idx];
  document.getElementById('a-area').innerHTML =
    '<div style="background:#fee2e2; border-radius:12px; padding:12px; font-size:15px; font-weight:800; color:#b91c1c;">⏰ じかんぎれ…　こたえ：' + qHTML(q.answer != null && q.options ? q.options[q.answer] : q.answer) + '</div>';
  resolveTurn(false, q, true);
}
function logTT() {
  if (!bt || !bt.tt || bt.ttLogged) return;
  bt.ttLogged = true;
  const kind = bt.tt, info = { stage: stageLabel(), answered: bt.ttAnswered || 0, correct: bt.correct, medals: bt.ttMedals || 0 };
  questLogDay(d => { d.tt = d.tt || {}; d.tt[kind] = info; });
}
function startTT30() { if (ttUsed('q30')) return; ttPick = !ttPick; showMap(); }
function pickStage(key) { startBattle(key, ttPick ? 'q30' : null); }
function startRush() {
  if (ttUsed('rush')) return;
  ttPick = false;
  save.tt.rush = todayKey();
  if (save.hp <= 0) save.hp = maxHp();
  persist();
  bt = {
    boss: false, key: '__rush__', char: 'luna', name: '⏱️ 3ぷん チャレンジ',
    queue: shuffle(QUESTIONS.slice()), idx: 0, maxHp: 1, hp: 1,
    streak: 0, correct: 0, medals: 0, answered: false,
    tt: 'rush', endsAt: Date.now() + TT_RUSH_SEC * 1000, ttMedals: 0, ttIn: 0, ttAnswered: 0
  };

  setMsg('3ぷんで なんもん とけるかな？ よーい スタート！');

}
function endRush() {
  if (!bt || bt.tt !== 'rush' || bt.ended) return;
  bt.ended = true;
  ttStop();
  logTT();
  let lvUps = 0;
  while (save.exp >= needExp()) { save.exp -= needExp(); save.lv++; lvUps++; }
  if (lvUps) save.hp = maxHp();
  const best = bt.correct > (save.rushBest || 0);
  if (best) save.rushBest = bt.correct;
  persist();
  document.getElementById('result-body').innerHTML =
    '<div style="font-size:21px; font-weight:800; color:#b45309;">⏱️ タイムアップ！</div>' +
    '<div style="margin:12px 0; display:flex; justify-content:center;">' + CHARS.luna(Math.min(6, save.lv), 100, 130, {}) + '</div>' +
    '<div style="font-size:18px; font-weight:800;">3ぷんで ' + bt.correct + 'もん せいかい！</div>' +
    '<div style="font-size:13px; color:#64748b; margin-top:3px;">（' + (bt.ttAnswered || 0) + 'もん といた・さいこう ' + (save.rushBest || 0) + 'もん）</div>' +
    (best && bt.correct > 0 ? '<div style="font-size:16px; font-weight:800; color:#db2777; margin-top:6px;">🎉 しんきろく！</div>' : '') +
    '<div style="margin-top:10px; font-size:15px; font-weight:800; color:#b45309;">🪙 アンリノメダル +' + bt.medals + ' 枚' +
      '<div style="font-size:11.5px; color:#94a3b8; font-weight:700; margin-top:3px;">もっているメダル ' + medalTotal() + ' 枚（しまの ショップで つかえるよ）</div>' +

// ── 入力式（算数など）の答え合わせ ──────────────────────────────
//   「1と1/4」「1 1/4」「5/4」「１２個」などを数として比べる。分数の問題は約分できていないと ×
function toHalf(s) {
  return String(s).replace(/[０-９．／]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
}
function parseAnsVal(s) {
  s = toHalf(s).trim().replace(/\s*\.\s*/g, '.').replace(/と/g, ' ').replace(/\s+/g, ' ');   // 「1 .87」の すきまも OK
  let m = s.match(/^(-?\d+) (\d+)\/(\d+)$/);
  if (m) return +m[1] + +m[2] / +m[3];
  m = s.match(/^(-?\d+)\/(\d+)$/);
  if (m) return +m[1] / +m[2];
  const n = parseFloat(s.replace(/,/g, ''));
  return isNaN(n) ? null : n;
}
function checkInputAns(user, q) {
  const u = parseAnsVal(user), c = parseAnsVal(q.answer);
  if (u === null || c === null) return toHalf(user).trim() === String(q.answer).trim();
  if (Math.abs(u - c) > 1e-6) return false;
  if (q.mustReduce) {
    const m = toHalf(user).trim().replace(/と/g, ' ').replace(/\s+/g, ' ').match(/^(?:(\d+) )?(\d+)\/(\d+)$/);
    if (String(q.answer).includes('/') && !m) return false;          // 分数で答える問題に小数で答えた
    if (m) {
      const gcd = (x, y) => y ? gcd(y, x % y) : x;
      if (gcd(+m[2], +m[3]) !== 1 || (m[1] && +m[2] >= +m[3])) return false;
    }
  }
  return true;
}

let QUESTIONS = [], SUBJECTS = {}, STAGES = [];
let save = null;
let bt = null;                // 戦闘中の状態

// ── セーブ ──────────────────────────────────────────────────
function freshSave() {
  return { v:1, lv:1, exp:0, hp:HP_BASE, cleared:{}, seen:{}, wins:0, bossDown:false,
           tt:{ q30:'', rush:'' }, rushBest:0, bossMonths:{} };   // tt＝タイムトライアルを使った日（1日1回ずつ）
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1) return null;          // 将来バージョンが上がったらここで移行する
    const r = Object.assign(freshSave(), s);
    r.bossMonths = (s.bossMonths && typeof s.bossMonths === 'object') ? s.bossMonths : {};
    r.tt = Object.assign({ q30:'', rush:'' }, (s.tt && typeof s.tt === 'object') ? s.tt : {});
    return r;
  } catch (e) { return null; }
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
// ── 保護者レポート用の きろく（クイズの「📤 保護者に成績を送る」が読む）──
//   anrino_rpg_log_v1 = { v:1, days: { 'YYYY/M/D': { answered, correct, battles, wins, stages:{key:{label,answered,correct}}, wrong:[{id,stage,q}] } } }
const LOG_KEY = 'anrino_rpg_log_v1';
const LOG_KEEP_DAYS = 60;
const LOG_WRONG_MAX = 20;
function questLogDay(fn) {
  try {
    let log = JSON.parse(localStorage.getItem(LOG_KEY) || 'null');
    if (!log || log.v !== 1 || typeof log.days !== 'object') log = { v: 1, days: {} };
    const key = new Date().toLocaleDateString('ja-JP');
    const d = log.days[key] || { answered: 0, correct: 0, battles: 0, wins: 0, stages: {}, wrong: [] };
    fn(d);
    log.days[key] = d;
    const limit = Date.now() - LOG_KEEP_DAYS * 86400000;
    Object.keys(log.days).forEach(k => { const t = new Date(k).getTime(); if (t && t < limit) delete log.days[k]; });
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  } catch (e) { /* きろくに失敗しても クエストは止めない */ }
}
function stageLabel() {
  if (bt.forest) return bt.forest.boss ? '🌲 もりのぬし' : '🌲 まよいの森 B' + bt.forest.floor;
  if (bt.boss) return '👑 つきのぬし';
  if (bt.tt === 'rush') return '⏱️ 3ぷん トライアル';
  if (typeof DETECTIVE_KEY !== 'undefined' && bt.key === DETECTIVE_KEY) return '🔍 名探偵あんりの なぞとき';
  const st = STAGES.find(s => s.key === bt.key);
  return st ? st.groupLabel + '・' + st.label : bt.key;
}
// ── クイズの「⚠️ 苦手」「🔥 超苦手」「⭐ もう完璧」と つなぐ（2026-09-26）──
//   クエストの問題は クイズから作ったので ID と q.month が クイズと同じ。クイズ（index.html）と 同じキー・同じ形で書く。
//   ・まちがい（時間切れも）→ 苦手に入れる、3回で 超苦手。正解 → 苦手から外す・正解した日を記録。
//   ・ちがう日に2回 正解したら「⭐ もう完璧にする」ボタン。単元コンプリートの メダルと キャラの成長は
//     クイズを ひらいたときの medalSyncAll()・publishIslandFriends() が まとめて反映する（ここでは配らない）。
//   ・名探偵（det_）など クイズに ない問題は 書かない。
function qlLinked(q) { return !!(q && q.id && q.month && !String(q.id).startsWith('det_')); }
function qlGet(key, fb) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fb : v; } catch (e) { return fb; } }
function qlSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function qlToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function qlSetEdit(key, fn) { const a = qlGet(key, []); const set = new Set(Array.isArray(a) ? a : []); fn(set); qlSet(key, [...set]); }
function qlMastered(q) { const a = qlGet('ena_mastered_' + q.month, []); return Array.isArray(a) && a.includes(q.id); }
function qlCanMaster(q) {
  const list = (qlGet('ena_correct_days_' + q.month, {})[q.id]) || [], t = qlToday();
  return list.includes(t) && list.some(d => d !== t);
}
function quizLinkRecord(ok, q) {
  if (!qlLinked(q)) return;
  try {
    const m = q.month;
    if (ok) {
      qlSetEdit('ena_wrong_' + m, s => s.delete(q.id));
      const c = qlGet('ena_correct_count_' + m, {}); c[q.id] = (c[q.id] || 0) + 1; qlSet('ena_correct_count_' + m, c);
      const days = qlGet('ena_correct_days_' + m, {}), t = qlToday();
      const list = days[q.id] || [];
      if (!list.includes(t)) { list.push(t); days[q.id] = list; qlSet('ena_correct_days_' + m, days); }
    } else {
      qlSetEdit('ena_wrong_' + m, s => s.add(q.id));
      const w = qlGet('ena_wrong_count_' + m, {}); w[q.id] = (w[q.id] || 0) + 1; qlSet('ena_wrong_count_' + m, w);
      if (w[q.id] >= 3) qlSetEdit('ena_super_wrong_' + m, s => s.add(q.id));
    }
  } catch (e) { /* きろくに失敗しても クエストは止めない */ }
}
function quizLinkMasterBtn(ok, q) {
  if (!ok || !qlLinked(q) || qlMastered(q) || !qlCanMaster(q)) return '';
  const n = ((qlGet('ena_correct_days_' + q.month, {})[q.id]) || []).length;
  return '<button class="btn" id="ql-master" style="margin-top:10px; text-align:center; background:#fef9c3; border-color:#eab308; font-weight:800;" onclick="quizLinkMaster()">⭐ もう完璧にする（' + n + '日 正解ずみ）</button>';
}
function quizLinkMaster() {
  const q = bt && bt.queue[bt.idx];
  if (!qlLinked(q) || !qlCanMaster(q)) return;
  const m = q.month;
  qlSetEdit('ena_mastered_' + m, s => s.add(q.id));
  qlSetEdit('ena_wrong_' + m, s => s.delete(q.id));
  const c = qlGet('ena_correct_count_' + m, {}); c[q.id] = Math.max(c[q.id] || 0, 3); qlSet('ena_correct_count_' + m, c);
  const b = document.getElementById('ql-master');
  if (b) { b.disabled = true; b.textContent = '⭐ もう完璧！（メダルと キャラは クイズを ひらくと ふえるよ）'; }
}
function logAnswer(ok, q) {
  questLogDay(d => {
    d.answered++;
    if (ok) d.correct++;
    const k = bt.boss ? '__boss__' : bt.key;
    const st = d.stages[k] || (d.stages[k] = { label: stageLabel(), answered: 0, correct: 0 });
    st.answered++;
    if (ok) st.correct++;
    if (!ok && q && !d.wrong.some(w => w.id === q.id) && d.wrong.length < LOG_WRONG_MAX) {
      const text = String(q.q || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
      d.wrong.push({ id: q.id, stage: stageLabel(), q: text.length > 60 ? text.slice(0, 60) + '…' : text });
    }
  });
}

function maxHp()  { return HP_BASE + (save.lv - 1) * HP_PER_LV; }

// ── 画面 ────────────────────────────────────────────────────

// ── 起動 ────────────────────────────────────────────────────
async function boot() {
  // 栄光・2年生の子は、その学校の月を まとめて クエストにする（メダルの台帳は 学校ごとの キー）
  const school = questSchool();
  if (school) {
    try {
      const sq = (await fetch('data/quest_schools.json', { cache: 'no-cache' }).then(r => r.json()))[school];
      if (sq && Array.isArray(sq.months) && sq.months.length) SCHOOL_QUEST = sq;
    } catch (e) {}
  }
  let questMonths;
  if (SCHOOL_QUEST) {
    MEDAL_MONTH = school === 'g2' ? 'g2' : SCHOOL_QUEST.months[0];
    questMonths = SCHOOL_QUEST.months;
  } else {
    try {
      const man = await fetch('data/quest_months.json', { cache: 'no-cache' }).then(r => r.json());
      MEDAL_MONTH = pickQuestMonth((man.months || []).map(x => x.month));
    } catch (e) { MEDAL_MONTH = '202609'; }
    questMonths = [MEDAL_MONTH];
  }
  document.querySelectorAll('.q-month').forEach(el => { el.textContent = questMonthLabel(MEDAL_MONTH); });
  document.title = 'ANRINO クエスト ｜ ' + questMonthLabel(MEDAL_MONTH) + 'のかげモンスター';
  const loaded = await Promise.all(questMonths.map(m => Promise.all([
    fetch('data/questions_' + m + '.json').then(r => r.json()),
    fetch('data/subjects_' + m + '.json').then(r => r.json())
  ])));
  QUESTIONS = [].concat(...loaded.map(x => x[0]));
  SUBJECTS  = Object.assign({}, ...loaded.map(x => x[1]));
  if (typeof loadDetective === 'function') await loadDetective();
  buildStages();
  save = loadSave();

  document.getElementById('title-hero').innerHTML = CHARS.luna(6, 100, 150, {});
  if (save) {
    document.getElementById('title-start').textContent =
      'つづきから（Lv' + save.lv + '・なかま ' +
      STAGES.filter(s => save.cleared[s.key]).length + '/' + STAGES.length + '）';
  }
  // 島の「もりの こじま」から来たときは、そのまま 森に入る
  if (location.hash === '#forest' && typeof enterForest === 'function') {
    forestFromIsland = true;
    history.replaceState(null, '', location.pathname);
    startGame();
    enterForest();
  }
  // 島の「もしの しま」から来たときは、そのまま 模試へ（js/moshi.js）
  if (location.hash === '#moshi' && typeof enterMoshi === 'function') {
    moshiFromIsland = true;
    history.replaceState(null, '', location.pathname + location.search);
    startGame();
    enterMoshi();
  }
}


// SUBJECTS の 親→子 の並びを、そのまま ダンジョン→フロア にする
function buildStages() {
  const counts = {};
  QUESTIONS.forEach(q => { counts[q.subject] = (counts[q.subject] || 0) + 1; });

  const groups = Object.keys(SUBJECTS).filter(k => SUBJECTS[k].isGroup);
  let i = 0;
  STAGES = [];
  groups.forEach(g => {
    Object.keys(SUBJECTS).forEach(k => {
      if (SUBJECTS[k].parent !== g || !counts[k]) return;
      STAGES.push({
        key: k,
        group: g,
        label: SUBJECTS[k].label,
        groupLabel: SUBJECTS[g].label,
        groupIcon: SUBJECTS[g].icon,
        category: SUBJECTS[g].category,
        total: counts[k],
        char: MONSTER_POOL[i % MONSTER_POOL.length]
      });
      i++;
    });
  });
  // 学校べつ（栄光・2年生）のときは、グループに入っていない単元（栄光の「英語」など）も そのまま 1ステージにする
  if (SCHOOL_QUEST) {
    Object.keys(SUBJECTS).forEach(k => {
      const su = SUBJECTS[k];
      if (su.isGroup || su.parent || !counts[k]) return;
      STAGES.push({ key: k, group: k, label: su.label, groupLabel: su.label, groupIcon: su.icon, category: su.category,
                    total: counts[k], char: MONSTER_POOL[i % MONSTER_POOL.length] });
      i++;
    });
  }
}

// ── 計算メモ（手書き。算数の「入力して答える」問題だけ）──────────
let _rmCtx = null, _rmDrawing = false, _rmLastX = 0, _rmLastY = 0, _rmDpr = 1, _rmBound = false;

// canvas を いまの表示サイズ（×画面の密度）に合わせる。書いた線は左上そろえで のこす
function sizeRpgMemo() {
  const canvas = document.getElementById('rpgmemo-canvas');
  if (!canvas) return;
  const r = canvas.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  _rmDpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(r.width * _rmDpr), h = Math.round(r.height * _rmDpr);
  if (canvas.width === w && canvas.height === h && _rmCtx) return;
  let snap = null;
  if (_rmCtx && canvas.width > 10) { snap = document.createElement('canvas'); snap.width = canvas.width; snap.height = canvas.height; snap.getContext('2d').drawImage(canvas, 0, 0); }
  canvas.width = w; canvas.height = h;
  _rmCtx = canvas.getContext('2d');
  _rmCtx.lineCap = 'round';
  _rmCtx.lineJoin = 'round';
  _rmCtx.strokeStyle = '#3d2b5e';
  _rmCtx.lineWidth = 2.5 * _rmDpr;
  if (snap) _rmCtx.drawImage(snap, 0, 0);
}

function initRpgMemo() {
  const canvas = document.getElementById('rpgmemo-canvas');
  if (!canvas) return;
  sizeRpgMemo();
  if (_rmBound) return;
  _rmBound = true;
  const pt = e => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
  };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!_rmCtx) return;
    _rmDrawing = true;
    [_rmLastX, _rmLastY] = pt(e);
    _rmCtx.lineWidth = (e.pointerType === 'pen' ? Math.max(1, e.pressure * 5) : 2.5) * _rmDpr;
    _rmCtx.beginPath();
    _rmCtx.arc(_rmLastX, _rmLastY, _rmCtx.lineWidth / 2, 0, Math.PI * 2);
    _rmCtx.fillStyle = '#3d2b5e';
    _rmCtx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if (!_rmDrawing) return;
    e.preventDefault();
    const [x, y] = pt(e);
    if (e.pointerType === 'pen') _rmCtx.lineWidth = Math.max(1, e.pressure * 5) * _rmDpr;
    _rmCtx.beginPath();
    _rmCtx.moveTo(_rmLastX, _rmLastY);
    _rmCtx.lineTo(x, y);
    _rmCtx.stroke();
    _rmLastX = x; _rmLastY = y;
  });
  const stopDraw = () => { _rmDrawing = false; };
  canvas.addEventListener('pointerup', stopDraw);
  canvas.addEventListener('pointerleave', stopDraw);
  canvas.addEventListener('pointercancel', stopDraw);
  window.addEventListener('resize', () => {
    const wrap = document.getElementById('rpgmemo-wrap');
    if (wrap && wrap.style.display !== 'none') sizeRpgMemo();
  });
}

function clearRpgMemo() {
  const canvas = document.getElementById('rpgmemo-canvas');
  if (_rmCtx && canvas) _rmCtx.clearRect(0, 0, canvas.width, canvas.height);
}

function toggleRpgMemo() {
  const wrap = document.getElementById('rpgmemo-wrap');
  if (!wrap) return;
  const show = wrap.style.display === 'none';
  wrap.style.display = show ? 'flex' : 'none';
  document.body.classList.toggle('memo-open', show);
  if (show) {
    setTimeout(() => {
      initRpgMemo();
      const q = document.getElementById('q-area');
      if (q) { q.style.scrollMarginTop = '16px'; q.scrollIntoView({ block: 'start' }); }   // 問題と入力欄が メモの上に見えるように
    }, 50);
  } else {
    clearRpgMemo();
  }
}

// たてむき・スマホ：メモの高さを 50vh ↔ 65vh
function toggleRpgMemoSize() {
  const wrap = document.getElementById('rpgmemo-wrap');
  if (!wrap) return;
  const big = wrap.classList.toggle('big');
  document.body.classList.toggle('memo-big', big);
  setTimeout(sizeRpgMemo, 30);

function hideRpgMemo() {
  const wrap = document.getElementById('rpgmemo-wrap');
  if (wrap) wrap.style.display = 'none';
  document.body.classList.remove('memo-open');

}

// ── 効果音（剣） ────────────────────────────────────────────
// util.js の playSound は index.html 側の `let _audioCtx` に依存していて
// 鳴らないので、ここで自前に持つ。
let _sfxCtx = null;
function sfxCtx() {
  if (!_sfxCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    _sfxCtx = new AC();
  }
  return _sfxCtx;
}

// 出力はマスターゲイン経由。スマホのスピーカーは小さいので少し持ち上げる。
function sfxOut(ctx) {
  if (!ctx._master) {
    const g = ctx.createGain();
    g.gain.value = 1.7;
    g.connect(sfxOut(ctx));
    ctx._master = g;
  }
  return ctx._master;
}

function sfxNoise(ctx, dur) {
  const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

// こちらの攻撃：空気を切る「シュッ」＋刃の「キィン」
function sfxSlash(ctx, t0, crit) {
  const swing = (at, hi, lo, vol) => {
    const src = ctx.createBufferSource();
    src.buffer = sfxNoise(ctx, 0.26);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(hi, at);
    bp.frequency.exponentialRampToValueAtTime(lo, at + 0.16);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.19);
    src.connect(bp); bp.connect(g); g.connect(sfxOut(ctx));
    src.start(at); src.stop(at + 0.26);
  };
  const ring = (at, f1, f2, vol) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f1, at);
    o.frequency.exponentialRampToValueAtTime(f2, at + 0.42);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.46);
    o.connect(g); g.connect(sfxOut(ctx));
    o.start(at); o.stop(at + 0.5);
  };
  swing(t0, 5600, 800, 0.66);
  ring(t0 + 0.05, crit ? 2800 : 2000, crit ? 1500 : 1150, crit ? 0.32 : 0.22);
  if (crit) {                       // 会心はもう一撃かさねる
    swing(t0 + 0.14, 6400, 900, 0.58);
    ring(t0 + 0.20, 3400, 1800, 0.28);
  }
}

// 斬られる：にぶい「ザシュッ」＋重い一撃
function sfxHurt(ctx, t0) {
  const src = ctx.createBufferSource();
  src.buffer = sfxNoise(ctx, 0.34);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 0.9;
  lp.frequency.setValueAtTime(2600, t0);
  lp.frequency.exponentialRampToValueAtTime(320, t0 + 0.30);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.36, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
  src.connect(lp); lp.connect(g); g.connect(sfxOut(ctx));
  src.start(t0); src.stop(t0 + 0.34);

  const o = ctx.createOscillator();
  const og = ctx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(420, t0);
  o.frequency.exponentialRampToValueAtTime(110, t0 + 0.28);   // スマホのスピーカーで出る高さに
  og.gain.setValueAtTime(0.0001, t0);
  og.gain.exponentialRampToValueAtTime(0.24, t0 + 0.02);
  og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.30);
  o.connect(og); og.connect(sfxOut(ctx));
  o.start(t0); o.stop(t0 + 0.34);
}

// iOS はサイレントスイッチでWebAudioが消える。無音の<audio>を1本鳴らして
// オーディオセッションを「再生中」に切りかえると、スイッチの影響を受けなくなる。
let _unlocked = false;
function unlockAudio() {
  if (_unlocked) return;
  _unlocked = true;
  try {                                   // iOS 16.4+ / Safari 17+ の正式なやり方
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) {}
  const ctx = sfxCtx();
  if (ctx) {
    try { ctx.resume(); } catch (e) {}
    try {                                   // 無音バッファを1回鳴らして解錠
      const b = ctx.createBuffer(1, 1, ctx.sampleRate);
      const s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch (e) {}
  }
  const el = document.getElementById('silent-loop');
  if (el) { el.volume = 0.001; el.play().catch(() => {}); }
}
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

// タイトル／マップの「🔊 音をテスト」
function sfxTest(btn) {
  unlockAudio();
  sfx(true, false);
  setTimeout(() => sfx(true, true), 800);
  setTimeout(() => sfx(false), 1900);
  const el = document.getElementById('sfx-status');
  if (el) {
    const ctx = sfxCtx();
    const lp = document.getElementById('silent-loop');
    el.textContent = '鳴らした → ' +
      (ctx ? ctx.state : 'ctxなし') +
      ' / session:' + ((navigator.audioSession && navigator.audioSession.type) || '—') +
      ' / 無音ループ:' + (lp && !lp.paused ? 'ON' : 'OFF') +
      '　※これが running でも聞こえないときは本体の音量かマナーモード';
  }
}

function sfx(ok, crit) {
  unlockAudio();
  const ctx = sfxCtx();
  if (!ctx) return;
  const go = () => {
    const t = ctx.currentTime + 0.01;
    if (ok) sfxSlash(ctx, t, !!crit); else sfxHurt(ctx, t);
  };
  try {
    if (ctx.state === 'suspended') ctx.resume().then(go).catch(() => {});
    else go();
  } catch (e) {}
}

// 1ターンの決着（正誤→ダメージ→EXP→次へ）
function resolveTurn(ok, q, timeout) {
  const sprite = document.getElementById('enemy-sprite');
  logAnswer(ok, q);
  quizLinkRecord(ok, q);
  if (bt.qElapsed == null) bt.qElapsed = Date.now() - bt.qStart;
  const rush = bt.tt === 'rush';
  const inTime = bt.tt === 'rush' ? Date.now() < bt.endsAt : bt.tt === 'q30' ? bt.qElapsed <= TT_Q_SEC * 1000 : false;
  if (bt.tt) bt.ttAnswered = (bt.ttAnswered || 0) + 1;

  if (ok) {
    bt.streak++;
    bt.correct++;
    const dmg = bt.streak >= 2 ? DMG_CRIT : DMG_HIT;
    sfx(true, bt.streak >= 2);
    if (!rush) bt.hp -= dmg;
    save.exp += EXP_HIT;
    if (!rush) popDamage(dmg, bt.streak >= 2);
    if (sprite) { sprite.classList.remove('shake'); void sprite.offsetWidth; sprite.classList.add('shake'); }
    const gotMedal = medalFirstCorrect(q);
    let got = gotMedal;
    if (inTime) {   // ⏱️ 時間内の正解は どの問題でも 🪙2（過去問演習は 🪙4）
      got = 2 * medalX(q.subject);
      medalTT(got - gotMedal);
      bt.ttMedals = (bt.ttMedals || 0) + got;
      bt.ttIn = (bt.ttIn || 0) + 1;
    }
    bt.medals += got;
    setMsg(inTime
      ? (rush ? 'せいかい！' : (bt.streak >= 2 ? 'かいしん！ ' : 'せいかい！ ') + dmg + 'ダメージ！') + '　⏱️ じかん内！ 🪙+' + got
      : (bt.streak >= 2 ? 'かいしんの一撃！ ' + dmg + 'ダメージ！' : 'せいかい！ ' + dmg + 'ダメージ！') + (gotMedal ? '　🪙 メダル +' + gotMedal + (gotMedal > 1 ? '（かこもん 2ばい！）' : '') : ''));
  } else {
    bt.streak = 0;
    bt.miss = (bt.miss || 0) + 1;   // リプレイ🪙の「ぜんもん せいかい」は まちがいの数で みる
    sfx(false);
    if (!rush) save.hp -= DMG_TAKE;
    setMsg(rush ? 'ざんねん… つぎ いこう！'
      : (timeout ? '⏰ じかんぎれ… ' : 'ざんねん… ') + DMG_TAKE + 'のダメージを受けた');
  }
  ttRender();

  document.getElementById('enemy-hp').style.width = (rush ? 100 : pct(Math.max(0, bt.hp), bt.maxHp)) + '%';
  document.getElementById('enemy-hp-text').textContent = enemyHpText();
  renderMyBar();

  document.getElementById('ex-area').innerHTML =
    '<div style="margin-top:12px; background:' + (ok ? '#f0fdf4' : '#fef2f2') +
      '; border-radius:12px; padding:12px; font-size:13.5px; line-height:1.8;">' +
      '<b>' + (ok ? '⭕ せいかい' : '❌ ざんねん') + '</b><br>' + qHTML(q.explanation || '') +
    '</div>' +
    (rush ? '' : quizLinkMasterBtn(ok, q)) +
    '<button class="btn-main" style="margin-top:10px;" onclick="nextTurn()">つぎへ →</button>';
  persist();
  // 3分トライアルは 正解なら すぐ つぎへ（時間を むだにしない）
  if (rush && ok) { const at = bt.idx; setTimeout(() => { if (bt && bt.tt === 'rush' && !bt.ended && bt.idx === at) nextTurn(); }, 700); }
}

function popDamage(n, crit) {
  const host = document.getElementById('enemy-art');
  const el = document.createElement('div');
  el.className = 'dmg';
  el.textContent = (crit ? '✨' : '') + n;
  host.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function nextTurn() {
  if (bt && bt.tt === 'rush') {
    if (bt.ended) return;
    if (Date.now() >= bt.endsAt) return endRush();
    bt.idx++;
    if (bt.idx >= bt.queue.length) bt.queue = bt.queue.concat(shuffle(QUESTIONS.slice()));
    renderBattle();
    setMsg('');
    return;
  }
  if (save.hp <= 0)      return endBattle(false);
  if (bt.hp <= 0)        return endBattle(true);
  bt.idx++;
  if (bt.idx >= bt.queue.length) return endBattle(bt.hp <= 0);
  renderBattle();
  setMsg('');
}

// 結果画面の「もどる」（森の戦いのあとは 森へ）
let afterResult = null;
function resultBack() {
  const f = afterResult;
  afterResult = null;
  document.getElementById('result-back').textContent = 'マップへもどる';
  (f || showMap)();
}

// にげる まえに たしかめる（まちがえて おしたときの ため）
function askFlee() {
  closeFleeAsk();
  const why = bt && bt.forest ? 'もりの なかに もどるよ' : bt && bt.tt === 'rush' ? 'ここで おしまいに なるよ' : 'マップに もどるよ';
  const w = document.createElement('div');
  w.id = 'flee-ask'; w.className = 'fz-mapwrap';
  w.onclick = e => { if (e.target === w) closeFleeAsk(); };
  w.innerHTML = '<div class="panel" style="max-width:320px; width:100%; text-align:center;">' +
    '<div style="font-size:40px; line-height:1;">🏃</div>' +
    '<div style="font-size:18px; font-weight:800; margin-top:6px; color:#1e1b4b;">ほんとうに にげる？</div>' +
    '<div style="font-size:13px; color:#64748b; margin-top:4px;">' + why + '</div>' +
    '<button class="btn-main" style="margin-top:14px;" onclick="closeFleeAsk()">⚔️ たたかう</button>' +
    '<button class="btn-main" style="margin-top:18px; font-size:13px; padding:9px; background:#e2e8f0; color:#475569; box-shadow:none;" onclick="fleeBattle()">🏃 にげる</button>' +
    '</div>';
  document.body.appendChild(w);
}
function closeFleeAsk() { const w = document.getElementById('flee-ask'); if (w) w.remove(); }

function fleeBattle() {
  closeFleeAsk();
  if (bt && bt.forest) return forestFlee();       // 森の戦いは 森に もどる
  if (bt && bt.tt === 'rush') return endRush();   // 3分トライアルは そこで おしまい（結果を出す）
  ttStop();
  logTT();
  setMsg('');
  showMap();
}

function endBattle(win) {
  closeFleeAsk();
  if (bt && bt.forest) return forestEndBattle(win);   // 🌲 森の戦い（js/forest.js）
  ttStop();
  logTT();
  let lvUps = 0;
  questLogDay(d => { d.battles++; if (win) d.wins++; });
  if (win) {
    save.exp += EXP_WIN;
    save.wins++;
    if (bt.boss) { save.bossDown = true; save.bossMonths[MEDAL_MONTH] = true; }
    else { save.cleared[bt.key] = true; save.seen[bt.char] = true; }
    bt.clearBonus = (typeof DETECTIVE_KEY !== 'undefined' && bt.key === DETECTIVE_KEY)
      ? medalQuestClear('detective', DETECTIVE_CLEAR)
      : medalQuestClear(bt.boss ? 'boss' : bt.key, bt.boss ? MEDAL_BOSS_CLEAR : MEDAL_STAGE_CLEAR * medalX(bt.key));
    bt.medals += bt.clearBonus;
    // もう クリアずみ（ボーナスが0）なら、ぜんもん せいかいの ときだけ リプレイの 🪙
    bt.replayBonus = 0; bt.replayWhy = '';
    const isDet = typeof DETECTIVE_KEY !== 'undefined' && bt.key === DETECTIVE_KEY;
    if (!bt.clearBonus && !isDet) {
      const sk = bt.boss ? 'boss' : bt.key;
      if (bt.miss) bt.replayWhy = 'miss';
      else {
        bt.replayBonus = medalReplay(sk, MEDAL_REPLAY * (bt.boss ? 1 : medalX(bt.key)));
        if (!bt.replayBonus) bt.replayWhy = replayState(sk);
        bt.medals += bt.replayBonus;
      }
    }
  }
  while (save.exp >= needExp()) {
    save.exp -= needExp();
    save.lv++;
    lvUps++;
  }
  if (lvUps) save.hp = maxHp();
  if (save.hp <= 0) save.hp = Math.max(1, Math.round(maxHp() / 2));  // にげかえって半分回復
  persist();

  document.getElementById('result-body').innerHTML =
    (win
      ? '<div style="font-size:21px; font-weight:800; color:#16a34a;">' +
          (bt.boss ? '👑 つきのぬしを たおした！' : CHAR_NAME[bt.char] + ' が なかまになった！') + '</div>' +
        '<div style="margin:12px 0; display:flex; justify-content:center;">' + CHARS[bt.char](6, 100, 150, {}) + '</div>'
      : '<div style="font-size:21px; font-weight:800; color:#b45309;">にげかえった…</div>' +
        '<div style="margin:12px 0; opacity:.75; display:flex; justify-content:center;">' + CHARS[bt.char](6, 100, 150, { silhouette: true }) + '</div>' +
        '<div style="font-size:13px; color:#64748b;">HPを半分まで回復した。もう一度いどめるよ。</div>') +
    '<div style="margin-top:10px; font-size:14px;">せいかい ' + bt.correct + ' / ' + (bt.correct + (bt.miss || 0)) +
      '　けいけんち +' + (bt.correct * EXP_HIT + (win ? EXP_WIN : 0)) + '</div>' +
    '<div style="margin-top:8px; font-size:15px; font-weight:800; color:#b45309;">🪙 アンリノメダル +' + bt.medals + ' 枚' +
      (bt.clearBonus ? '<span style="font-size:12px; font-weight:700;">（はじめて たおした ボーナス ' + bt.clearBonus + '枚 ふくむ）</span>' : '') +
      (win && bt.replayBonus ? '<span style="font-size:12px; font-weight:700;">（ぜんもん せいかい ボーナス ' + bt.replayBonus + '枚 ふくむ）</span>' : '') +
      (win && !bt.medals && bt.replayWhy
        ? '<div style="font-size:12.5px; color:#b45309; font-weight:700; margin-top:4px;">' +
            (bt.replayWhy === 'miss' ? 'ぜんもん せいかいで たおすと 🪙が もらえるよ！'
              : bt.replayWhy === 'got' ? 'この ステージの きょうの 🪙は もう もらったよ。ほかの ステージや ⏱️タイムトライアルも ためしてね'
              : 'きょうの ボーナス 🪙は ぜんぶ もらったよ。⏱️タイムトライアル・🌲もりも ためしてね') + '</div>'
        : '') +
      '<div style="font-size:11.5px; color:#94a3b8; font-weight:700; margin-top:3px;">もっているメダル ' + medalTotal() + ' 枚（しまの ショップで つかえるよ）</div>' +
    '</div>' +
    (bt.tt === 'q30'
      ? '<div style="margin-top:8px; font-size:14px; font-weight:800; color:#b45309;">⏱️ じかん内の せいかい ' + (bt.ttIn || 0) + 'もん ／ 🪙+' + (bt.ttMedals || 0) + '</div>'
      : '');

  if (lvUps) showLevelUp(lvUps);
  showScreen('result');
}

// ── レベルアップ演出 ────────────────────────────────────────
function showLevelUp(n) {
  document.getElementById('lvup-art').innerHTML = CHARS.luna(Math.min(6, save.lv), 100, 130, {});
  document.getElementById('lvup-text').textContent = 'ルナは Lv ' + save.lv + ' になった！';
  document.getElementById('lvup-sub').textContent =
    (n > 1 ? n + '段階アップ！　' : '') + 'さいだいHP ' + maxHp() + ' ／ HPが全回復した';
  document.getElementById('levelup').classList.add('on');
}
function closeLevelUp() { document.getElementById('levelup').classList.remove('on'); }

// ── ずかん ──────────────────────────────────────────────────
function showDex() {
  // なかまは その月のステージを たおしたか（キャラは月をまたいで使い回すので seen ではなく cleared で見る）
  const got = STAGES.filter(s => save.cleared[s.key]).length;
  document.getElementById('dex-count').textContent =
    got + ' / ' + STAGES.length + ' 体' + (bossDownNow() ? '　＋ つきのぬし 👑' : '');
  document.getElementById('dex-grid').innerHTML = STAGES.map(s => {
    const seen = !!save.cleared[s.key];
    return '<div style="text-align:center;">' +
      CHARS[s.char](6, 100, 88, { silhouette: !seen }) +
      '<div style="font-size:11px; font-weight:700; margin-top:2px;">' +
        (seen ? CHAR_NAME[s.char] : '？？？') + '</div>' +
      '<div style="font-size:9.5px; color:#64748b;">' + s.groupIcon + ' ' + s.label + '</div>' +
    '</div>';
  }).join('');
  showScreen('dex');
}
