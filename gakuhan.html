<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学力判定テスト 成績グラフ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    background: linear-gradient(135deg, #1a1040, #2d1b69, #1e1550);
    min-height: 100vh;
    color: #f0eaff;
    padding: 16px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 16px;
  }
  .header { text-align: center; padding: 12px 0 20px; }
  .header h1 { font-size: 20px; font-weight: bold; }
  .header p { font-size: 13px; color: #c4b5fd; margin-top: 4px; }
  .card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chart-wrap { position: relative; height: 220px; }

  /* 入力フォーム */
  .test-list { display: flex; flex-direction: column; gap: 12px; }
  .test-row {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px;
  }
  .test-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .test-date { font-size: 14px; font-weight: bold; }
  .test-row-fields {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .field-group { display: flex; flex-direction: column; gap: 3px; }
  .field-group label { font-size: 10px; color: #c4b5fd; }
  .field-group input {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    padding: 6px 8px;
    text-align: center;
    width: 100%;
    -webkit-appearance: none;
  }
  .field-group input:focus {
    outline: none;
    border-color: #a78bfa;
    background: rgba(167,139,250,0.15);
  }
  .field-group input.filled { border-color: rgba(255,255,255,0.3); }
  .save-btn {
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border: none;
    border-radius: 20px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    padding: 8px 18px;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
  }
  .save-btn:active { opacity: 0.8; }
  .saved-toast {
    display: none;
    text-align: center;
    color: #4ade80;
    font-size: 13px;
    margin-top: 8px;
  }

  /* 最新サマリー */
  .latest-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-box {
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat-box .lbl { font-size: 11px; color: #c4b5fd; margin-bottom: 4px; }
  .stat-box .val { font-size: 26px; font-weight: bold; }
  .stat-box .diff { font-size: 11px; color: #c4b5fd; margin-top: 2px; }
  .diff-up   { color: #4ade80 !important; }
  .diff-down { color: #f87171 !important; }

  .field-group-label {
    font-size: 11px;
    color: #c4b5fd;
    font-weight: bold;
    margin: 10px 0 6px;
    padding-left: 2px;
  }
  .rank-score { font-size: 13px; color: #e9d5ff; margin-top: 2px; font-weight: bold; }
  .rank-str   { font-size: 11px; color: #c4b5fd; margin-top: 1px; }

  /* テーブル */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: rgba(167,139,250,0.2); padding: 6px 3px; text-align: center; color: #e9d5ff; font-weight: bold; }
  td { padding: 7px 3px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
  tr:last-child td { border-bottom: none; }
  .no-data { color: #7c6fa0; }
  .c-sansu  { color: #60a5fa; }
  .c-kokugo { color: #f472b6; }
  .c-rika   { color: #4ade80; }
  .c-shakai { color: #fbbf24; }
  .c-4k     { color: #a78bfa; }
</style>
</head>
<body>

<a href="/" class="back-btn">← アプリに戻る</a>
<div class="header">
  <h1>📊 学力判定テスト</h1>
  <p>enaガクハン 成績グラフ</p>
</div>

<!-- データ入力 -->
<div class="card">
  <div class="card-title">✏️ 成績を入力する</div>
  <div class="test-list" id="inputList"></div>
  <button class="save-btn" onclick="saveAll()">💾 保存してグラフを更新</button>
  <div id="syncStatus" style="font-size:12px;color:#c4b5fd;text-align:center;margin-top:8px;"></div>
  <div class="saved-toast" id="toast">✅ 保存完了！全員に反映されました</div>
</div>

<!-- 最新サマリー -->
<div class="card" id="latestCard">
  <div class="card-title" id="latestTitle">⭐ 最新の結果</div>
  <div class="latest-grid" id="latestGrid"></div>
</div>

<!-- 偏差値推移グラフ -->
<div class="card">
  <div class="card-title">📈 4科目 偏差値の推移</div>
  <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
</div>

<!-- 科目別偏差値グラフ -->
<div class="card">
  <div class="card-title">📚 科目別 偏差値（最新回）</div>
  <div class="chart-wrap"><canvas id="subjectChart"></canvas></div>
</div>

<!-- テスト一覧 -->
<div class="card">
  <div class="card-title">📋 テスト一覧</div>
  <div style="overflow-x:auto;">
    <table id="resultTable"></table>
  </div>
</div>

<script>
const STORAGE_KEY = 'gakuhan_results';

// テスト定義（日付・初期データ）
const TESTS = [
  { date: '2/25', label: '2026/02/25' },
  { date: '3/18', label: '2026/03/18' },
  { date: '4/24', label: '2026/04/24' },
  { date: '5/27', label: '2026/05/27' },
];

const FIELD_GROUPS = [
  {
    label: '📊 偏差値',
    fields: [
      { key: 'hensachi4', label: '4科目偏差値', step: '0.1', min: 20, max: 80 },
      { key: 'hensachi2', label: '2科目偏差値', step: '0.1', min: 20, max: 80 },
      { key: 'sansu',     label: '算数偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'kokugo',    label: '国語偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'rika',      label: '理科偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'shakai',    label: '社会偏差値',  step: '0.1', min: 20, max: 80 },
    ]
  },
  {
    label: '🏆 得点・順位',
    fields: [
      { key: 'tokuten4', label: '4科目得点',     step: '1', min: 0, max: 500 },
      { key: 'juni4',    label: '4科目順位（位）', step: '1', min: 1, max: 9999 },
      { key: 'ninzu4',   label: '4科目受験者数',  step: '1', min: 1, max: 9999 },
      { key: 'tokuten2', label: '2科目得点',     step: '1', min: 0, max: 300 },
      { key: 'juni2',    label: '2科目順位（位）', step: '1', min: 1, max: 9999 },
      { key: 'ninzu2',   label: '2科目受験者数',  step: '1', min: 1, max: 9999 },
    ]
  }
];
const FIELDS = FIELD_GROUPS.flatMap(g => g.fields);

// 初期値（PDFから読み取り済み）
const DEFAULTS = {
  '2/25': { hensachi4: 51.8, hensachi2: 50.8, sansu: 61.6, kokugo: 39.3, rika: 48.7, shakai: 56.3, tokuten4: 273, tokuten2: 132 },
  '5/27': { hensachi4: 66.5, hensachi2: 53.5, sansu: 60.3, kokugo: 60.3, rika: 60.3, shakai: 60.3 },
};

let data = {};
let currentSha = null;
let trendChart, subjectChart;

function setStatus(msg, isError) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.style.color = isError ? '#f87171' : '#c4b5fd';
}

async function loadFromCloud() {
  setStatus('⏳ データを読み込み中...');
  try {
    const r = await fetch('/api/gakuhan');
    if (!r.ok) throw new Error(r.status);
    const { data: d, sha } = await r.json();
    data = d;
    currentSha = sha;
    setStatus('✅ 読み込み完了');
  } catch(e) {
    setStatus('⚠️ 読み込み失敗（オフライン？）', true);
    // フォールバック: デフォルト値を使う
    data = {};
    TESTS.forEach(t => { data[t.date] = Object.assign({}, DEFAULTS[t.date] || {}); });
  }
  renderInputs();
  renderAll();
}

// --- 入力フォーム描画 ---
function renderInputs() {
  const list = document.getElementById('inputList');
  list.innerHTML = '';
  TESTS.forEach(t => {
    const d = data[t.date] || {};
    const div = document.createElement('div');
    div.className = 'test-row';
    div.innerHTML = `
      <div class="test-row-header">
        <span class="test-date">📅 ${t.label}</span>
      </div>
      ${FIELD_GROUPS.map(g => `
        <div class="field-group-label">${g.label}</div>
        <div class="test-row-fields">
          ${g.fields.map(f => `
            <div class="field-group">
              <label>${f.label}</label>
              <input type="number" step="${f.step}" min="${f.min}" max="${f.max}"
                id="inp_${t.date}_${f.key}"
                value="${d[f.key] != null ? d[f.key] : ''}"
                placeholder="—"
                class="${d[f.key] != null ? 'filled' : ''}"
                oninput="this.classList.toggle('filled', this.value !== '')">
            </div>
          `).join('')}
        </div>
      `).join('')}
    `;
    list.appendChild(div);
  });
}

async function saveAll() {
  const btn = document.querySelector('.save-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 保存中...';

  TESTS.forEach(t => {
    const row = {};
    FIELDS.forEach(f => {
      const el = document.getElementById(`inp_${t.date}_${f.key}`);
      const v = parseFloat(el.value);
      row[f.key] = isNaN(v) ? null : v;
    });
    data[t.date] = row;
  });

  try {
    const r = await fetch('/api/gakuhan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data, sha: currentSha }),
    });
    if (!r.ok) throw new Error(await r.text());
    const { sha } = await r.json();
    currentSha = sha;
    setStatus('✅ 保存完了・全員に反映されました');
    renderAll();
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
  } catch(e) {
    setStatus('❌ 保存失敗: ' + e.message, true);
  }

  btn.disabled = false;
  btn.textContent = '💾 保存してグラフを更新';
}

// --- サマリー描画 ---
function renderLatest() {
  // データのある最新回を探す
  let latest = null, latestIdx = -1;
  TESTS.forEach((t, i) => {
    const d = data[t.date];
    if (d && d.hensachi4 != null) { latest = d; latestIdx = i; }
  });
  if (!latest) { document.getElementById('latestCard').style.display = 'none'; return; }
  document.getElementById('latestCard').style.display = '';
  const t = TESTS[latestIdx];
  document.getElementById('latestTitle').textContent = `⭐ 最新の結果（${t.label}）`;

  // 前回データ
  let prev = null;
  for (let i = latestIdx - 1; i >= 0; i--) {
    const d = data[TESTS[i].date];
    if (d && d.hensachi4 != null) { prev = d; break; }
  }

  function diffStr(cur, pre, key) {
    if (pre == null || pre[key] == null || cur[key] == null) return '';
    const d = (cur[key] - pre[key]).toFixed(1);
    if (d > 0) return `<span class="diff diff-up">↑${d}</span>`;
    if (d < 0) return `<span class="diff diff-down">↓${Math.abs(d)}</span>`;
    return `<span class="diff">→ 同じ</span>`;
  }

  function rankStr(juni, ninzu) {
    if (juni == null) return '';
    return ninzu != null ? `${juni}位 / ${ninzu}人中` : `${juni}位`;
  }

  const boxes = [
    { lbl: '4科目 偏差値', val: latest.hensachi4, color: '#a78bfa', diffKey: 'hensachi4',
      sub: rankStr(latest.juni4, latest.ninzu4), sub2: latest.tokuten4 != null ? `${latest.tokuten4}点` : null },
    { lbl: '2科目 偏差値', val: latest.hensachi2, color: '#38bdf8', diffKey: 'hensachi2',
      sub: rankStr(latest.juni2, latest.ninzu2), sub2: latest.tokuten2 != null ? `${latest.tokuten2}点` : null },
    { lbl: '算数',  val: latest.sansu,   color: '#60a5fa', diffKey: 'sansu' },
    { lbl: '国語',  val: latest.kokugo,  color: '#f472b6', diffKey: 'kokugo' },
    { lbl: '理科',  val: latest.rika,    color: '#4ade80', diffKey: 'rika' },
    { lbl: '社会',  val: latest.shakai,  color: '#fbbf24', diffKey: 'shakai' },
  ];

  document.getElementById('latestGrid').innerHTML = boxes.map(b => `
    <div class="stat-box">
      <div class="lbl">${b.lbl}</div>
      <div class="val" style="color:${b.color}">${b.val != null ? b.val : '—'}</div>
      ${b.sub2 ? `<div class="rank-score">${b.sub2}</div>` : ''}
      ${b.sub ? `<div class="rank-str">${b.sub}</div>` : ''}
      ${b.val != null ? diffStr(latest, prev, b.diffKey) : ''}
    </div>
  `).join('');
}

// --- テーブル描画 ---
function renderTable() {
  const tbl = document.getElementById('resultTable');
  tbl.innerHTML = `
    <tr>
      <th rowspan="2">実施日</th>
      <th colspan="3">4科目</th>
      <th colspan="3">2科目</th>
      <th>算数</th><th>国語</th><th>理科</th><th>社会</th>
    </tr>
    <tr>
      <th>偏差値</th><th>得点</th><th>順位</th>
      <th>偏差値</th><th>得点</th><th>順位</th>
      <th colspan="4" style="font-size:10px;color:#c4b5fd;">偏差値</th>
    </tr>
  `;
  TESTS.forEach(t => {
    const d = data[t.date] || {};
    const nd = v => v != null ? v : '<span class="no-data">—</span>';
    const rank = (j, n) => j != null ? (n != null ? `${j}<br><span style="font-size:10px;color:#c4b5fd;">/${n}人</span>` : `${j}位`) : '<span class="no-data">—</span>';
    tbl.innerHTML += `<tr>
      <td style="font-weight:bold;">${t.date}</td>
      <td class="c-4k">${nd(d.hensachi4)}</td>
      <td>${nd(d.tokuten4)}</td>
      <td>${rank(d.juni4, d.ninzu4)}</td>
      <td class="c-4k">${nd(d.hensachi2)}</td>
      <td>${nd(d.tokuten2)}</td>
      <td>${rank(d.juni2, d.ninzu2)}</td>
      <td class="c-sansu">${nd(d.sansu)}</td>
      <td class="c-kokugo">${nd(d.kokugo)}</td>
      <td class="c-rika">${nd(d.rika)}</td>
      <td class="c-shakai">${nd(d.shakai)}</td>
    </tr>`;
  });
}

// --- グラフ描画 ---
function renderCharts() {
  const labels = TESTS.map(t => t.date);
  const get = key => TESTS.map(t => (data[t.date] || {})[key] ?? null);

  if (trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '4科目', data: get('hensachi4'), borderColor: '#a78bfa', backgroundColor: 'rgba(167,139,250,0.15)', tension: 0.3, pointRadius: 5, spanGaps: true },
        { label: '2科目', data: get('hensachi2'), borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.1)',   tension: 0.3, pointRadius: 5, spanGaps: true, borderDash: [5,3] },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#e9d5ff', font: { size: 12 } } } },
      scales: {
        x: { ticks: { color: '#c4b5fd' }, grid: { color: 'rgba(167,139,250,0.1)' } },
        y: { min: 30, max: 80, ticks: { color: '#aaa', stepSize: 10 }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });

  // 最新のデータがある回を使う
  let latestD = null;
  for (let i = TESTS.length - 1; i >= 0; i--) {
    const d = data[TESTS[i].date];
    if (d && (d.sansu != null || d.kokugo != null)) { latestD = d; break; }
  }

  if (subjectChart) subjectChart.destroy();
  subjectChart = new Chart(document.getElementById('subjectChart'), {
    type: 'bar',
    data: {
      labels: ['算数', '国語', '理科', '社会'],
      datasets: [{
        label: '偏差値',
        data: latestD ? [latestD.sansu, latestD.kokugo, latestD.rika, latestD.shakai] : [null,null,null,null],
        backgroundColor: ['rgba(96,165,250,0.6)','rgba(244,114,182,0.6)','rgba(74,222,128,0.6)','rgba(251,191,36,0.6)'],
        borderColor:      ['#60a5fa','#f472b6','#4ade80','#fbbf24'],
        borderWidth: 2, borderRadius: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#e9d5ff' }, grid: { color: 'rgba(167,139,250,0.1)' } },
        y: { min: 30, max: 80, ticks: { color: '#aaa', stepSize: 10 }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

function renderAll() {
  renderLatest();
  renderTable();
  renderCharts();
}

loadFromCloud();
</script>
</body>
</html>
