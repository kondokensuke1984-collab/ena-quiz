<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学力判定テスト 成績グラフ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    background: linear-gradient(135deg, #1a1040, #2d1b69, #1e1550);
    min-height: 100vh;
    color: #f0eaff;
    padding: 16px;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px;
    cursor: pointer; text-decoration: none; margin-bottom: 16px;
  }
  .header { text-align: center; padding: 12px 0 20px; }
  .header h1 { font-size: 20px; font-weight: bold; }
  .header p { font-size: 13px; color: #c4b5fd; margin-top: 4px; }
  .card {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 16px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 15px; font-weight: bold; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .chart-wrap { position: relative; height: 220px; }

  /* テスト行（アコーディオン） */
  .test-list { display: flex; flex-direction: column; gap: 8px; }
  .test-row {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; overflow: hidden;
  }
  .test-row-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; cursor: pointer; user-select: none;
  }
  .test-row-header:active { background: rgba(255,255,255,0.05); }
  .test-row-left { display: flex; align-items: center; gap: 10px; }
  .test-date { font-size: 14px; font-weight: bold; }
  .test-filled-badge {
    font-size: 10px; color: #4ade80; background: rgba(74,222,128,0.15);
    border-radius: 8px; padding: 2px 7px;
  }
  .accordion-arrow {
    font-size: 12px; color: #c4b5fd; transition: transform 0.2s;
  }
  .test-row.open .accordion-arrow { transform: rotate(180deg); }
  .test-row-body { display: none; padding: 0 12px 12px; }
  .test-row.open .test-row-body { display: block; }
  .test-row-actions { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .del-btn {
    background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3);
    color: #f87171; border-radius: 8px; font-size: 12px; padding: 3px 10px; cursor: pointer;
  }
  .del-btn:active { opacity: 0.7; }
  .test-row-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .field-group { display: flex; flex-direction: column; gap: 3px; }
  .field-group label { font-size: 10px; color: #c4b5fd; }
  .field-group input {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #fff; font-size: 15px; padding: 6px 8px;
    text-align: center; width: 100%; -webkit-appearance: none;
  }
  .field-group input:focus { outline: none; border-color: #a78bfa; background: rgba(167,139,250,0.15); }
  .field-group input.filled { border-color: rgba(255,255,255,0.3); }
  .field-group-label { font-size: 11px; color: #c4b5fd; font-weight: bold; margin: 10px 0 6px; }

  /* 成績入力ボタン（メイン画面） */
  .edit-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border: none; border-radius: 16px; color: #fff;
    font-size: 15px; font-weight: bold; padding: 14px;
    cursor: pointer; width: 100%; margin-bottom: 16px;
  }
  .edit-btn:active { opacity: 0.85; }
  .edit-header { margin-bottom: 4px; }

  /* ケンケンアドバイス（Geminiに聞く） */
  .advice-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #4285f4, #34a853);
    border: none; border-radius: 16px; color: #fff;
    font-size: 15px; font-weight: bold; padding: 14px;
    cursor: pointer; width: 100%; margin-bottom: 16px;
  }
  .advice-btn:active { opacity: 0.85; }
  .advice-modal { max-width: 420px; }
  .advice-text {
    width: 100%; height: 140px; font-size: 11px; line-height: 1.5;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; color: #e9d5ff; padding: 8px; resize: none;
    font-family: inherit; -webkit-user-select: text; user-select: text;
  }
  .advice-gemini-btn {
    background: linear-gradient(135deg, #4285f4, #34a853); border: none;
    border-radius: 24px; color: #fff; font-size: 15px; font-weight: bold;
    padding: 12px 20px; cursor: pointer; width: 100%; margin-top: 10px;
  }
  .advice-sub-btns { display: flex; gap: 8px; margin-top: 10px; }
  .advice-sub-btns button {
    flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; color: #c4b5fd; font-size: 13px; padding: 9px; cursor: pointer;
  }
  .advice-copied { font-size: 12px; color: #4ade80; text-align: center; min-height: 16px; margin-top: 6px; }

  /* ボタン類 */
  .add-test-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(167,139,250,0.15); border: 1px dashed rgba(167,139,250,0.5);
    color: #c4b5fd; border-radius: 12px; font-size: 14px; padding: 12px;
    cursor: pointer; width: 100%; margin-top: 4px;
  }
  .add-test-btn:active { background: rgba(167,139,250,0.25); }
  .save-btn {
    background: linear-gradient(135deg, #7c3aed, #4f46e5); border: none;
    border-radius: 20px; color: #fff; font-size: 13px; font-weight: bold;
    padding: 10px 18px; cursor: pointer; width: 100%; margin-top: 14px;
  }
  .save-btn:disabled { opacity: 0.5; }
  .saved-toast { display: none; text-align: center; color: #4ade80; font-size: 13px; margin-top: 8px; }

  /* 追加モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1e1550; border: 1px solid rgba(167,139,250,0.4);
    border-radius: 20px; padding: 24px; width: 90%; max-width: 340px;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; text-align: center; }
  .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .modal-field label { font-size: 12px; color: #c4b5fd; }
  .modal-field input {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px; color: #fff; font-size: 16px; padding: 10px 12px; width: 100%;
  }
  .modal-field input:focus { outline: none; border-color: #a78bfa; }
  .modal-hint { font-size: 11px; color: #7c6fa0; margin-bottom: 16px; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button {
    flex: 1; border: none; border-radius: 12px; font-size: 14px;
    font-weight: bold; padding: 10px; cursor: pointer;
  }
  .modal-cancel { background: rgba(255,255,255,0.1); color: #c4b5fd; }
  .modal-ok { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff; }

  /* サマリー */
  .latest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-box .lbl { font-size: 11px; color: #c4b5fd; margin-bottom: 4px; }
  .stat-box .val { font-size: 26px; font-weight: bold; }
  .rank-score { font-size: 13px; color: #e9d5ff; margin-top: 2px; font-weight: bold; }
  .rank-str   { font-size: 11px; color: #c4b5fd; margin-top: 1px; }
  .diff-up   { color: #4ade80; font-size: 11px; }
  .diff-down { color: #f87171; font-size: 11px; }
  .diff-same { color: #c4b5fd; font-size: 11px; }

  /* テーブル */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: rgba(167,139,250,0.2); padding: 6px 3px; text-align: center; color: #e9d5ff; font-weight: bold; }
  td { padding: 7px 3px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
  tr:last-child td { border-bottom: none; }
  .no-data { color: #7c6fa0; }

  /* 順位グラフの表示切替 */
  .mode-toggle { display: flex; gap: 4px; }
  .mode-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #c4b5fd; border-radius: 10px; font-size: 11px; font-weight: bold;
    padding: 5px 10px; cursor: pointer;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border-color: rgba(167,139,250,0.6); color: #fff;
  }
  .chart-note { font-size: 10px; color: #7c6fa0; margin-top: 8px; text-align: center; line-height: 1.5; }

  .c-sansu  { color: #60a5fa; }
  .c-kokugo { color: #f472b6; }
  .c-rika   { color: #4ade80; }
  .c-shakai { color: #fbbf24; }
  .c-4k     { color: #a78bfa; }
</style>
</head>
<body>

<!-- 追加・編集モーダル -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 id="modalTitle">＋ テスト回を追加</h2>
    <div class="modal-field">
      <label>表示用ラベル（実施日）</label>
      <input type="text" id="newLabel" placeholder="例：2026/06/24">
    </div>
    <div class="modal-field">
      <label>グラフ用の短い表示</label>
      <input type="text" id="newDate" placeholder="例：6/24">
    </div>
    <p class="modal-hint">※ グラフの横軸に表示される短い日付です</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-ok" id="modalOkBtn" onclick="confirmAdd()">追加する</button>
    </div>
  </div>
</div>

<!-- ケンケンアドバイス モーダル -->
<div class="modal-overlay" id="adviceModal">
  <div class="modal advice-modal">
    <h2>🤖 ケンケンアドバイス</h2>
    <div id="adviceBody"></div>
  </div>
</div>

<!-- ========== メイン画面 ========== -->
<div id="view-main">
  <a href="/" class="back-btn">← アプリに戻る</a>
  <div class="header">
    <h1>📊 学力判定テスト</h1>
    <p>enaガクハン 成績グラフ</p>
  </div>

  <button class="edit-btn" onclick="showEdit()">✏️ 成績を入力する</button>
  <button class="advice-btn" onclick="openAdviceModal()">🤖 ケンケンアドバイス</button>

  <!-- 最新サマリー -->
  <div class="card" id="latestCard">
    <div class="card-title" id="latestTitle">⭐ 最新の結果</div>
    <div class="latest-grid" id="latestGrid"></div>
  </div>

  <!-- 偏差値推移グラフ（4科目＋科目別） -->
  <div class="card">
    <div class="card-title">
      <span>📈 偏差値の推移</span>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeBtnAll"  onclick="setTrendMode('all')">ぜんぶ</button>
        <button class="mode-btn" id="modeBtnSougou" onclick="setTrendMode('sougou')">総合</button>
        <button class="mode-btn" id="modeBtnKamoku" onclick="setTrendMode('kamoku')">科目別</button>
      </div>
    </div>
    <div class="chart-wrap" style="height:300px;"><canvas id="trendChart"></canvas></div>
    <div class="chart-note">※ 太い線が総合（4科目・2科目）、細い線が各科目です<br>凡例をタップすると、その線だけ消したり出したりできます</div>
  </div>

  <!-- 科目別偏差値グラフ -->
  <div class="card">
    <div class="card-title" id="subjectCardTitle">📚 科目別 偏差値</div>
    <div class="chart-wrap"><canvas id="subjectChart"></canvas></div>
    <div id="subjectDiff" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px;"></div>
  </div>

  <!-- 各科目 得点推移グラフ -->
  <div class="card">
    <div class="card-title">📝 各科目 得点の推移</div>
    <div class="chart-wrap" style="height:260px;"><canvas id="scoreTrendChart"></canvas></div>
  </div>

  <!-- 順位の推移 -->
  <div class="card">
    <div class="card-title">
      <span>🏅 順位の推移</span>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeBtnJuni" onclick="setRankMode('juni')">順位</button>
        <button class="mode-btn" id="modeBtnPct" onclick="setRankMode('pct')">上位%</button>
      </div>
    </div>
    <div class="chart-wrap" style="height:260px;"><canvas id="rankChart"></canvas></div>
    <div id="rankDiff" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;"></div>
    <div class="chart-note" id="rankNote"></div>
  </div>

  <!-- 科目別 順位の推移 -->
  <div class="card">
    <div class="card-title">📚 科目別 順位の推移</div>
    <div class="chart-wrap" style="height:260px;"><canvas id="subjectRankChart"></canvas></div>
    <div class="chart-note">※ 上から順に成績が良い順位です（グラフの上＝上位）</div>
  </div>

  <!-- テスト一覧 -->
  <div class="card">
    <div class="card-title">📋 テスト一覧</div>
    <div style="overflow-x:auto;"><table id="resultTable"></table></div>
  </div>

</div><!-- /view-main -->

<!-- ========== 入力画面 ========== -->
<div id="view-edit" style="display:none;">
  <div class="edit-header">
    <button class="back-btn" onclick="showMain()">← 戻る</button>
    <div class="header" style="padding:8px 0 16px;">
      <h1>✏️ 成績を入力する</h1>
    </div>
  </div>

  <div class="card">
    <div class="test-list" id="inputList"></div>
    <button class="add-test-btn" onclick="openModal()">＋ 新しいテスト回を追加</button>
    <button class="save-btn" id="saveBtn" onclick="saveAll()">💾 保存してグラフを更新</button>
    <div id="syncStatus" style="font-size:12px;color:#c4b5fd;text-align:center;margin-top:8px;"></div>
    <div class="saved-toast" id="toast">✅ 保存完了！全員に反映されました</div>
  </div>
</div>

<script src="/js/edit_token.js"></script>
<script>
const FIELD_GROUPS = [
  {
    label: '📊 偏差値',
    fields: [
      { key: 'hensachi4', label: '4科目偏差値', step: '0.1', min: 20, max: 80 },
      { key: 'hensachi2', label: '2科目偏差値', step: '0.1', min: 20, max: 80 },
      { key: 'sansu',     label: '算数偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'kokugo',    label: '国語偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'rika',      label: '理科偏差値',  step: '0.1', min: 20, max: 80 },
      { key: 'shakai',    label: '社会偏差値',  step: '0.1', min: 20, max: 80 },
    ]
  },
  {
    label: '🏆 合計得点・順位',
    fields: [
      { key: 'tokuten4', label: '4科目得点',      step: '1', min: 0,  max: 500  },
      { key: 'juni4',    label: '4科目順位（位）',  step: '1', min: 1,  max: 9999 },
      { key: 'ninzu4',   label: '4科目受験者数',   step: '1', min: 1,  max: 9999 },
      { key: 'tokuten2', label: '2科目得点',      step: '1', min: 0,  max: 300  },
      { key: 'juni2',    label: '2科目順位（位）',  step: '1', min: 1,  max: 9999 },
      { key: 'ninzu2',   label: '2科目受験者数',   step: '1', min: 1,  max: 9999 },
    ]
  },
  {
    label: '📝 各科目の得点・順位',
    fields: [
      { key: 'sansu_ten',   label: '算数得点',      step: '1', min: 0, max: 200  },
      { key: 'sansu_juni',  label: '算数順位（位）', step: '1', min: 1, max: 9999 },
      { key: 'kokugo_ten',  label: '国語得点',      step: '1', min: 0, max: 200  },
      { key: 'kokugo_juni', label: '国語順位（位）', step: '1', min: 1, max: 9999 },
      { key: 'rika_ten',    label: '理科得点',      step: '1', min: 0, max: 200  },
      { key: 'rika_juni',   label: '理科順位（位）', step: '1', min: 1, max: 9999 },
      { key: 'shakai_ten',  label: '社会得点',      step: '1', min: 0, max: 200  },
      { key: 'shakai_juni', label: '社会順位（位）', step: '1', min: 1, max: 9999 },
    ]
  }
];
const FIELDS = FIELD_GROUPS.flatMap(g => g.fields);
const EMPTY_ROW = () => Object.fromEntries(FIELDS.map(f => [f.key, null]));

let data = {};        // { _tests: [{date,label},...], "2/25": {...}, ... }
let currentSha = null;
let tests = [];       // [{date, label}] — 表示順
let trendChart, subjectChart, scoreTrendChart, rankChart, subjectRankChart;
let rankMode  = 'juni';  // 'juni' = 順位 / 'pct' = 上位%
let trendMode = 'all';   // 'all' = ぜんぶ / 'sougou' = 総合のみ / 'kamoku' = 科目別のみ

function setTrendMode(mode) {
  trendMode = mode;
  ['all','sougou','kamoku'].forEach(m => {
    const id = { all: 'modeBtnAll', sougou: 'modeBtnSougou', kamoku: 'modeBtnKamoku' }[m];
    document.getElementById(id).classList.toggle('active', m === mode);
  });
  renderCharts();
}

// ---- 画面切り替え ----
function showMain() {
  document.getElementById('view-main').style.display = '';
  document.getElementById('view-edit').style.display = 'none';
  window.scrollTo(0, 0);
}
function showEdit() {
  document.getElementById('view-main').style.display = 'none';
  document.getElementById('view-edit').style.display = '';
  renderInputs();
  window.scrollTo(0, 0);
}

// ---- モーダル ----
let editingDate = null;

function openModal() {
  editingDate = null;
  document.getElementById('newLabel').value = '';
  document.getElementById('newDate').value = '';
  document.getElementById('modalTitle').textContent = '＋ テスト回を追加';
  document.getElementById('modalOkBtn').textContent = '追加する';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('newLabel').focus(), 100);
}
function editTest(date) {
  const t = tests.find(t => t.date === date);
  if (!t) return;
  editingDate = date;
  document.getElementById('newLabel').value = t.label;
  document.getElementById('newDate').value = t.date;
  document.getElementById('modalTitle').textContent = '✏️ テスト回を編集';
  document.getElementById('modalOkBtn').textContent = '保存する';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('newLabel').focus(), 100);
}
function closeModal() {
  document.getElementById('addModal').classList.remove('open');
  editingDate = null;
}
function confirmAdd() {
  const label = document.getElementById('newLabel').value.trim();
  const date  = document.getElementById('newDate').value.trim();
  if (!label || !date) { alert('両方入力してください'); return; }

  if (editingDate) {
    // 編集モード
    if (date !== editingDate && tests.find(t => t.date === date)) {
      alert('その日付はすでに存在します'); return;
    }
    const idx = tests.findIndex(t => t.date === editingDate);
    tests[idx] = { date, label };
    if (date !== editingDate) {
      data[date] = data[editingDate];
      delete data[editingDate];
    }
  } else {
    // 追加モード
    if (tests.find(t => t.date === date)) { alert('その日付はすでに存在します'); return; }
    tests.push({ date, label });
    data[date] = EMPTY_ROW();
  }
  closeModal();
  renderInputs();
}

// ---- 削除 ----
function deleteTest(date) {
  if (!confirm(`「${date}」の回を削除しますか？`)) return;
  tests = tests.filter(t => t.date !== date);
  delete data[date];
  renderInputs();
  renderAll();
}

// ---- Cloud ----
function setStatus(msg, isError) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.style.color = isError ? '#f87171' : '#c4b5fd';
}

async function loadFromCloud() {
  setStatus('⏳ データを読み込み中...');
  try {
    const r = await fetch('/api/gakuhan');
    if (!r.ok) throw new Error(r.status);
    const { data: d, sha } = await r.json();
    data = d;
    currentSha = sha;
    tests = Array.isArray(d._tests) ? d._tests : [];
    setStatus('✅ 読み込み完了');
  } catch(e) {
    setStatus('⚠️ 読み込み失敗（オフライン？）', true);
    tests = [];
    data = { _tests: [] };
  }
  renderAll();
}

async function saveAll() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 保存中...';

  // フォームから値を読み取る
  tests.forEach(t => {
    const row = {};
    FIELDS.forEach(f => {
      const el = document.getElementById(`inp_${t.date}_${f.key}`);
      if (!el) return;
      const v = parseFloat(el.value);
      row[f.key] = isNaN(v) ? null : v;
    });
    data[t.date] = row;
  });
  data._tests = tests;

  try {
    const r = await saveWithEditToken('/api/gakuhan', { data, sha: currentSha });
    if (!r.ok) throw new Error(await r.text());
    const res = await r.json();
    currentSha = res.sha;
    setStatus('✅ 保存完了・全員に反映されました');
    renderAll();
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
      showMain();
    }, 1500);
  } catch(e) {
    setStatus('❌ 保存失敗: ' + e.message, true);
  }
  btn.disabled = false;
  btn.textContent = '💾 保存してグラフを更新';
}

// ---- 入力フォーム ----
function toggleAccordion(date) {
  const row = document.getElementById(`row_${date}`);
  row.classList.toggle('open');
}

function renderInputs() {
  const list = document.getElementById('inputList');
  list.innerHTML = '';
  tests.forEach((t, idx) => {
    const d = data[t.date] || {};
    const isLatest = idx === tests.length - 1;
    const filledCount = FIELDS.filter(f => d[f.key] != null).length;
    const badge = filledCount > 0 ? `<span class="test-filled-badge">✓ ${filledCount}項目入力済</span>` : '';
    const div = document.createElement('div');
    div.className = 'test-row' + (isLatest ? ' open' : '');
    div.id = `row_${t.date}`;
    div.innerHTML = `
      <div class="test-row-header" onclick="toggleAccordion('${t.date}')">
        <div class="test-row-left">
          <span class="test-date">📅 ${t.label}</span>
          ${badge}
        </div>
        <span class="accordion-arrow">▼</span>
      </div>
      <div class="test-row-body">
        <div class="test-row-actions">
          <button class="del-btn" style="margin-right:6px;" onclick="editTest('${t.date}')">✏️ 編集</button>
          <button class="del-btn" onclick="deleteTest('${t.date}')">削除</button>
        </div>
        ${FIELD_GROUPS.map(g => `
          <div class="field-group-label">${g.label}</div>
          <div class="test-row-fields">
            ${g.fields.map(f => `
              <div class="field-group">
                <label>${f.label}</label>
                <input type="number" step="${f.step}" min="${f.min}" max="${f.max}"
                  id="inp_${t.date}_${f.key}"
                  value="${d[f.key] != null ? d[f.key] : ''}"
                  placeholder="—"
                  class="${d[f.key] != null ? 'filled' : ''}"
                  oninput="this.classList.toggle('filled', this.value !== '')">
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    `;
    list.appendChild(div);
  });
}

// ---- サマリー ----
let selectedIdx = -1; // 表示中の回インデックス（-1=最新）

function getDisplayIdx() {
  if (selectedIdx >= 0 && selectedIdx < tests.length) return selectedIdx;
  // デフォルト：データのある最新回
  let idx = -1;
  tests.forEach((t, i) => { if ((data[t.date] || {}).hensachi4 != null) idx = i; });
  return idx;
}

function moveSelected(dir) {
  const cur = getDisplayIdx();
  const next = cur + dir;
  if (next < 0 || next >= tests.length) return;
  selectedIdx = next;
  renderLatest();
  renderSubjectChartWithNav();
  renderRankDiff();
}

function renderLatest() {
  const latestIdx = getDisplayIdx();
  if (latestIdx < 0) { document.getElementById('latestCard').style.display = 'none'; return; }
  document.getElementById('latestCard').style.display = '';

  const t = tests[latestIdx];
  const latest = data[t.date] || {};

  // 前回データ（1つ前でデータがある回）
  let prev = null;
  for (let i = latestIdx - 1; i >= 0; i--) {
    const d = data[tests[i].date];
    if (d && d.hensachi4 != null) { prev = d; break; }
  }

  // タイトル部分（ナビボタン付き）
  const isFirst = latestIdx === 0;
  const isLast  = latestIdx === tests.length - 1;
  document.getElementById('latestTitle').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;width:100%;">
      <button onclick="moveSelected(-1)" style="
        background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
        color:${isFirst ? '#444' : '#e9d5ff'};border-radius:8px;
        font-size:16px;padding:4px 10px;cursor:${isFirst ? 'default' : 'pointer'};"
        ${isFirst ? 'disabled' : ''}>‹</button>
      <span style="flex:1;text-align:center;font-size:14px;">⭐ ${t.label}</span>
      <button onclick="moveSelected(1)" style="
        background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
        color:${isLast ? '#444' : '#e9d5ff'};border-radius:8px;
        font-size:16px;padding:4px 10px;cursor:${isLast ? 'default' : 'pointer'};"
        ${isLast ? 'disabled' : ''}>›</button>
    </div>
  `;

  function diffStr(cur, pre, key) {
    if (!pre || pre[key] == null || cur[key] == null) return '';
    const d = +(cur[key] - pre[key]).toFixed(1);
    if (d > 0) return `<div class="diff-up">↑${d}</div>`;
    if (d < 0) return `<div class="diff-down">↓${Math.abs(d)}</div>`;
    return `<div class="diff-same">→ 同じ</div>`;
  }
  function rankStr(j, n) {
    if (j == null) return '';
    return n != null ? `${j}位 / ${n}人中` : `${j}位`;
  }

  const boxes = [
    { lbl: '4科目 偏差値', val: latest.hensachi4, color: '#a78bfa', dk: 'hensachi4', score: latest.tokuten4, rank: rankStr(latest.juni4, latest.ninzu4) },
    { lbl: '2科目 偏差値', val: latest.hensachi2, color: '#38bdf8', dk: 'hensachi2', score: latest.tokuten2, rank: rankStr(latest.juni2, latest.ninzu2) },
    { lbl: '算数', val: latest.sansu,   color: '#60a5fa', dk: 'sansu',  score: latest.sansu_ten,   rank: rankStr(latest.sansu_juni,  null) },
    { lbl: '国語', val: latest.kokugo,  color: '#f472b6', dk: 'kokugo', score: latest.kokugo_ten,  rank: rankStr(latest.kokugo_juni, null) },
    { lbl: '理科', val: latest.rika,    color: '#4ade80', dk: 'rika',   score: latest.rika_ten,    rank: rankStr(latest.rika_juni,   null) },
    { lbl: '社会', val: latest.shakai,  color: '#fbbf24', dk: 'shakai', score: latest.shakai_ten,  rank: rankStr(latest.shakai_juni, null) },
  ];

  document.getElementById('latestGrid').innerHTML = boxes.map(b => `
    <div class="stat-box">
      <div class="lbl">${b.lbl}</div>
      <div class="val" style="color:${b.color}">${b.val ?? '—'}</div>
      ${b.score != null ? `<div class="rank-score">${b.score}点</div>` : ''}
      ${b.rank   ? `<div class="rank-str">${b.rank}</div>` : ''}
      ${b.val != null ? diffStr(latest, prev, b.dk) : ''}
    </div>
  `).join('');
}

function renderTable() {
  const tbl = document.getElementById('resultTable');
  tbl.innerHTML = `
    <tr>
      <th rowspan="2">実施日</th>
      <th colspan="3">4科目</th>
      <th colspan="3">2科目</th>
      <th colspan="3">算数</th>
      <th colspan="3">国語</th>
      <th colspan="3">理科</th>
      <th colspan="3">社会</th>
    </tr>
    <tr>
      <th>偏差値</th><th>得点</th><th>順位</th>
      <th>偏差値</th><th>得点</th><th>順位</th>
      <th style="font-size:10px;">偏差値</th><th style="font-size:10px;">得点</th><th style="font-size:10px;">順位</th>
      <th style="font-size:10px;">偏差値</th><th style="font-size:10px;">得点</th><th style="font-size:10px;">順位</th>
      <th style="font-size:10px;">偏差値</th><th style="font-size:10px;">得点</th><th style="font-size:10px;">順位</th>
      <th style="font-size:10px;">偏差値</th><th style="font-size:10px;">得点</th><th style="font-size:10px;">順位</th>
    </tr>
  `;

  // 各列の最良値を計算（高いほど良い列 / 低いほど良い列）
  const maxKeys = ['hensachi4','tokuten4','hensachi2','tokuten2',
                   'sansu','sansu_ten','kokugo','kokugo_ten',
                   'rika','rika_ten','shakai','shakai_ten'];
  const minKeys = ['juni4','juni2','sansu_juni','kokugo_juni','rika_juni','shakai_juni'];
  const best = {};
  maxKeys.forEach(k => {
    const vals = tests.map(t => (data[t.date] || {})[k]).filter(v => v != null);
    if (vals.length) best[k] = Math.max(...vals);
  });
  minKeys.forEach(k => {
    const vals = tests.map(t => (data[t.date] || {})[k]).filter(v => v != null);
    if (vals.length) best[k] = Math.min(...vals);
  });

  // ハイライトスタイル
  const BEST = 'background:rgba(250,204,21,0.18);border-radius:6px;font-weight:bold;';
  const CROWN = '👑 ';
  function cell(val, key, cls, isRank) {
    if (val == null) return `<td class="${cls}"><span class="no-data">—</span></td>`;
    const isBest = best[key] != null && val === best[key];
    const style = isBest ? ` style="${BEST}"` : '';
    const prefix = isBest ? CROWN : '';
    if (isRank) {
      return `<td class="${cls}"${style}>${prefix}${val}位</td>`;
    }
    return `<td class="${cls}"${style}>${prefix}${val}</td>`;
  }
  function rankCell(j, n, key) {
    if (j == null) return `<td><span class="no-data">—</span></td>`;
    const isBest = best[key] != null && j === best[key];
    const style = isBest ? ` style="${BEST}"` : '';
    const prefix = isBest ? CROWN : '';
    const sub = n != null ? `<br><span style="font-size:10px;color:#c4b5fd;">/${n}人</span>` : '';
    return `<td${style}>${prefix}${j}位${sub}</td>`;
  }

  tests.forEach(t => {
    const d = data[t.date] || {};
    tbl.innerHTML += `<tr>
      <td style="font-weight:bold;white-space:nowrap;">${t.date}</td>
      ${cell(d.hensachi4,'hensachi4','c-4k')}
      ${cell(d.tokuten4,'tokuten4','')}
      ${rankCell(d.juni4,d.ninzu4,'juni4')}
      ${cell(d.hensachi2,'hensachi2','c-4k')}
      ${cell(d.tokuten2,'tokuten2','')}
      ${rankCell(d.juni2,d.ninzu2,'juni2')}
      ${cell(d.sansu,'sansu','c-sansu')}${cell(d.sansu_ten,'sansu_ten','c-sansu')}${cell(d.sansu_juni,'sansu_juni','c-sansu',true)}
      ${cell(d.kokugo,'kokugo','c-kokugo')}${cell(d.kokugo_ten,'kokugo_ten','c-kokugo')}${cell(d.kokugo_juni,'kokugo_juni','c-kokugo',true)}
      ${cell(d.rika,'rika','c-rika')}${cell(d.rika_ten,'rika_ten','c-rika')}${cell(d.rika_juni,'rika_juni','c-rika',true)}
      ${cell(d.shakai,'shakai','c-shakai')}${cell(d.shakai_ten,'shakai_ten','c-shakai')}${cell(d.shakai_juni,'shakai_juni','c-shakai',true)}
    </tr>`;
  });
}

    <div style="display:flex;align-items:center;gap:8px;width:100%;">
      <button onclick="moveSelected(-1)" style="
        background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);

        font-size:16px;padding:4px 10px;cursor:${isFirst ? 'default' : 'pointer'};"

      <button onclick="moveSelected(1)" style="
        background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
        color:${isLast ? '#444' : '#e9d5ff'};border-radius:8px;
        font-size:16px;padding:4px 10px;cursor:${isLast ? 'default' : 'pointer'};"
        ${isLast ? 'disabled' : ''}>›</button>
    </div>
  `;

  const curD = t ? (data[t.date] || {}) : {};
  // 前回データ
  let prevD = null;
  for (let i = idx - 1; i >= 0; i--) {
    const d = data[tests[i].date];
    if (d && d.sansu != null) { prevD = d; break; }
  }

  if (subjectChart) subjectChart.destroy();
  subjectChart = new Chart(document.getElementById('subjectChart'), {
    type: 'bar',
    data: {
      labels: ['算数', '国語', '理科', '社会'],
      datasets: [{
        label: '偏差値',
        data: [curD.sansu ?? null, curD.kokugo ?? null, curD.rika ?? null, curD.shakai ?? null],
        backgroundColor: ['rgba(96,165,250,0.6)','rgba(244,114,182,0.6)','rgba(74,222,128,0.6)','rgba(251,191,36,0.6)'],
        borderColor: ['#60a5fa','#f472b6','#4ade80','#fbbf24'],
        borderWidth: 2, borderRadius: 6,
      }]
    },
    options: { ...JSON.parse(JSON.stringify(CHART_OPTS)), plugins: { legend: { display: false } } }
  });

  // 前回比 diff 表示
  const SUBJECTS = [
    { key: 'sansu',  label: '算数', color: '#60a5fa' },
    { key: 'kokugo', label: '国語', color: '#f472b6' },
    { key: 'rika',   label: '理科', color: '#4ade80' },
    { key: 'shakai', label: '社会', color: '#fbbf24' },
  ];
  const diffEl = document.getElementById('subjectDiff');
  if (prevD) {
    diffEl.innerHTML = SUBJECTS.map(s => {
      const cur = curD[s.key];
      const pre = prevD[s.key];
      if (cur == null) return `<div style="text-align:center;"><div style="font-size:10px;color:#7c6fa0;">${s.label}</div><div style="font-size:12px;color:#7c6fa0;">—</div></div>`;
      let diffHtml = '';
      if (pre != null) {
        const d = +(cur - pre).toFixed(1);
        if (d > 0) diffHtml = `<div class="diff-up">↑${d}</div>`;
        else if (d < 0) diffHtml = `<div class="diff-down">↓${Math.abs(d)}</div>`;
        else diffHtml = `<div class="diff-same">→ 同じ</div>`;
      }
      return `<div style="text-align:center;background:rgba(255,255,255,0.04);border-radius:10px;padding:6px 4px;">
        <div style="font-size:10px;color:${s.color};font-weight:bold;margin-bottom:2px;">${s.label}</div>
        <div style="font-size:18px;font-weight:bold;color:${s.color};">${cur}</div>
        ${diffHtml}
        ${pre != null ? `<div style="font-size:10px;color:#7c6fa0;">前回 ${pre}</div>` : ''}
      </div>`;
    }).join('');
  } else {
    diffEl.innerHTML = '';
  }
}

// ---- 順位グラフ ----
// 科目別順位の母数：算数・国語は2科受験者数、理科・社会は4科受験者数を使う
const RANK_SUBJECTS = [
  { key: 'sansu_juni',  nKey: 'ninzu2', label: '算数', color: '#60a5fa' },
  { key: 'kokugo_juni', nKey: 'ninzu2', label: '国語', color: '#f472b6' },
  { key: 'rika_juni',   nKey: 'ninzu4', label: '理科', color: '#4ade80' },
  { key: 'shakai_juni', nKey: 'ninzu4', label: '社会', color: '#fbbf24' },
];

function setRankMode(mode) {
  rankMode = mode;
  document.getElementById('modeBtnJuni').classList.toggle('active', mode === 'juni');
  document.getElementById('modeBtnPct').classList.toggle('active', mode === 'pct');
  renderRankCharts();
}

function toPct(j, n) {
  if (j == null || !n) return null;
  return +(j / n * 100).toFixed(1);
}

function rankChartOpts(isPct) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { labels: { color: '#e9d5ff', font: { size: 12 } } },
      tooltip: {
        callbacks: {
          label: ctx => {
            const raw = ctx.dataset.rawInfo ? ctx.dataset.rawInfo[ctx.dataIndex] : null;
            if (!raw) return `${ctx.dataset.label}: —`;
            const p = raw.pct != null ? `（上位 ${raw.pct}%）` : '';
            const n = raw.n != null ? ` / ${raw.n}人中` : '';
            return `${ctx.dataset.label}: ${raw.juni}位${n}${p}`;
          }
        }
      }
    },
    scales: {
      x: { ticks: { color: '#c4b5fd' }, grid: { color: 'rgba(167,139,250,0.1)' } },
      y: {
        reverse: true,                       // 上に行くほど good（1位が一番上）
        min: isPct ? 0 : 1,
        max: isPct ? 100 : undefined,
        ticks: {
          color: '#c4b5fd',
          callback: v => isPct ? v + '%' : v + '位'
        },
        grid: { color: 'rgba(167,139,250,0.1)' }
      }
    }
  };
}

// 1系列ぶんのデータセットを作る
function rankDataset(label, color, jKey, nKey, isPct, dash) {
  const rawInfo = tests.map(t => {
    const d = data[t.date] || {};
    if (d[jKey] == null) return null;
    return { juni: d[jKey], n: d[nKey] ?? null, pct: toPct(d[jKey], d[nKey]) };
  });
  const values = rawInfo.map(r => !r ? null : (isPct ? r.pct : r.juni));
  return {
    label, data: values, rawInfo,
    borderColor: color,
    backgroundColor: color + '22',
    tension: 0, pointRadius: 5, spanGaps: true,
    ...(dash ? { borderDash: [5, 3] } : {})
  };
}

function renderRankCharts() {
  const labels = tests.map(t => t.date);
  const isPct = rankMode === 'pct';

  // ① 4科・2科の順位推移
  if (rankChart) rankChart.destroy();
  rankChart = new Chart(document.getElementById('rankChart'), {
    type: 'line',
    data: { labels, datasets: [
      rankDataset('4科目', '#a78bfa', 'juni4', 'ninzu4', isPct, false),
      rankDataset('2科目', '#38bdf8', 'juni2', 'ninzu2', isPct, true),
    ]},
    options: rankChartOpts(isPct)
  });

  // ② 科目別の順位推移
  if (subjectRankChart) subjectRankChart.destroy();
  subjectRankChart = new Chart(document.getElementById('subjectRankChart'), {
    type: 'line',
    data: { labels, datasets: RANK_SUBJECTS.map(s =>
      rankDataset(s.label, s.color, s.key, s.nKey, isPct, false)
    )},
    options: rankChartOpts(isPct)
  });

  renderRankDiff();

  document.getElementById('rankNote').innerHTML = isPct
    ? '※ 上位% ＝ 順位 ÷ 受験者数。小さいほど good（グラフの上ほど上位）<br>受験者数が回によって違うので、実力の変化はこちらが分かりやすいです'
    : '※ グラフの上に行くほど順位が良い（1位が一番上）です<br>受験者数が増えると順位も下がりやすいので「上位%」も見てみましょう';
}

// 最新回の順位を前回と比べて表示
function renderRankDiff() {
  const el = document.getElementById('rankDiff');
  const idx = getDisplayIdx();
  if (idx < 0) { el.innerHTML = ''; return; }

  const cur = data[tests[idx].date] || {};
  let prev = null;
  for (let i = idx - 1; i >= 0; i--) {
    const d = data[tests[i].date];
    if (d && d.juni4 != null) { prev = d; break; }
  }

  const boxes = [
    { lbl: '4科目 順位', j: 'juni4', n: 'ninzu4', color: '#a78bfa' },
    { lbl: '2科目 順位', j: 'juni2', n: 'ninzu2', color: '#38bdf8' },
  ];

  el.innerHTML = boxes.map(b => {
    const j = cur[b.j], n = cur[b.n];
    if (j == null) {
      return `<div style="text-align:center;background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 4px;">
        <div style="font-size:10px;color:#7c6fa0;">${b.lbl}</div>
        <div style="font-size:14px;color:#7c6fa0;">—</div></div>`;
    }
    const pct = toPct(j, n);
    let diffHtml = '';
    if (prev && prev[b.j] != null) {
      const d = prev[b.j] - j;   // 順位は数字が減ると good
      if (d > 0)      diffHtml = `<div class="diff-up">↑ ${d}人ぬいた</div>`;
      else if (d < 0) diffHtml = `<div class="diff-down">↓ ${Math.abs(d)}人ぬかれた</div>`;
      else            diffHtml = `<div class="diff-same">→ 同じ</div>`;
    }
    return `<div style="text-align:center;background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 4px;">
      <div style="font-size:10px;color:${b.color};font-weight:bold;margin-bottom:2px;">${b.lbl}</div>
      <div style="font-size:20px;font-weight:bold;color:${b.color};">${j}<span style="font-size:12px;">位</span></div>
      ${n != null ? `<div style="font-size:10px;color:#c4b5fd;">/ ${n}人中　上位 ${pct}%</div>` : ''}
      ${diffHtml}
    </div>`;
  }).join('');
}

// 「4科偏差値61.2（318点・116位/1072人・上位10.8%）」のような1かたまりを作る
// 値が無い項目は書かない（—を並べてもAIには意味がないため）
function advicePart(d, m) {
  const h     = m.h     ? d[m.h]     : null;
  const ten   = m.ten   ? d[m.ten]   : null;
  const juni  = m.juni  ? d[m.juni]  : null;
  const ninzu = m.ninzu ? d[m.ninzu] : null;
  if (h == null && ten == null && juni == null) return null;

  const detail = [];
  if (ten != null) detail.push(ten + '点');
  if (juni != null) {
    detail.push(ninzu ? `${juni}位/${ninzu}人・上位${(juni / ninzu * 100).toFixed(1)}%` : `${juni}位`);
  }
  return m.label + (h != null ? `偏差値${h}` : '')
       + (detail.length ? `（${detail.join('・')}）` : '');
}

function adviceRowText(date) {
  const d = data[date] || {};
  const totals = ADVICE_META.totals.map(m => advicePart(d, m)).filter(Boolean);
  const subs   = ADVICE_META.subjects.map(m => advicePart(d, m)).filter(Boolean);
  if (!totals.length && !subs.length) return null;
  return [totals.join(' / '), subs.join(' ')].filter(s => s).join('  ／  ');
}

function buildAdvicePrompt() {
  const rows = [];
  tests.forEach(t => {
    const line = adviceRowText(t.date);
    if (line) rows.push(`${t.label}　${line}`);
  });
  if (!rows.length) return null;

  const idx = getDisplayIdx();
  const latest = (idx >= 0 && adviceRowText(tests[idx].date))
    ? `${tests[idx].label}　${adviceRowText(tests[idx].date)}`
    : rows[rows.length - 1];

  return `あなたは中学受験の家庭教師「ケンケン先生」です。
小学4年生が読んでわかるやさしい言葉で、絵文字も使って楽しく答えてください。

・あいさつや前置きは書かない`;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function openAdviceModal() {
  const prompt = buildAdvicePrompt();
  if (!prompt) { alert('先に成績を入力してね'); return; }

  // クリック直後に同期で書き込む（iOSは非同期を挟むと失敗する）
  navigator.clipboard.writeText(prompt).catch(() => {});

  document.getElementById('adviceBody').innerHTML = `
    <p style="font-size:13px;color:#c4b5fd;line-height:1.6;margin-bottom:10px;">
      質問文をコピーしたよ！📋<br>
      Geminiが開いたら、入力らんを長押し →「ペースト」して送ってね✨
    </p>
    <textarea class="advice-text" id="adviceText" readonly onclick="this.select()">${escapeHtml(prompt)}</textarea>
    <button class="advice-gemini-btn" onclick="window.open('${GEMINI_URL}','_blank')">🤖 Geminiを開く</button>
    <div class="advice-sub-btns">
      <button onclick="copyAdvice()">📋 もう一度コピー</button>
      <button onclick="closeAdviceModal()">とじる</button>
    </div>
    <div class="advice-copied" id="adviceCopied"></div>
  `;
  document.getElementById('adviceModal').classList.add('open');
}

function closeAdviceModal() {
  document.getElementById('adviceModal').classList.remove('open');
}

function copyAdvice() {
  const el = document.getElementById('adviceText');
  el.select();
  el.setSelectionRange(0, 99999);
  const done = () => { document.getElementById('adviceCopied').textContent = '✅ コピーしたよ！'; };
  navigator.clipboard.writeText(el.value).then(done).catch(() => {
    try { document.execCommand('copy'); done(); } catch(e) {}
  });
}
