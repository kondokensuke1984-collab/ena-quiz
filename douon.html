<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタル国語学習ワークシート - 説明的文章(4)＆同音異義語</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Noto+Serif+JP:wght@400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">

  <style>
    .font-mincho { font-family: 'Noto Serif JP', 'Sawarabi Mincho', Georgia, serif; }
    .font-maru   { font-family: 'Kiwi Maru', sans-serif; }
    .vertical-text { writing-mode: vertical-rl; text-combine-upright: all; font-feature-settings: "pkna"; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .genko-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; }
    @keyframes pulse-yellow {
      0%, 100% { background-color: rgba(253, 224, 71, 0.2); }
      50%       { background-color: rgba(253, 224, 71, 0.6); }
    }
    .pulse-highlight { animation: pulse-yellow 2s infinite; border-radius: 4px; padding: 2px 4px; }
  </style>
</head>
<body class="bg-[#f5f4f0] text-[#2c3e50] font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const homophoneQuiz = [
      { id:1, sentence:"今回のテストの（　　）と解説をよく読む。",       options:["解答","回答","街頭"],  correct:"解答",  desc:"「解答」は問題を解いて答えを出すこと。「回答」は質問や要望に答えること。" },
      { id:2, sentence:"自分の将来の（　　）をはっきりと表明する。",     options:["意思","意志","医師"],  correct:"意志",  desc:"「意志」は何かをしようとする強い志・決意。「意思」は考えや思い（意思表示など）。" },
      { id:3, sentence:"予想（　　）の出来事に、みんなが驚いた。",       options:["意外","以外","遺害"],  correct:"意外",  desc:"「意外」は考えていたことと違って驚く様子。「以外」はそれを除いた他のこと。" },
      { id:4, sentence:"真理を（　　）するために、日夜研究に励む。",     options:["追求","追究","追及"],  correct:"追究",  desc:"「追究」は学問や真理などを深く突き詰めること。「追求」は目的のものを追い求めること。「追及」は責任や犯人を追い詰めること。" }
    ];

    function App() {
      const [activeTab, setActiveTab]                     = useState('reading');
      const [fontSize, setFontSize]                       = useState('lg');
      const [layoutDirection, setLayoutDirection]         = useState('horizontal');
      const [activeQuestionFocus, setActiveQuestionFocus] = useState(null);

      const [answers, setAnswers] = useState({
        q1_A:'', q1_B:'', q1_C:'', q1_D:'', q1_E:'', q1_F:'',
        q2_start:'', q2_end:'',
        q3_start:'', q3_end:'',
        q4:'', q5_G:'', q5_H:'', q6:''
      });

      const [graded, setGraded]   = useState(false);
      const [results, setResults] = useState({});
      const [score, setScore]     = useState(0);

      const [homophoneIndex,    setHomophoneIndex]    = useState(0);
      const [homophoneSelected, setHomophoneSelected] = useState('');
      const [homophoneGraded,   setHomophoneGraded]   = useState(false);
      const [homophoneScore,    setHomophoneScore]    = useState(0);

      const [showHints, setShowHints] = useState({ q2:false, q3:false, q5:false, q6:false });

      const lineRefs = { line1:useRef(null), line2:useRef(null), line3:useRef(null), line4:useRef(null) };

      const correctAnswers = {
        q1_A:'キ', q1_B:'ウ', q1_C:'ア', q1_D:'カ', q1_E:'エ', q1_F:'イ',
        q2_start:'そもそも日', q2_end:'違っている',
        q3_start:'お互いの気', q3_end:'し出すこと',
        q4:'エ', q5_G:'個', q5_H:'関係性'
      };

      const scrollToLine = (n) => {
        setActiveQuestionFocus(n);
        lineRefs[`line${n}`]?.current?.scrollIntoView({ behavior:'smooth', block:'center' });
        setTimeout(() => setActiveQuestionFocus(null), 4000);
      };

      const handleGrading = () => {
        let t = {}, points = 0;
        ['A','B','C','D','E','F'].forEach(k => {
          const ok = answers[`q1_${k}`] === correctAnswers[`q1_${k}`];
          t[`q1_${k}`] = ok; if (ok) points += 5;
        });
        const q2ok = answers.q2_start.trim() === correctAnswers.q2_start && answers.q2_end.trim() === correctAnswers.q2_end;
        t.q2 = q2ok; if (q2ok) points += 15;
        const q3ok = answers.q3_start.trim() === correctAnswers.q3_start && answers.q3_end.trim() === correctAnswers.q3_end;
        t.q3 = q3ok; if (q3ok) points += 15;
        const q4ok = answers.q4 === correctAnswers.q4;
        t.q4 = q4ok; if (q4ok) points += 10;
        const q5Gok = answers.q5_G.trim() === correctAnswers.q5_G;
        const q5Hok = answers.q5_H.trim() === correctAnswers.q5_H;
        t.q5_G = q5Gok; if (q5Gok) points += 10;
        t.q5_H = q5Hok; if (q5Hok) points += 10;
        const q6t = answers.q6.trim();
        const q6ok = q6t.length >= 35 && q6t.length <= 45
          && q6t.includes('他者') && q6t.includes('影響')
          && (q6t.includes('文脈') || q6t.includes('関係') || q6t.includes('状況'));
        t.q6 = q6ok; if (q6ok) points += 10;

        // メインアプリのlocalStorageに反映
        try {
          const key = 'ena_stats_202606';
          const s = JSON.parse(localStorage.getItem(key) || '{}');
          const prev = s['douon'] || { correct:0, total:0 };
          s['douon'] = { correct: prev.correct + points, total: prev.total + 100 };
          localStorage.setItem(key, JSON.stringify(s));
        } catch(e) {}

        setResults(t); setScore(points); setGraded(true);
      };

      const handleReset = () => {
        setAnswers({ q1_A:'', q1_B:'', q1_C:'', q1_D:'', q1_E:'', q1_F:'', q2_start:'', q2_end:'', q3_start:'', q3_end:'', q4:'', q5_G:'', q5_H:'', q6:'' });
        setGraded(false); setResults({}); setScore(0);
      };

      const handleHomophoneSubmit = (option) => {
        setHomophoneSelected(option); setHomophoneGraded(true);
        if (option === homophoneQuiz[homophoneIndex].correct) setHomophoneScore(p => p + 1);
      };
      const nextHomophone = () => {
        setHomophoneIndex(p => (p + 1) % homophoneQuiz.length);
        setHomophoneSelected(''); setHomophoneGraded(false);
      };


      const inputCls = (ok) =>
        `w-full p-2 text-sm border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 font-mincho tracking-widest text-center ${graded ? (ok ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-rose-300 bg-rose-50 text-rose-800') : 'border-slate-300'}`;

      return (
        <div className="flex flex-col min-h-screen">

          {/* ヘッダー */}
          <header className="bg-gradient-to-r from-[#5a7264] to-[#405347] text-white shadow-md p-4 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-3">
                <div className="bg-white text-[#405347] font-bold px-3 py-1.5 rounded-lg text-lg shadow-inner font-sans">国語 11</div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold font-mincho">デジタル国語学習ワークシート</h1>
                  <p className="text-xs text-emerald-100 font-sans">説明的文章(4) 同音異義語 ／ 榎本博明『〈自分らしさ〉って何だろう？』</p>
                </div>
              </div>
              <nav className="flex bg-[#2f3e34] rounded-full p-1 shadow-inner">
                <button onClick={() => setActiveTab('reading')}   className={`px-5 py-1.5 rounded-full text-sm font-semibold transition ${activeTab === 'reading'   ? 'bg-white text-[#405146] shadow' : 'text-slate-200 hover:text-white'}`}>
                  📖 本文読解＆問題
                </button>
                <button onClick={() => setActiveTab('homophone')} className={`px-5 py-1.5 rounded-full text-sm font-semibold transition ${activeTab === 'homophone' ? 'bg-white text-[#405146] shadow' : 'text-slate-200 hover:text-white'}`}>
                  🏆 同音異義語クイズ
                </button>
              </nav>
            </div>
          </header>

          {activeTab === 'reading' ? (
            <main className="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-6">

              {/* 左：本文 */}
              <section className="md:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:h-[calc(100vh-140px)] md:min-h-[550px]">
                <div className="bg-slate-50 border-b border-slate-200 p-3 flex flex-wrap justify-between items-center gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-white bg-emerald-700 px-2.5 py-1 rounded-full font-sans">本文</span>
                    <h2 className="text-sm font-bold text-slate-700 font-mincho">榎本博明『〈自分らしさ〉って何だろう？』</h2>
                  </div>
                  <div className="flex flex-wrap items-center gap-3 text-xs font-sans">
                    <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-0.5">
                      <button onClick={() => setLayoutDirection('horizontal')} className={`px-2 py-1 rounded flex items-center gap-1 ${layoutDirection === 'horizontal' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-slate-500'}`}>
                        横書き
                      </button>
                      <button onClick={() => setLayoutDirection('vertical')} className={`px-2 py-1 rounded flex items-center gap-1 ${layoutDirection === 'vertical' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-slate-500'}`}>
                        縦書き
                      </button>
                    </div>
                    <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-0.5">
                      <button onClick={() => setFontSize('md')} className={`px-2 py-1 rounded ${fontSize === 'md' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-slate-500'}`}>小</button>
                      <button onClick={() => setFontSize('lg')} className={`px-2 py-1 rounded ${fontSize === 'lg' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-slate-500'}`}>中</button>
                      <button onClick={() => setFontSize('xl')} className={`px-2 py-1 rounded ${fontSize === 'xl' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-slate-500'}`}>大</button>
                    </div>
                  </div>
                </div>

                <div className={`md:flex-1 md:overflow-auto p-6 sm:p-8 bg-[#faf9f5] selection:bg-amber-100 transition-all duration-300 ${layoutDirection === 'vertical' ? 'vertical-text flex flex-row-reverse md:h-full md:max-h-full pr-10 pl-6' : 'block md:h-full'}`}>
                  <div className={`font-mincho leading-loose tracking-widest ${layoutDirection === 'vertical' ? 'h-full flex flex-row-reverse gap-8 text-lg' : 'space-y-6'} ${fontSize === 'md' ? 'text-sm' : fontSize === 'lg' ? 'text-base sm:text-lg' : 'text-xl sm:text-2xl'}`}>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      日本人（あるいは東洋人）は自己主張が苦手だと言われる。グローバル化の時代だし、もっと自己主張ができるようにならないといけないなどと言う人もいる。でも、本人が自己主張が苦手なのには理由がある。そして、それはけっして悪いことではない。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      <span ref={lineRefs.line1} className={`inline-block transition-all duration-500 rounded-lg p-1 ${activeQuestionFocus === 1 ? 'pulse-highlight ring-2 ring-red-400' : ''}`}>
                        <span className="inline-flex items-center justify-center bg-red-600 text-white text-xs font-bold font-sans rounded px-1.5 py-0.5 mr-1 align-middle">線 ①</span>
                        <span className="border-b-4 border-red-500 pb-0.5 font-bold text-slate-900 bg-red-50/50">アメリカ人は堂々と自己主張ができるのに、僕たち日本人はなぜうまく自己主張ができないのか。</span>
                      </span>
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      それは、そもそも日本人とアメリカ人では自己のあり方が違っていて、コミュニケーションの法則がまったく違っているからだ。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      アメリカ人にとって、コミュニケーションの最も重要な役割は、相手を説得し、自分の意見を通すことだ。お互いにそういうつもりでコミュニケーションをするため、遠慮のない自己主張がぶつかり合う。お互いの意見がぶつかり合うのは日常茶飯事なため、まったく気にならない。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      <span className="bg-yellow-200 text-yellow-950 font-bold px-2 py-0.5 rounded border border-yellow-400 mr-1 font-sans text-xs">A</span>
                      、日本人にとって、コミュニケーションの最も重要な役割は何だろう（
                      <span ref={lineRefs.line2} className={`inline-block transition-all duration-500 rounded-lg p-1 ${activeQuestionFocus === 2 ? 'pulse-highlight ring-2 ring-emerald-400' : ''}`}>
                        <span className="inline-flex items-center justify-center bg-emerald-700 text-white text-xs font-bold font-sans rounded px-1.5 py-0.5 mr-1 align-middle">線 ②</span>
                        <span className="border-b-4 border-emerald-500 pb-0.5 font-bold text-slate-950 bg-emerald-50/50">日本人にとって、コミュニケーションの最も重要な役割は何だろう</span>
                      </span>
                      ）。相手を説得して自分の意見を通すことだろうか。そうではないだろう。僕たちは、自分の意見を通そうというより前に、相手はどうしたいんだろう、どんな考えなんだろうと、相手の意向を気にする。そして、できることなら相手の期待を裏切らないような方向に話をまとめたいと思う。意見が対立するようなことはできるだけ避けたい。そうでないと気まずい。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      <span className="bg-yellow-200 text-yellow-950 font-bold px-2 py-0.5 rounded border border-yellow-400 mr-1 font-sans text-xs">B</span>
                      、僕たち日本人にとっては、コミュニケーションの最も重要な役割は、お互いの気持ちを結びつけ、良好な場の雰囲気を醸し出すことなのだ。強烈な自己主張によって相手を説き伏せることではない。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      <span className="bg-yellow-200 text-yellow-950 font-bold px-2 py-0.5 rounded border border-yellow-400 mr-1 font-sans text-xs">C</span>
                      、自己主張のスキルを磨かずに育つことになる。自己主張が苦手なのは当然なのだ。その代わりに相手の気持ちを察する共感性を磨いて育つため、相手の意向や気持ちを汲み取ることができる。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      相手の意向を汲み取って動くというのは、僕たち日本人の行動原理といってもいい。コミュニケーションの場面だけではない。
                      <span className="bg-yellow-200 text-yellow-950 font-bold px-2 py-0.5 rounded border border-yellow-400 mr-1 font-sans text-xs">D</span>
                      、何かを頑張るとき、ひたすら自分のためというのが欧米式だとすると、僕たち日本人は、
                      <span ref={lineRefs.line3} className={`inline-block transition-all duration-500 rounded-lg p-1 ${activeQuestionFocus === 3 ? 'pulse-highlight ring-2 ring-blue-400' : ''}`}>
                        <span className="inline-flex items-center justify-center bg-blue-600 text-white text-xs font-bold font-sans rounded px-1.5 py-0.5 mr-1 align-middle">線 ③</span>
                        <span className="border-b-4 border-blue-500 pb-0.5 font-bold text-slate-900 bg-blue-50/50">だれかのため</span>
                      </span>
                      という思いがわりと大きい。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      親を喜ばせるため、
                      <span className="bg-yellow-200 text-yellow-950 font-bold px-2 py-0.5 rounded border border-yellow-400 mr-1 font-sans text-xs">E</span>
                      親を悲しませないために勉強を頑張る、ピアノを頑張る。先生の期待を裏切らないためにきちんと役割を果たす。そんなところが多分にある。大人だって、監督のために何としても優勝したいなんて言ったりするし、優勝すると監督の期待に応えることができてホッとしていると言ったりする。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      自分の中に息づいているだれかのために頑張るのだ。もちろん自分のためでもあるのだが、自分だけのためではない。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      このような意向や期待を気にする日本的な心のあり方は、「他人の意向を気にするなんて自主性がない」とか「自分がない」などと批判されることがある。
                      <span className="bg-yellow-200 text-yellow-950 font-bold px-2 py-0.5 rounded border border-yellow-400 mr-1 font-sans text-xs">F</span>
                      、それは欧米的な価値観に染まった見方に過ぎない。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      教育心理学者の東洋は、日本人の他者志向を未熟とみなすのは欧米流であって、他者との絆を強化し、他者との絆を自分のなかに取り込んでいくのも、一つの発達の方向性とみなすべきではないかという。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      そもそも欧米人と日本人では自己のあり方が違う。僕たち日本人が、率直な自己主張をぶつけ合って議論するよりも、だれも傷つけないように気をつかい、気まずくならないように配慮するのも、欧米人のように（ <span className="font-bold border-b-2 border-rose-400 px-2 bg-rose-50 text-rose-800">G</span> ）を生きているのではなくて、（ <span className="font-bold border-b-2 border-indigo-400 px-2 bg-indigo-50 text-indigo-800">H</span> ）を生きているからだ。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      心理学者のマークスと北山忍は、アメリカ的な独立的自己観と日本的な相互協調的自己観を対比させている。独立的自己観では、個人の自己は他者や状況といった社会的文脈から切り離され、そうしたもの影響を受けない独自の存在とみなされる。そのため個人の行動は本人自身の意向によって決まると考える。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      それに対して、
                      <span ref={lineRefs.line4} className={`inline-block transition-all duration-500 rounded-lg p-1 ${activeQuestionFocus === 4 ? 'pulse-highlight ring-2 ring-purple-400' : ''}`}>
                        <span className="inline-flex items-center justify-center bg-purple-600 text-white text-xs font-bold font-sans rounded px-1.5 py-0.5 mr-1 align-middle">線 ④</span>
                        <span className="border-b-4 border-purple-500 pb-0.5 font-bold text-slate-900 bg-purple-50/50">相互協調的自己観</span>
                      </span>
                      では、個人の自己は他者や状況といった社会的文脈と強く結びついており、影響を強く受けるとされる。そのため個人の行動は他者との関係性や周囲の状況に大いに左右されると考える。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      このような相互協調的自己観をもつ僕たち日本人は、個としての自己を生きているのではなく、関係性としての自己を生きている。関係性としての自己は、相手との関係に応じてさまざまに姿を変える。その場その場の関係性にふさわしい自分になる。相手との関係性によって言葉づかいまで違ってくる。欧米人のように相手との関係性に影響を受けない一定不変の自己などというものはない。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      「だれが何と言おうと、私はこう考える」「僕はこう思う」と自分を押し出していく欧米社会では視線恐怖があまり見られないのに対して、自分を押し出すよりも相手の意向を汲み取ろうとする日本人の間には視線恐怖が多い。それは、僕たち日本人は、相手との関係性によって自分の出方を変えなければならないからだ。相手がどう思っているかが気になる。こんなことを言ったら相手はどう感じるだろうかと気になる。それも、僕たちが関係性としての自己を生きているからだ。
                    </p>

                    <p className={layoutDirection === 'vertical' ? 'ml-6' : 'indent-4'}>
                      僕たちの自己は、相手から独立したものではなく、相手との相互依存に基づきものであり、間柄（あいだがら）によって形を変える。僕たちの自己は、相手にとっての「あなた」の要素を取り込む必要がある。だから相手の意向が気になる。相手の視線が気になるのだ。
                    </p>

                    <span className="text-emerald-600 font-sans">正解数: {homophoneScore}</span>
                  </div>
                  <div className="bg-[#fcfbf7] border border-amber-100 rounded-2xl p-6 w-full text-center mb-6 shadow-inner">
                    <p className="text-lg sm:text-xl font-mincho font-bold leading-relaxed text-slate-800">{homophoneQuiz[homophoneIndex].sentence}</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full mb-6">
                    {homophoneQuiz[homophoneIndex].options.map((option, idx) => {
                      const isCorrect  = option === homophoneQuiz[homophoneIndex].correct;
                      const isSelected = option === homophoneSelected;
                      let s = "border-slate-200 hover:bg-slate-50 text-slate-700";
                      if (homophoneGraded) {
                        if (isCorrect)         s = "border-emerald-500 bg-emerald-50 text-emerald-800 font-bold ring-2 ring-emerald-200";
                        else if (isSelected)   s = "border-rose-400 bg-rose-50 text-rose-800 font-bold ring-2 ring-rose-200";
                        else                   s = "border-slate-100 bg-slate-50/50 text-slate-400 opacity-60";
                      }
                      return (
                        <button key={idx} onClick={() => !homophoneGraded && handleHomophoneSubmit(option)} disabled={homophoneGraded}
                          className={`p-4 border-2 rounded-xl text-base font-bold font-mincho transition duration-150 flex items-center justify-center gap-2 ${s}`}>
                          {option}
                          {homophoneGraded && isCorrect  && '✅'}
                          {homophoneGraded && isSelected && !isCorrect && '❌'}
                        </button>
                      );
                    })}
                  </div>
                  {homophoneGraded && (
                    <div className="w-full bg-emerald-50/40 border border-emerald-100 rounded-xl p-4 mb-6">
                      <div className="flex items-center gap-2 mb-1.5 text-emerald-800 font-bold text-sm">
                        ❓ <span>解説</span>
                      </div>
                      <p className="text-xs text-slate-700 leading-relaxed font-mincho">{homophoneQuiz[homophoneIndex].desc}</p>
                    </div>
                  )}
                  {homophoneGraded && (
                    <button onClick={nextHomophone} className="px-6 py-2.5 bg-[#405146] text-white rounded-xl font-bold hover:bg-[#324037] transition flex items-center gap-1.5 text-sm font-sans">
                      <span>次の問題へ</span>→
                    </button>
                  )}
                </div>
              </div>
            </main>
          )}

          <footer className="bg-slate-800 text-slate-400 py-3 text-center text-xs border-t border-slate-700 font-sans">
            <p>© 2026 デジタル学習教材開発チーム. 本文出典：榎本博明『〈自分らしさ〉って何だろう？』</p>
          </footer>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false }; }
      static getDerivedStateFromError() { return { hasError: true }; }
      render() {
        if (this.state.hasError) {
          return <div style={{padding:'2rem',textAlign:'center'}}>
            <p style={{fontSize:'1.2rem',marginBottom:'1rem'}}>⚠️ 表示エラーが発生しました</p>
            <button onClick={() => this.setState({ hasError: false })}
              style={{padding:'0.5rem 1.5rem',background:'#405146',color:'#fff',borderRadius:'8px',border:'none',fontSize:'1rem',cursor:'pointer'}}>
              もう一度試す
            </button>
          </div>;
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
